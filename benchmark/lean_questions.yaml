          AND business_object_status = 'Active'
    - id: C04.4
      question: Show AR_NPD_Shirting items
      note: >-
        The leakage test. A new subject must drop the Active filter from the
        previous block: 10 rows, not the 5 that leaking Active would give.
      expect_decision: switch
      expected_sql: |
        SELECT business_object_id, business_object_ref_id, business_object_status
        FROM tms_business_object_flat
        WHERE business_object_type = 'AR_NPD_Shirting'
    - id: C04.5
      question: Only the closed ones
      note: The filter now applies to the new subject. Expect 5.
      expect_decision: follow_up
      expected_sql: |
        SELECT business_object_id, business_object_ref_id, business_object_status
        FROM tms_business_object_flat
        WHERE business_object_type = 'AR_NPD_Shirting'
          AND business_object_status = 'Closed'

