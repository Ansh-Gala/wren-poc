  vpp_issue_issues:
    label: Issue
    identifier: issue_id
    name_column: issue_description
    priority:
    - issue_id
    - issue_description
    - raised_on_item
    - issue_status_label
    - issue_owner_name
    - issue_raised_on
    - issue_elapsed_days
    - raised_by_name
    - major_reason_name
    hidden:
    - issue_escalated_level
    - issue_escalated_users
    - issue_modified_on
    - current_issue_owner_modified_on
    - minor_reason_name
    - closed_by_name
    essential:
    - issue_id
    - issue_description
    - issue_raised_on
    optional:
    - issue_elapsed_days
    - issue_closed_on
    on_request:
    - issue_escalated_level
    - issue_escalated_users
    - issue_modified_on
    - current_issue_owner_modified_on
    query_only:
    - issue_status
    - issue_owner_id
    - issue_raised_by_id
    - major_reason_id
    - minor_reason_id
    - issue_is_deleted
    - issue_modified_by_id
    - issue_closed_by_id
    derived:
    - as: raised_on_item
      label: Raised On (item)
      sql: (SELECT string_agg(CASE hm.issue_type WHEN 'common' THEN hp.project_name WHEN 'task' THEN ht.task_name
        WHEN 'subtask' THEN hs.subtask_name END, ', ') FROM vpp_issue_issuehostmappings hm LEFT JOIN vpp_planning_projects
        hp ON hm.issue_type = 'common' AND hp.project_id = hm.host_id LEFT JOIN vpp_planning_tasks ht ON hm.issue_type
        = 'task' AND ht.task_uid = hm.host_id LEFT JOIN vpp_planning_subtasks hs ON hm.issue_type = 'subtask' AND
        hs.subtask_id = hm.host_id WHERE hm.issue_id = i.issue_id)
      tier: essential
    - as: issue_status_label
      label: Status
      sql: CASE i.issue_status WHEN 1 THEN 'Open' WHEN 2 THEN 'Resolved, awaiting closure' WHEN 3 THEN 'Closed'
        END
      tier: essential
      replaces: issue_status
    - as: issue_owner_name
      label: Owner
      sql: REPLACE(io.username, '_deleted_user_' || io.id, '')
      tier: essential
      join: LEFT JOIN vpp_users io ON io.id = i.issue_owner_id
      replaces: issue_owner_id
    - as: raised_by_name
      label: Raised By
      sql: REPLACE(ir.username, '_deleted_user_' || ir.id, '')
      tier: optional
      join: LEFT JOIN vpp_users ir ON ir.id = i.issue_raised_by_id
      replaces: issue_raised_by_id
    - as: major_reason_name
      label: Reason
      sql: imr.major_reason_name
      tier: optional
      join: LEFT JOIN vpp_masterdata_majorreasons imr ON imr.major_reason_id = i.major_reason_id
      replaces: major_reason_id
    - as: minor_reason_name
      label: Sub-reason
      sql: imn.minor_reason_name
      tier: on_request
      join: LEFT JOIN vpp_masterdata_minorreasons imn ON imn.minor_reason_id = i.minor_reason_id
      replaces: minor_reason_id
    - as: closed_by_name
      label: Closed By
      sql: REPLACE(ic.username, '_deleted_user_' || ic.id, '')
      tier: on_request
      join: LEFT JOIN vpp_users ic ON ic.id = i.issue_closed_by_id
      replaces: issue_closed_by_id
    labels:
      issue_id: Issue ID
      issue_description: Issue
      issue_raised_on: Raised On
      issue_elapsed_days: Age (working days)
      issue_closed_on: Closed On
    transforms:
      issue_raised_on: epoch_date
      issue_closed_on: epoch_date
      issue_modified_on: epoch_datetime
      current_issue_owner_modified_on: epoch_datetime
    row_groups:
    - issue_status_label
    - major_reason_name
    value_columns:
    - column: issue_elapsed_days
      aggFunc: avg
    notes:
    - 'Always say where an issue was raised (project / task / subtask) and on which item: derive it from vpp_issue_issuehostmappings,
      one row per issue (string_agg when an issue has several hosts).'
  vpp_issue_issuehostmappings:
    label: Issue host
    identifier: id
    priority: []
    hidden: []
    query_only:
    - issue_id
    - host_id
    - issue_type
    technical:
    - id
    derived:
    - as: raised_on_level
      label: Raised At (level)
      sql: CASE m.issue_type WHEN 'common' THEN 'Project' WHEN 'task' THEN 'Task' WHEN 'subtask' THEN 'Subtask'
        END
      tier: optional
      replaces: issue_type
    notes:
    - 'Never output host_id: it means a project, task or subtask id depending on issue_type. Output the host''s
      name instead (project_name, task_name or subtask_name via the matching join).'
