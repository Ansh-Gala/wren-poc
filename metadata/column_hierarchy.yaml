# Which columns matter, and which the UI may start collapsed.
#
# Presentation only. Nothing here reaches the model and nothing here changes a
# query: a generic question can still project all 33 columns of
# tms_business_object_flat, and this file decides the order they are shown in
# and which of them start hidden. Keeping it out of the prompt is deliberate --
# the built system prompt is compared byte for byte against the PHP port, and
# accuracy figures are only comparable while the prompt is unchanged.
#
# `priority` is the order the listed columns are shown in, most useful first.
# A column absent from the list keeps its own relative order and follows
# everything named. `hidden` columns are still in the result and still
# exported; they simply do not open by default.
#
# `row_groups` and `value_columns` are the grouping nomination, and they are
# optional: a table that names neither is never grouped. Nothing is enabled
# unconditionally, because grouping changes what a row means and a page of
# groups is not a page of records. Each entry in `value_columns` carries an
# `aggFunc`, validated against the seven ag-grid accepts -- an unknown name
# yields blank aggregates rather than an error, which is the same silent
# failure an unknown column name has here.
#
# Pivot is deliberately not nominated. It is the half that breaks the layout:
# pagination counts top-level groups, so with pivotMode and no row groups the
# pager reads "1 to 1 of 1", and sizeColumnsToFit nulls flex against dozens of
# generated columns. The frontend suppresses it until a nomination exists.
#
# Only columns that exist are listed. The names below were taken from
# metadata/schema_description.yaml, not from memory.

version: 1

tables:
  tms_business_object_flat:
    priority:
      - business_object_id
      - business_object_status
      - business_object_type
      - business_unit
      - business_object_color
      - business_object_client_due_at
      - days_to_due_date
      - open_task_count
      - total_task_count
      # Demoted below the counts. The id is what opens the initiative and the
      # reference is long enough to crowd the columns a reader came for, so it
      # earns its place after them rather than second.
      - business_object_ref_id
      - workflow_name
      - workflow_code
      - current_active_milestone
    hidden:
      # Free text, long enough to wreck a row height.
      - business_object_note
      # Identifiers the reader cannot act on; workflow_name is the readable one.
      - workflow_id
      # Only ever set on the one Short Closed row, so a column of blanks.
      - short_closed_by
      - short_closed_on
      # A list inside a cell.
      - open_tasks_list
      # Buffer internals: meaningful to the scheduler, noise in an answer.
      - common_buffer
      - buff_penetration_prcnt
      - buff_penetration_days
    # Type is the dimension a question about initiatives almost always means,
    # and the task counts are pre-aggregated, so summing them across a group
    # is the same arithmetic the database already did per row.
    row_groups:
      - business_object_type
    value_columns:
      - column: open_task_count
        aggFunc: sum
      - column: total_task_count
        aggFunc: sum

  tms_task_flat:
    priority:
      - task_id
      - task_code
      - task_display_name
      - task_status
      - assigned_user_name
      - task_department
      - task_sla_status
      - task_elapsed_days
      - next_followup_at
      - business_object_ref_id
      - business_object_type
    hidden:
      - task_machine_code
      # Booleans that restate task_status and task_sla_status.
      - display_flag
      - is_open_task
      - is_closed_task
      - is_not_started_task
      - is_delayed_open_task
      - is_delayed_closed_task
      - is_business_object_delayed
      - task_reopen_at
      # Presentation form of task_status; showing both is showing it twice.
      - task_display_status
    # Department is the grouping a task list is usually read by. Elapsed days
    # averages rather than sums: a total of elapsed days across a department
    # is a number with no meaning.
    row_groups:
      - task_department
    value_columns:
      - column: task_elapsed_days
        aggFunc: avg

  tms_business_object_attributes_flat:
    priority:
      - business_object_id
      - category
      - season
      - program
      - stage
    hidden: []

  tms_user_flat:
    priority:
      - user_id
      - user_name
      - role_count
      - department_count
    hidden: []

  tms_user_department_flat:
    priority:
      - user_id
      - user_name
      - department
      - sub_department
    hidden: []
