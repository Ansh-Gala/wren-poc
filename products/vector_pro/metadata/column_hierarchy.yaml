# VectorPro column hierarchy: which columns to use, which to show, in what order, under what name.
#
# Companion to schema_description.yaml, business_rules.yaml and question_sql_pairs.yaml
# (scripts/schema_description). Every column named here exists in schema_description.yaml.
#
# Two uses:
#  1. The AI chooses OUTPUT columns with the tiers, guidelines, similar_columns and intents below, and
#     keeps QUERY-only columns (keys, flags, JSON, codes) out of the final SELECT list.
#  2. A grid can lay out a result with the per-table keys kept from the reference format:
#       priority       output order, most useful first (columns not listed keep their order and follow)
#       hidden         columns that, if present, start collapsed (the on_request tier)
#       row_groups     columns that may be grouped on; tables that name none are never grouped
#       value_columns  aggregations offered with grouping; aggFunc is one of
#                      sum, min, max, count, avg, first, last
#     Snapshot and load tables (vpp_planning_projectshistory, vpp_planning_projectwisequeuedetails,
#     vpp_masterdata_heatmapteams) deliberately name no value_columns: summing them is wrong.
#
# Per table: label, identifier, name_column, priority, hidden, the six tiers (essential, optional,
# on_request, query_only, technical, do_not_use; every column is in exactly one), derived output
# columns (as / label / sql / join / tier / replaces), human labels, transforms, row_groups,
# value_columns, notes. Derived columns are names resolved from ids, readable codes and JSON values;
# each was executed against the schema.
#
# Display labels follow the product's terminology (the application's own grid headers are stored in the
# database, not in code). Aliases in SQL stay snake_case; `labels` are what a client should display.

version: 1
tiers:
  essential: Shown by default whenever rows of this table are listed or looked up.
  optional: Shown when the question is about the column's topic, or in a single-record detail view.
  on_request: Shown only when the user asks for it (or its topic) explicitly. Starts collapsed (hidden).
  query_only: Needed to join, filter, sort or calculate; never part of the output. Show its derived name column
    instead.
  technical: Surrogate keys and internal bookkeeping; never output, rarely needed in a query.
  do_not_use: Unmaintained or misleading; never select, filter or output. See the table notes.
guidelines:
- name: two_column_sets
  rule: Every query has two column sets. QUERY columns are everything needed to join, filter, sort or calculate
    (ids, flags, JSON, status codes). OUTPUT columns are what the person sees. Only output columns go in the final
    SELECT list; query columns stay in JOIN, WHERE, GROUP BY, ORDER BY or inside expressions.
- name: start_from_the_question
  rule: 'Choose output columns in this order: (1) the identifier and name of the main entity; (2) the columns that
    directly answer the question; (3) the table''s remaining essential columns, for listings only; (4) optional
    columns only when the question is about their topic. Stop there. Never use SELECT *.'
- name: keep_listings_short
  rule: A listing shows the main entity's essential columns plus the columns that answer the question, normally
    no more than 10, unless the user asks for more or for 'all details'. Detail views of one record may add optional
    columns.
- name: aggregates_show_only_groups_and_measures
  rule: A count, total, average or breakdown outputs only the grouping labels and the measures, never row-level
    columns or identifiers.
- name: names_not_ids
  rule: 'Never output a foreign-key id on its own. Replace it with the derived name column listed under the table
    (replaces: <id>). The main entity''s own id may stay as a reference column (project_id, task_uid, subtask_id,
    issue_id, action_id).'
- name: context_with_child_records
  rule: 'Output the parent with a child: a task always comes with its project_name; a subtask with task_name and
    project_name; an issue with where it was raised; an action with its project.'
- name: apply_transforms
  rule: 'Format columns with the transform listed for them: epoch_date / epoch_datetime for dates, percent for percentages,
    health_colour for status_color, user_name for people, lookup_name for coded ids, json_key for JSON. Keep the
    source column name as the alias of a transformed column.'
- name: aliases
  rule: Raw and transformed columns keep their column name as the SQL alias; derived columns use the `as` name given
    here. Computed measures (counts, differences, buckets) get a short snake_case alias that names the unit or meaning,
    e.g. open_issues, calendar_days_late, buffer_left_working_days. The `labels` map gives the human header a client
    should display; do not put spaces in SQL aliases.
- name: one_of_each_similar_group
  rule: From each similar_columns group, output one column (the group's default) unless the question compares them.
    Never output two columns that look the same without labels that tell them apart.
- name: on_request_means_asked
  rule: Output an on_request column only when the question names it or its topic explicitly (audit dates, custom
    attributes, configuration flags, e-mail, cumulative queue figures).
- name: never_output_query_only_or_technical
  rule: query_only and technical columns are never part of the output, even when the query uses them. If a user
    explicitly asks for an internal id, show it with its label and say it is an internal identifier.
- name: never_use_do_not_use
  rule: do_not_use columns are unmaintained or misleading. Do not select, filter or display them, even on request;
    explain why and offer the correct column (see the table's notes).
- name: respect_access_and_privacy
  rule: Do not output personal data (e-mail, other people's remarks) unless asked and allowed. Never output columns
    excluded from schema_description.yaml (credentials, internal JSON caches).
- name: order_rows_meaningfully
  rule: Order rows by what the question implies (worst first for risks, soonest first for dates, priority for work).
    Sort columns may be query-only (task_tpr_sorting_index, project_priority) and need not be shown.
- name: order_columns_by_priority
  rule: Order output columns by the table's priority list; columns not listed follow in their table order.
transforms:
  epoch_date:
    applies_to: Planning dates stored as BIGINT epoch seconds (*_date, *_etc, holiday_date, entry_date).
    sql: timezone('Asia/Kolkata', to_timestamp({col}))::date AS {col}
    note: Keep the source column name as the alias so ordering and hiding still match.
  epoch_datetime:
    applies_to: Audit instants stored as epoch seconds (*_on, added_on, remark_created_on, history_created_on).
    sql: timezone('Asia/Kolkata', to_timestamp({col})) AS {col}
    note: Show date only (epoch_date) unless the time of day matters to the question.
  percent:
    applies_to: 0-100 percentages (completion, penetration, planned completion).
    sql: ROUND({col}::numeric, 1) AS {col}
    note: Values are already 0-100; never multiply by 100. Penetration can exceed 100.
  days:
    applies_to: Durations, remaining durations, stagnancy, elapsed and delay values in days.
    sql: ROUND({col}::numeric, 1) AS {col}
    note: Say whether the unit is working or calendar days (see business_rules working_days_vs_calendar_days).
  health_colour:
    applies_to: vpp_planning_projects.status_color and vpp_planning_projectshistory.status_color.
    sql: CASE {col} WHEN '#FFCB00' THEN 'yellow' ELSE {col} END AS {col}
    note: Yellow is stored as '#FFCB00'; never show the hex code to a person.
  user_name:
    applies_to: Any column holding a vpp_users.id (manager, owner, raised by, created by ...).
    sql: LEFT JOIN vpp_users <alias> ON <alias>.id = {col} ... REPLACE(<alias>.username, '_deleted_user_' || <alias>.id,
      '') AS <role>_name
    note: Show the name, never the id. The application displays users by username; deleted users carry a suffix
      that this removes.
  lookup_name:
    applies_to: Coded ids with a lookup table (task_status_id, subtask_status_id, reason ids, portfolio_id, department_id_id
      ...).
    sql: LEFT JOIN <lookup> ON <lookup>.<id> = {col} ... <lookup>.<name_column> AS <name alias>
    note: Show the lookup's name column; keep the id only for filtering.
  json_key:
    applies_to: JSON columns (task_delay_indicator, task_elapsed, subtask_delay_indicator, subtasks' phase JSON,
      tasks.issue_count).
    sql: ({col}->>'<key>')::numeric AS <key>
    note: Never show a raw JSON column; extract the keys the question needs.
similar_columns:
- group: project_end_dates
  columns:
  - project_due_date
  - project_etc
  - project_internal_due_date
  - project_planned_due_date
  - factored_project_etc
  - original_etc
  default: project_due_date
  rule: Due date = committed date; project_etc = current forecast; internal = critical chain without buffer; planned
    = due date at last plan save; factored = load-adjusted ETC. original_etc is do_not_use. Show due + ETC together
    for lateness questions.
- group: project_start_dates
  columns:
  - project_actual_start_date
  - project_start_date
  - first_rfs_date
  default: project_actual_start_date
  rule: The application shows project_actual_start_date as the start date of running and closed projects. For projects
    not yet started (in_planning, ready_to_schedule, scheduled) use project_start_date, the planned start.
- group: project_progress
  columns:
  - project_completion
  - project_planned_completion
  - project_completed_progress
  - project_expected_progress
  - project_penetration
  default: project_completion
  rule: Completion = work done; planned completion = time elapsed; completed/expected progress = recent window;
    penetration = buffer consumed. Label each precisely when more than one is shown.
- group: project_lateness
  columns:
  - project_predicted_delay
  - status_color
  - project_due_date
  default: project_predicted_delay
  rule: Predicted delay = forecast lateness in working days; status_color = health; due date passed = overdue (black).
- group: task_identifiers
  columns:
  - task_uid
  - task_id
  - gantt_id
  default: task_id
  rule: Show the WBS task_id with the name; task_uid as reference; never show gantt_id.
- group: task_dates
  columns:
  - task_baseline_finish_date
  - task_expected_finish_date
  - task_actual_finish_date
  - task_etc
  - milestone_baseline_etc
  - milestone_actual_etc
  - task_baseline_alap_finish_date
  - task_baseline_asap_finish_date
  - task_expected_alap_finish_date
  - task_expected_asap_finish_date
  default: task_expected_finish_date
  rule: Planned = baseline; expected = forecast; actual = done. The ALAP/ASAP variants are on_request. Milestone
    target = COALESCE(milestone_baseline_etc, task_baseline_start_date).
- group: task_progress
  columns:
  - task_completion
  - planned_task_completion
  - task_completed_duration
  - last_x_days_completion
  default: task_completion
  rule: Show planned_task_completion next to task_completion when the question is about delay.
- group: task_delay
  columns:
  - delay_flag
  - delay_days
  - rollup_delay_days
  - task_isdelayed
  - task_elapsed_days
  default: delay_flag
  rule: delay_flag (from task_delay_indicator) is what the task screens call delayed; delay_days says by how much.
    task_isdelayed means 'behind planned completion' and is filled only when enabled in configuration. task_elapsed_days
    is do_not_use.
- group: task_time_without_progress
  columns:
  - task_stagnancy
  - elapsed_working_days
  - last_modified_on
  default: task_stagnancy
  rule: Stagnancy = days without progress; elapsed = days since start.
- group: subtask_weightage
  columns:
  - subtask_total_weightage
  - subtask_rem_weightage
  - subtask_actual_completion_weightage
  - subtask_planned_completion_weightage
  - subtask_computed_duration
  default: subtask_actual_completion_weightage
  rule: total/rem are durations in days; actual/planned completion are percentages. Label them that way.
- group: subtask_delay
  columns:
  - subtask_delay_flag
  - subtask_delay_days
  - subtask_isdelayed
  default: subtask_delay_flag
  rule: subtask_delay_flag answers 'is it delayed', subtask_delay_days 'by how much'. subtask_isdelayed is do_not_use
    (always false).
- group: issue_people
  columns:
  - issue_owner_name
  - raised_by_name
  - closed_by_name
  default: issue_owner_name
  rule: Owner = who must resolve; raised by = who reported; closed by = who closed.
- group: issue_counts
  columns:
  - vpp_planning_projects.issue_count
  - vpp_planning_tasks.issue_count
  - vpp_planning_subtasks.issue_count
  default: null
  rule: Pre-aggregated counts can drift. For any count shown to a person, recount from vpp_issue_issues; show the
    stored count only on request.
- group: status_labels
  columns:
  - task_status
  - short_name
  - display_text
  - task_status_id
  default: task_status
  rule: Show the status name; short codes only when the user speaks in codes; never the id.
- group: colours
  columns:
  - vpp_planning_projects.status_color
  - vpp_planning_projectwisequeuedetails.heat_color
  - vpp_masterdata_tags.color
  - vpp_planning_taskstatus.color
  default: null
  rule: 'Different meanings: project health, team congestion, a tag''s display colour, a status''s display colour.
    Only status_color is ''project health''.'
- group: lags
  columns:
  - lag
  - new_lag
  - introduced_lag
  default: new_lag
  rule: new_lag for in_execution projects, lag for plans; introduced_lag only when FOL is asked about.
- group: heatmap_team_ids
  columns:
  - vpp_masterdata_heatmapteams.team_id
  - vpp_masterdata_heatmapteams.source_id
  - vpp_masterdata_teams.team_id
  default: null
  rule: Never show these ids; show team_name. heatmapteams.team_id and teams.team_id are different keys.
- group: latest_remark_vs_remarks
  columns:
  - task_latest_remark
  - subtask_latest_remark
  - vpp_planning_remark.remark
  default: task_latest_remark
  rule: Latest remark for listings; the remark table for history.
- group: user_names
  columns:
  - user_name
  - username
  - first_name
  - last_name
  default: user_name
  rule: Use the derived user_name (cleaned username) as the application does.
intents:
- intent: lookup_one
  example: Show me project 101 / task 5003
  output: Identifier, name, all essential columns and the most relevant optional ones (detail view). One row.
- intent: list
  example: Which tasks are delayed? / List open issues
  output: Identifier, name, parent context, the columns that prove the condition (e.g. task_completion and planned_task_completion
    for delayed), plus essential columns; about 8 columns.
- intent: count
  example: How many projects are running?
  output: A single measure with a clear alias (running_projects). No other columns.
- intent: breakdown
  example: Open tasks by department / projects by health
  output: Group label column(s) + measure(s). Translate codes to labels (yellow, status names).
- intent: top_n
  example: Top 5 priority projects / most delayed tasks
  output: Name, the ranking measure, and one or two context columns; ordered by the measure.
- intent: trend
  example: How did completion change over the last week?
  output: Date column first (snapshot date), then the measures; one row per period, oldest first.
- intent: comparison
  example: Plan vs actual completion
  output: Name plus both compared columns side by side and, if useful, their difference with a clear label.
- intent: explanation
  example: Why is project 101 red?
  output: The columns that drive the answer (status_color, project_completion, project_planned_completion, project_due_date,
    project_etc) for the one record, then explain in words.
- intent: export_all
  example: Give me all details of project 101
  output: All essential, optional and on_request columns of the entity, transformed and labelled, except personal
    data (e-mail) and role-restricted columns (expected_rebaseline_type) unless the asker is allowed; never query_only,
    technical or do_not_use columns.
ambiguity:
- name: which_date
  rule: '''Deadline'' or ''due'' means the committed date: project_due_date for projects, task_baseline_finish_date
    for tasks, milestone_target_date for milestones, action_planned_completion_date for actions. ''When will it
    finish'' means the forecast: project_etc, task_expected_finish_date. ''When did it finish'' means the actual
    date (task_actual_finish_date; project_closed_on for projects). For lateness show the committed date and the
    forecast together (projects: due date + ETC; tasks: baseline finish + expected finish).'
- name: which_completion
  rule: '''Progress'' or ''how far'' means project_completion / task_completion. Add planned completion only for
    ''on track'' or ''behind'' questions. Recent progress columns only for ''this week / recently''.'
- name: which_person
  rule: '''Who'' about a project means the Project Manager (plus coordinators if asked ''who is involved''); about
    a task, the Task Manager; about a subtask, the Subtask Manager; about an issue, the owner (raiser only if the
    question says raised / reported).'
- name: which_name
  rule: When the user identifies a project by code, show project_code first; by number, project_id; by name, project_name.
    Always include project_name.
- name: id_vs_name_requested
  rule: If the user asks for 'the id', give the entity's own id (project_id, task_uid, issue_id). A WBS like '1.2'
    is task_id. Never offer gantt_id or mapping ids.
- name: details_requested
  rule: '''Details'', ''everything'', ''full info'' switch to the export_all intent for that entity only, not for
    joined tables.'
- name: stale_values
  rule: If the result includes non-running projects, either drop the health / ETC / delay columns or label them
    as the last calculated values.
- name: unknown_column_request
  rule: If the user asks for a column that does not exist or is excluded, say so; do not substitute a similar-looking
    column silently.
examples:
- question: Which tasks are delayed?
  output_columns:
  - project_name
  - task_id
  - task_name
  - delay_days
  - task_completion
  - task_manager_name
  - task_uid
  query_only_columns:
  - task_delay_indicator
  - task_status_id
  - task_is_deleted
  - project_status
  - project_is_deleted
  - project_id_id
  - task_manager_id
  why: The delay flag filters the rows, so it is not repeated in the output; delay_days shows by how much. task_uid
    comes last as the reference id.
- question: How many projects are running?
  output_columns:
  - running_projects
  query_only_columns:
  - project_status
  - project_is_deleted
  why: Counts output a single measure.
- question: Show me project 101
  output_columns:
  - project_id
  - project_code
  - project_name
  - portfolio_name
  - project_status
  - project_manager_name
  - project_due_date
  - project_etc
  - status_color
  - project_completion
  - project_actual_start_date
  query_only_columns:
  - portfolio_id
  - project_manager_id
  - project_is_deleted
  why: 'Detail view: essential columns plus the start date; ids replaced by names; health shown as a word.'
- question: Open issues of project 101
  output_columns:
  - issue_id
  - issue_description
  - raised_on_level
  - raised_on_item
  - issue_status_label
  - issue_owner_name
  - issue_raised_on
  query_only_columns:
  - issue_status
  - issue_is_deleted
  - issue_type
  - host_id
  - issue_owner_id
  why: host_id and issue_type drive the joins; the output shows where the issue was raised in words.
- question: Open tasks by department
  output_columns:
  - department_name
  - open_tasks
  query_only_columns:
  - department_id_id
  - task_status_id
  - task_is_deleted
  - workflow_id
  why: Breakdowns show only the label and the measure.
- question: How has project 101's completion changed this week?
  output_columns:
  - history_created_on
  - project_completion
  - status_color
  query_only_columns:
  - project_id
  why: 'Trend: date first, one row per day, oldest first; project name is in the question, so not repeated.'
- question: What should I work on next?
  output_columns:
  - project_name
  - project_priority
  - task_uid
  - task_id
  - task_name
  - subtask_id
  - subtask_name
  - work_status
  - task_expected_finish_date
  query_only_columns:
  - task_tpr_sorting_index
  - subtask_tpr_sorting_index
  - task_manager_id
  - subtask_manager_id
  why: 'The TPR sort keys stay query-only: the order is visible from the row order. project_priority is shown because
    it explains the order across projects.'
- question: Which heatmap teams are overloaded?
  output_columns:
  - team_name
  - team_load
  - threshold_green_end
  - threshold_yellow_end
  query_only_columns:
  - heatmap_enabled
  - team_id
  why: Show the limits next to the load so the judgement is visible.
tables:
  vpp_planning_projects:
    label: Project
    identifier: project_id
    name_column: project_name
    priority:
    - project_id
    - project_code
    - project_name
    - portfolio_name
    - project_status
    - project_manager_name
    - project_due_date
    - project_etc
    - status_color
    - project_completion
    - project_predicted_delay
    - project_priority
    - project_penetration
    - project_planned_completion
    - project_actual_start_date
    hidden:
    - project_start_date
    - project_buffer
    - near_cc
    - project_slack
    - project_is_slack_applicable
    - project_is_feeder_buffer_applicable
    - expected_rebaseline_type
    - project_overwrite_task_baseline_dates
    - factored_project_etc
    - current_quarter_progress
    - next_quarter_target
    - project_created_on
    - project_modified_on
    - last_successful_buffer_run_on
    - issue_count
    - project_attachment_count
    - project_group_name
    - rts_rule_label
    - cost_consumption_label
    essential:
    - project_id
    - project_code
    - project_name
    - project_status
    - project_due_date
    - project_etc
    - status_color
    - project_completion
    - project_priority
    optional:
    - project_actual_start_date
    - project_penetration
    - project_predicted_delay
    - project_planned_completion
    - project_completed_progress
    - project_expected_progress
    - project_buffer_duration
    - project_duration
    - project_rem_duration
    - project_internal_due_date
    - project_planned_due_date
    - first_rfs_date
    - scheduling_logic
    - project_last_rebaselined_on
    on_request:
    - project_start_date
    - project_buffer
    - near_cc
    - project_slack
    - project_is_slack_applicable
    - project_is_feeder_buffer_applicable
    - expected_rebaseline_type
    - project_overwrite_task_baseline_dates
    - factored_project_etc
    - current_quarter_progress
    - next_quarter_target
    - project_created_on
    - project_modified_on
    - last_successful_buffer_run_on
    - issue_count
    - project_attachment_count
    query_only:
    - portfolio_id
    - project_manager_id
    - project_group_id_id
    - cost_manager_id
    - project_created_by_id
    - project_modified_by_id
    - project_is_deleted
    - project_rebaseline_type
    - project_task_rts_config
    - consume_when
    - project_custom_attribute
    do_not_use:
    - original_etc
    derived:
    - as: portfolio_name
      label: Portfolio
      sql: pf.portfolio_name
      tier: essential
      join: LEFT JOIN vpp_masterdata_portfolios pf ON pf.portfolio_id = p.portfolio_id
      replaces: portfolio_id
    - as: project_manager_name
      label: Project Manager
      sql: REPLACE(pm.username, '_deleted_user_' || pm.id, '')
      tier: essential
      join: LEFT JOIN vpp_users pm ON pm.id = p.project_manager_id
      replaces: project_manager_id
    - as: project_group_name
      label: Project Group
      sql: pg.project_group_name
      tier: on_request
      join: LEFT JOIN vpp_masterdata_projectgroups pg ON pg.project_group_id = p.project_group_id_id
      replaces: project_group_id_id
    - as: coordinator_names
      label: Coordinators
      sql: (SELECT string_agg(REPLACE(cu.username, '_deleted_user_' || cu.id, ''), ', ') FROM vpp_planning_projectcoordinatormapping
        c JOIN vpp_users cu ON cu.id = c.coordinator_id_id WHERE c.project_id_id = p.project_id)
      tier: optional
    - as: project_closed_on
      label: Closed On
      sql: (SELECT timezone('Asia/Kolkata', to_timestamp(MAX(r.remark_created_on)))::date FROM vpp_planning_remark
        r WHERE r.host_type = 'project' AND r.host_status = 'closed' AND r.host_id = p.project_id)
      tier: optional
      note: Closed projects only; there is no closure-date column. Shown by default when the listing is restricted
        to closed projects, with lateness (see business_rules closed_project_lateness).
    - as: rebaseline_type_label
      label: Last Rebaseline
      sql: 'CASE p.project_rebaseline_type WHEN 0 THEN ''Never rebaselined'' WHEN 1 THEN ''Type 1: due date kept''
        WHEN 2 THEN ''Type 2: due date from total duration'' WHEN 3 THEN ''Type 3: due date from remaining duration''
        END'
      tier: optional
      replaces: project_rebaseline_type
    - as: rts_rule_label
      label: Ready-To-Start Rule
      sql: CASE p.project_task_rts_config WHEN 1 THEN 'Start of any predecessor' WHEN 2 THEN 'Start of all predecessors'
        WHEN 3 THEN 'Network dependency of any predecessor' WHEN 4 THEN 'Network dependency of all predecessors'
        END
      tier: on_request
      replaces: project_task_rts_config
    - as: cost_consumption_label
      label: Cost Consumed When
      sql: CASE p.consume_when WHEN 1 THEN 'Task starts' WHEN 2 THEN 'Task finishes' WHEN 3 THEN 'In line with actual
        completion' END
      tier: on_request
      replaces: consume_when
    labels:
      project_id: Project ID
      project_code: Project Code
      project_name: Project
      project_status: Status
