    \ sp\n  JOIN vpp_planning_subtasks s ON s.subtask_id = sp.subtask_id_id\n  WHERE sp.subtask_participants_id\
    \ IN (SELECT user_id FROM managed)\n    AND s.subtask_is_deleted = false AND (s.subtask_status_id\
    \ IS NULL OR s.subtask_status_id <> 6)\n)\nSELECT REPLACE(u.username, '_deleted_user_' || u.id, '')\
    \ AS user_name, p.project_name, t.task_uid, t.task_name, ts.task_status AS task_status,\n       string_agg(DISTINCT\
    \ i.involvement, ', ') AS involvement\nFROM involvement i\nJOIN vpp_users u ON u.id = i.user_id\n\
    JOIN vpp_planning_tasks t ON t.task_uid = i.task_uid\nJOIN vpp_planning_projects p ON p.project_id\
    \ = t.project_id_id\nLEFT JOIN vpp_planning_taskstatus ts ON ts.task_status_id = t.task_status_id\n\
    WHERE t.task_status_id IN (1, 2, 3)\n  AND t.task_is_deleted = false\n  AND p.project_status = 'in_execution'\n\
    \  AND p.project_is_deleted = false\nGROUP BY u.username, u.id, p.project_name, t.task_uid, t.task_name,\
    \ ts.task_status\nORDER BY user_name, p.project_name, t.task_uid\n"
- id: team_load_vs_thresholds
  category: heatmap
  question: Which heatmap teams are overloaded right now?
  expected_sql: "SELECT h.team_name, h.team_type, ROUND(h.team_load::numeric, 1) AS team_load,\n     \
    \  h.threshold_green_end, h.threshold_yellow_end,\n       CASE WHEN h.team_load <= h.threshold_green_end\
    \ THEN 'within green limit'\n            WHEN h.team_load <= h.threshold_yellow_end THEN 'within yellow\
    \ limit'\n            ELSE 'above yellow limit' END AS load_band\nFROM vpp_masterdata_heatmapteams\
    \ h\nWHERE h.heatmap_enabled = true\nORDER BY h.team_load - h.threshold_yellow_end DESC\n"
- id: queue_by_project_latest
  category: heatmap
  question: Which projects put the most queue on the 'd2' team today?
  expected_sql: "SELECT p.project_name, q.queue_duration, q.queue_total_subtasks\nFROM vpp_planning_projectwisequeuedetails\
    \ q\nJOIN vpp_masterdata_heatmapteams h ON h.team_id = q.team_id_id\nJOIN vpp_planning_projects p\
    \ ON p.project_id = q.project_id\nWHERE h.team_name = 'd2'\n  AND p.project_is_deleted = false\n \
    \ AND q.entry_date = (SELECT MAX(entry_date) FROM vpp_planning_projectwisequeuedetails)\nORDER BY\
    \ q.queue_duration DESC\n"
- id: users_with_role
  category: people
  question: Which active users are Task Managers?
  expected_sql: "SELECT REPLACE(u.username, '_deleted_user_' || u.id, '') AS user_name, u.email\nFROM\
    \ vpp_users u\nJOIN vpp_user_groups ug ON ug.user_id = u.id\nJOIN vpp_groups g ON g.group_id = ug.group_id\n\
    WHERE g.group_name = 'VP_TaskManager'\n  AND u.status = 1\n  AND u.is_active\n  AND u.id <> 1\nORDER\
    \ BY user_name\n"
- id: working_days_left
  category: calendar
  question: How many working days are left until each running project's due date?
  expected_sql: "SELECT p.project_id, p.project_name, timezone('Asia/Kolkata', to_timestamp(p.project_due_date))::date\
    \ AS project_due_date,\n       (SELECT COUNT(*) FROM working_days_view w\n        WHERE w.calendar_date_unix\
    \ > EXTRACT(EPOCH FROM date_trunc('day', now() AT TIME ZONE 'Asia/Kolkata') AT TIME ZONE 'Asia/Kolkata')::bigint\n\
    \          AND w.calendar_date_unix <= p.project_due_date) AS working_days_left\nFROM vpp_planning_projects\
    \ p\nWHERE p.project_status = 'in_execution'\n  AND p.project_is_deleted = false\n  AND p.project_due_date\
    \ >= EXTRACT(EPOCH FROM date_trunc('day', now() AT TIME ZONE 'Asia/Kolkata') AT TIME ZONE 'Asia/Kolkata')::bigint\n\
    ORDER BY working_days_left\n"
- id: at_risk_projects
  category: ambiguity
  question: Which projects are at risk?
  expected_sql: "SELECT p.project_id, p.project_name,\n       CASE p.status_color WHEN '#FFCB00' THEN\
    \ 'yellow' ELSE p.status_color END AS status_color,\n       p.project_predicted_delay AS project_predicted_delay\n\
    FROM vpp_planning_projects p\nWHERE p.project_status = 'in_execution'\n  AND p.project_is_deleted\
    \ = false\n  AND (p.status_color IN ('red', '#FFCB00') OR p.project_predicted_delay > 0)\nORDER BY\
    \ p.project_predicted_delay DESC NULLS LAST\n"
- id: all_my_tasks_still_defaults_open
  category: ambiguity
  question: Show me all my tasks
  expected_sql: "SELECT p.project_name, t.task_uid, t.task_name, ts.task_status AS task_status\nFROM vpp_planning_tasks\
    \ t\nJOIN vpp_planning_projects p ON p.project_id = t.project_id_id\nLEFT JOIN vpp_planning_taskstatus\
    \ ts ON ts.task_status_id = t.task_status_id\nWHERE (t.task_manager_id = 2048\n       OR EXISTS (SELECT\
    \ 1 FROM vpp_planning_taskparticipants tp\n                  WHERE tp.task_id_id = t.task_uid AND\
    \ tp.task_participant_id = 2048))\n  AND t.task_status_id IN (1, 2, 3)\n  AND t.task_is_deleted =\
    \ false\n  AND p.project_status = 'in_execution'\n  AND p.project_is_deleted = false\n"
- id: delayed_ambiguous_word
  category: ambiguity
  question: How delayed is project 196?
  expected_sql: "SELECT p.project_name, p.project_status,\n       p.project_predicted_delay AS project_predicted_delay,\n\
    \       timezone('Asia/Kolkata', to_timestamp(p.project_due_date))::date AS project_due_date,\n  \
    \     timezone('Asia/Kolkata', to_timestamp(p.project_etc))::date AS project_etc,\n       (SELECT\
    \ COUNT(*) FROM vpp_planning_tasks t\n        WHERE t.project_id_id = p.project_id AND COALESCE((t.task_delay_indicator->>'task_is_delayed')::boolean,\
    \ false)\n          AND t.task_status_id IN (1, 2, 3) AND t.task_is_deleted = false) AS delayed_open_tasks\n\
    FROM vpp_planning_projects p\nWHERE p.project_id = 196\n  AND p.project_is_deleted = false\n"
- id: what_to_work_on_next
  category: my
  question: What should I work on next?
  expected_sql: "WITH my_work AS (\n  SELECT t.task_uid, NULL::integer AS subtask_id\n  FROM vpp_planning_tasks\
    \ t\n  WHERE (t.task_manager_id = 2048\n         OR EXISTS (SELECT 1 FROM vpp_planning_taskparticipants\
    \ tp\n                    WHERE tp.task_id_id = t.task_uid AND tp.task_participant_id = 2048))\n \
    \   AND t.task_status_id IN (2, 3)\n    AND t.workflow_id IS NOT NULL\n  UNION\n  SELECT s.task_id,\
    \ s.subtask_id\n  FROM vpp_planning_subtasks s\n  WHERE (s.subtask_manager_id = 2048\n         OR\
    \ EXISTS (SELECT 1 FROM vpp_planning_subtaskparticipants sp\n                    WHERE sp.subtask_id_id\
    \ = s.subtask_id AND sp.subtask_participants_id = 2048))\n    AND (s.subtask_status_id IS NULL OR\
    \ s.subtask_status_id <> 6)\n    AND s.subtask_is_deleted = false\n)\nSELECT p.project_name, p.project_priority,\
    \ t.task_uid, t.task_id, t.task_name,\n       s.subtask_id, s.subtask_name,\n       COALESCE(ss.subtask_status,\
    \ ts.task_status) AS work_status,\n       timezone('Asia/Kolkata', to_timestamp(t.task_expected_finish_date))::date\
    \ AS task_expected_finish_date\nFROM my_work w\nJOIN vpp_planning_tasks t ON t.task_uid = w.task_uid\
    \ AND t.task_is_deleted = false\nJOIN vpp_planning_projects p ON p.project_id = t.project_id_id\n\
    LEFT JOIN vpp_planning_subtasks s ON s.subtask_id = w.subtask_id\nLEFT JOIN vpp_planning_subtaskstatus\
    \ ss ON ss.subtask_status_id = s.subtask_status_id\nLEFT JOIN vpp_planning_taskstatus ts ON ts.task_status_id\
    \ = t.task_status_id\nWHERE p.project_status = 'in_execution'\n  AND p.project_is_deleted = false\n\
    ORDER BY p.project_priority ASC, t.task_tpr_sorting_index ASC NULLS LAST, s.subtask_tpr_sorting_index\
    \ ASC NULLS FIRST\nLIMIT 10\n"
- id: buffer_remaining
  category: projects
  question: How much buffer is left on each running project?
  expected_sql: "SELECT p.project_id, p.project_name,\n       ROUND(p.project_buffer_duration::numeric,\
    \ 1) AS project_buffer_duration,\n       ROUND(p.project_penetration::numeric, 1) AS project_penetration,\n\
    \       ROUND((p.project_buffer_duration * (1 - p.project_penetration / 100.0))::numeric, 1) AS buffer_left_working_days\n\
    FROM vpp_planning_projects p\nWHERE p.project_status = 'in_execution'\n  AND p.project_is_deleted\
    \ = false\nORDER BY buffer_left_working_days ASC NULLS LAST\n"
- id: closed_projects_on_time_rate
  category: projects
  question: What share of projects closed in each month of this year were on time?
  expected_sql: "WITH closure AS (\n  SELECT r.host_id AS project_id,\n         EXTRACT(EPOCH FROM date_trunc('day',\
    \ timezone('Asia/Kolkata', to_timestamp(MAX(r.remark_created_on))))\n                 AT TIME ZONE\
    \ 'Asia/Kolkata')::bigint AS closed_day\n  FROM vpp_planning_remark r\n  WHERE r.host_type = 'project'\
    \ AND r.host_status = 'closed'\n  GROUP BY r.host_id\n)\nSELECT date_trunc('month', timezone('Asia/Kolkata',\
    \ to_timestamp(c.closed_day))::date)::date AS month,\n       COUNT(*) AS closed_projects,\n      \
    \ COUNT(*) FILTER (WHERE c.closed_day <= p.project_due_date) AS on_time_or_early,\n       ROUND(100.0\
    \ * COUNT(*) FILTER (WHERE c.closed_day <= p.project_due_date) / COUNT(*), 1) AS on_time_pct,\n  \
    \     ROUND(AVG((timezone('Asia/Kolkata', to_timestamp(c.closed_day))::date - timezone('Asia/Kolkata',\
    \ to_timestamp(p.project_actual_start_date))::date))::numeric, 1) AS avg_calendar_days_start_to_close\n\
    FROM vpp_planning_projects p\nJOIN closure c ON c.project_id = p.project_id\nWHERE p.project_status\
    \ = 'closed'\n  AND p.project_is_deleted = false\n  AND timezone('Asia/Kolkata', to_timestamp(c.closed_day))::date\
    \ >= date_trunc('year', now() AT TIME ZONE 'Asia/Kolkata')::date\nGROUP BY 1\nORDER BY 1\n"
- id: project_pipeline
  category: projects
  question: What projects are in the pipeline and when do they start?
  expected_sql: "SELECT p.project_id, p.project_name, p.project_status,\n       timezone('Asia/Kolkata',\
    \ to_timestamp(p.project_start_date))::date AS project_start_date,\n       timezone('Asia/Kolkata',\
    \ to_timestamp(p.first_rfs_date))::date AS first_rfs_date,\n       timezone('Asia/Kolkata', to_timestamp(p.project_due_date))::date\
    \ AS project_due_date\nFROM vpp_planning_projects p\nWHERE p.project_status IN ('in_planning', 'ready_to_schedule',\
    \ 'scheduled')\n  AND p.project_is_deleted = false\nORDER BY p.project_start_date\n"
- id: subtask_manager_workload
  category: subtasks
  question: How much open work does each subtask manager have in running projects?
  expected_sql: "SELECT COALESCE(REPLACE(u.username, '_deleted_user_' || u.id, ''), 'Unassigned') AS subtask_manager_name,\n\
    \       COUNT(*) AS open_subtasks,\n       ROUND(SUM(s.subtask_rem_weightage)::numeric, 1) AS remaining_days,\n\
    \       COUNT(*) FILTER (WHERE s.subtask_status_id = 2) AS active_subtasks\nFROM vpp_planning_subtasks\
    \ s\nJOIN vpp_planning_tasks t ON t.task_uid = s.task_id AND t.task_is_deleted = false\nJOIN vpp_planning_projects\
    \ p ON p.project_id = t.project_id_id\nLEFT JOIN vpp_users u ON u.id = s.subtask_manager_id\nWHERE\
    \ (s.subtask_status_id IS NULL OR s.subtask_status_id <> 6)\n  AND s.subtask_is_deleted = false\n\
    \  AND p.project_status = 'in_execution'\n  AND p.project_is_deleted = false\nGROUP BY u.username,\
    \ u.id\nORDER BY remaining_days DESC\n"
- id: subtasks_waiting
  category: subtasks
  question: Which subtasks are waiting, and on what?
  expected_sql: "SELECT p.project_name, t.task_name, s.subtask_id, s.subtask_name, ss.subtask_status AS\
    \ subtask_status,\n       s.subtask_stagnancy\nFROM vpp_planning_subtasks s\nJOIN vpp_planning_subtaskstatus\
    \ ss ON ss.subtask_status_id = s.subtask_status_id\nJOIN vpp_planning_tasks t ON t.task_uid = s.task_id\
    \ AND t.task_is_deleted = false\nJOIN vpp_planning_projects p ON p.project_id = t.project_id_id\n\
    WHERE s.subtask_status_id IN (3, 4)\n  AND s.subtask_is_deleted = false\n  AND p.project_status =\
    \ 'in_execution'\n  AND p.project_is_deleted = false\nORDER BY s.subtask_stagnancy DESC\n"
- id: open_issue_aging
  category: issues
  question: How old are our open issues? Give an aging breakdown
  expected_sql: "SELECT CASE WHEN i.issue_elapsed_days <= 5 THEN '0-5 working days'\n            WHEN\
    \ i.issue_elapsed_days <= 15 THEN '6-15 working days'\n            WHEN i.issue_elapsed_days <= 30\
    \ THEN '16-30 working days'\n            ELSE 'over 30 working days' END AS age_bucket,\n       COUNT(*)\
    \ AS open_issues,\n       COUNT(*) FILTER (WHERE COALESCE(i.issue_escalated_level, 0) > 0) AS escalated\n\
    FROM vpp_issue_issues i\nWHERE i.issue_status IN (1, 2)\n  AND i.issue_is_deleted = false\nGROUP BY\
    \ 1\nORDER BY MIN(i.issue_elapsed_days)\n"
- id: portfolio_health_summary
  category: projects
  question: Give me a health summary per portfolio
  expected_sql: "SELECT pf.portfolio_name,\n       COUNT(*) AS running_projects,\n       COUNT(*) FILTER\
    \ (WHERE p.status_color = 'green') AS green,\n       COUNT(*) FILTER (WHERE p.status_color = '#FFCB00')\
    \ AS yellow,\n       COUNT(*) FILTER (WHERE p.status_color = 'red') AS red,\n       COUNT(*) FILTER\
    \ (WHERE p.status_color = 'black') AS black,\n       COUNT(*) FILTER (WHERE p.project_predicted_delay\
    \ > 0) AS forecast_late\nFROM vpp_planning_projects p\nJOIN vpp_masterdata_portfolios pf ON pf.portfolio_id\
    \ = p.portfolio_id AND pf.portfolio_is_deleted = false\nWHERE p.project_status = 'in_execution'\n\
    \  AND p.project_is_deleted = false\nGROUP BY pf.portfolio_name\nORDER BY pf.portfolio_name\n"
