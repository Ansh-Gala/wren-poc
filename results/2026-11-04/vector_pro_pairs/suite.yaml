    \ = 196\n  AND t.task_id = '1.2'\n  AND t.task_is_deleted = false\n"
- id: open_tasks_in_project_by_status
  category: tasks
  question: How many open tasks does project 196 have, by status?
  expected_sql: "SELECT ts.task_status AS task_status, COUNT(*) AS tasks\nFROM vpp_planning_tasks t\n\
