version: "1.0"
domain: "TMS"

tables:
  tms_task_flat:
    grain: "One row per task"
    description: >
      Reporting/semantic representation of a TMS task with task status, assignment,
      organizational context, SLA information, related Business Object information,
      workflow/process context, and selected business attributes.
    synonyms:
      - "task"
      - "TMS task"
      - "work item"
      - "ticket"
    primary_key: "task_id"
    relationships:
      - to: "tms_business_object_flat"
        local_key: "bo_id"
        remote_key: "bo_id"
        cardinality: "many-to-one"
      - to: "tms_user_flat"
        local_key: "assigned_user_id"
        remote_key: "user_id"
        cardinality: "many-to-one"
      - to: "tms_role_flat"
        local_key: "assigned_role"
        remote_key: "role"
        cardinality: "many-to-many_or_many-to-one_depending_on_data"
    columns:
      task_id: "Unique identifier of the task."
      ticket_code: "Human-readable ticket/task reference code."
      task_name: "Internal task name."
      task_display_name: "User-facing task name. Prefer this for display."
      task_status: "Current system status of the task."
      task_sub_status: "Secondary status providing additional task-state detail."
      task_display_status: "Business-friendly task status such as Open, Closed, or Not Started."
      is_active_task: "TRUE when the task is open and its start time has been reached."
      is_closed: "TRUE when the task is closed."
      is_not_started: "TRUE when the task start time is in the future."
      display_flag: "Indicates whether the task is configured to be displayed."
      instant_closer: "Indicates whether immediate closure is configured for the task."
      reopen_count: "Number of times the task has been reopened."
      assigned_user_id: "Unique identifier of the currently assigned user."
      assigned_user_name: "Name of the currently assigned user."
      assigned_role: "Role to which the task is assigned."
      task_sub_department: "Sub-department associated with the task."
      department: "Department resolved through organizational mapping."
      department_sub_department: "Sub-department resolved through organizational mapping."
      created_at: "Date/time when the task was created."
      task_start_at: "Scheduled task start date/time."
      assigned_at: "Date/time when the task was assigned."
      closed_at: "Date/time when the task was closed."
      reopen_at: "Date/time when the task was reopened."
      next_followup_at: "Date/time associated with the next follow-up."
      category_type: "Indicates Current Ticket versus Follow-up Ticket."
      is_followup: "TRUE when the task is a follow-up ticket."
      sla_hours: "Allowed task duration in hours according to SLA/buffer configuration."
      elapsed_hours: "Elapsed task duration in hours, using actual close time for closed tasks or current time for active tasks."
      elapsed_days: "Elapsed task duration in days."
      is_delayed: "TRUE when elapsed task duration exceeds the allowed SLA/buffer."
      sla_status: "Business-friendly SLA state, normally Delayed or On Time."
      task_color: "Configured task color/status indicator."
      close_button: "Indicates whether the task can be closed from the relevant list."
      close_sequence: "Workflow close sequence/order."
      bo_id: "Unique identifier of the related Business Object / Initiative / Order / BO."
      business_object_ref_id: "Human-readable reference of the related Business Object / Initiative / Order / BO."
      business_unit: "Business unit associated with the Business Object."
      business_object_status: "Current status of the related Business Object."
      business_object_type: "Type/code of the related Business Object."
      business_object_priority: "Priority associated with the related Business Object."
      common_buffer: "Common buffer configured for the related Business Object."
      buff_penetration_prcnt: "Percentage of available buffer consumed."
      buff_penetration_days: "Number of buffer days consumed."
      total_remaining_duration: "Remaining duration for the related Business Object."
      days_to_due_date: "Days remaining until the applicable due date; negative values indicate the due date has passed."
      client_due_at: "Client/customer required due date/time."
      system_due_at: "System-calculated due date/time."
      workflow_id: "Unique identifier of the associated workflow."
      workflow_code: "Code identifying the associated workflow."
      workflow_name: "Human-readable workflow name."
      process_id: "Unique identifier of the associated process."
      process_status: "System process status code."
      process_status_name: "Business-friendly process status."
      category: "Business category associated with the Business Object."
      volume: "Business volume associated with the Business Object; exact unit depends on source data."
      event: "Business event associated with the Business Object."
      channel: "Business channel associated with the Business Object."
      season: "Season associated with the Business Object."
      program: "Program associated with the Business Object."
      fabrication: "Fabrication information."
      design_details: "Design-related details."
      yarn_details: "Yarn-related details."
      composition: "Material/fabric composition."
      knitting: "Knitting-related information."
      finishing_details: "Finishing-related information."
      trim_details: "Trim-related information."
      loop_length: "Loop length specification."
      request_receipt_date: "Date on which the request was received."
      pi_date: "PI-related date."
      customer_required_date: "Customer-required date."
      stage: "Current business stage."
      business_color: "Business-specific color/value."
      brandix_t_a: "Brandix T&A information."
      csbd_date: "CSBD-related date."
      batch_no: "Batch number."
      item_code: "Item/product code."
      quality: "Quality specification."
      vendor: "Vendor associated with the Business Object."
      total_qty: "Total quantity associated with the Business Object."
      moq: "Minimum order quantity."
      number_of_options: "Number of options associated with the Business Object."
      count: "Business count value; exact meaning should be validated if used analytically."
      merchant_name: "Merchant associated with the Business Object."
      end_date: "Business end date."
      buyer: "Buyer associated with the Business Object."
      mcode_won_number: "MCODE/WON reference."
      ex_mill_date: "Ex-mill date."
      garment_desc: "Garment description."
      matching_instruction: "Matching instructions."
      fabric_description: "Fabric description."
      dye_part: "Dye-part information."
      shade: "Shade information."
      internal_or_confirmed: "Indicates internal versus confirmed business information."
      division: "Business division."
      style_or_garment_code: "Style or garment code."

  tms_business_object_flat:
    grain: "One row per Business Object / Initiative / Order / BO"
    description: >
      Top-level TMS business entity containing overall business, due-date, buffer,
      workflow, process, milestone, and task-summary information.
    synonyms:
      - "Business Object"
      - "BO"
      - "Initiative"
      - "Order"
    primary_key: "bo_id"
    relationships:
      - to: "tms_task_flat"
        local_key: "bo_id"
        remote_key: "bo_id"
        cardinality: "one-to-many"
    columns:
      bo_id: "Unique identifier of the Business Object / Initiative / Order / BO."
      business_object_ref_id: "Human-readable reference number of the Business Object."
      business_unit: "Business unit associated with the Business Object."
      business_object_type: "Business Object type/category."
      bo_status: "Current system status of the Business Object."
      business_object_priority: "Priority associated with the Business Object."
      business_object_note: "Business note or remark."
      created_at: "Date/time when the Business Object was created."
      updated_at: "Date/time when it was last updated."
      client_due_at: "Client/customer required due date/time."
      system_due_at: "System-calculated due date/time."
      common_buffer: "Common time buffer."
      buff_penetration_prcnt: "Percentage of available buffer consumed."
      buff_penetration_days: "Number of buffer days consumed."
      total_remaining_duration: "Remaining duration."
      days_to_due_date: "Days remaining until due date; negative values mean overdue."
      hold_days: "Number of days on hold."
      workflow_id: "Associated workflow identifier."
      workflow_code: "Associated workflow code."
      workflow_name: "Associated workflow name."
      process_id: "Associated process identifier."
      process_status: "System process status."
      process_status_name: "Business-friendly process status."
      process_start_at: "Process start date/time."
      process_end_at: "Process end date/time."
      elapsed_days: "Elapsed process duration in days."
      expected_completion_date: "Expected completion date."
      short_closed_by: "User who short-closed the Business Object."
      short_closed_on: "Date/time of short closure."
      csr: "Customer service representative associated with the Business Object."
      current_active_milestone: "Current active milestone."
      current_milestone_delay_days: "Delay in days for the current active milestone."
      current_milestone_expected_completion: "Expected completion date of the current active milestone."
      total_task_count: "Total number of tasks."
      open_task_count: "Number of open tasks."
      closed_task_count: "Number of closed tasks."
      delayed_task_count: "Number of delayed tasks."
      open_tasks: "Names of currently open tasks."
      category: "Business category."
      initiative_type: "Initiative/Business Object type."
      season: "Season."
      program: "Program."
      request_receipt_date: "Date the business request was received."
      pi_date: "PI-related date."
      customer_required_date: "Customer-required date."
      stage: "Current business stage."
      business_color: "Business-specific color/value."
      brandix_t_a: "Brandix T&A information."
      csbd_date: "CSBD-related date."
      batch_no: "Batch number."
      item_code: "Item/product code."
      quality: "Quality specification."
      buyer: "Buyer associated with the Business Object."
      mcode_won_number: "MCODE/WON reference."
      ex_mill_date: "Ex-mill date."
      garment_desc: "Garment description."
      matching_instruction: "Matching instructions."
      fabric_description: "Fabric description."
      dye_part: "Dye-part information."
      shade: "Shade information."
      internal_or_confirmed: "Internal versus confirmed information."
      division: "Business division."
      garment_style_or_sample_code: "Garment, style, or sample code."

  tms_user_flat:
    grain: "One row per user"
    description: >
      TMS user/employee with role and organizational information.
    synonyms:
      - "User"
      - "Employee"
      - "TMS User"
    primary_key: "user_id"
    columns:
      user_id: "Unique TMS user identifier."
      user_name: "Full name of the user."
      role_count: "Number of roles assigned to the user."
      roles: "List of roles assigned to the user."
      departments: "Departments associated with the user's roles."
      sub_departments: "Sub-departments associated with the user's roles."

  tms_role_flat:
    grain: "One row per role/department mapping"
    description: >
      Organizational mapping between TMS role, department, and sub-department.
    synonyms:
      - "Role"
      - "TMS Role"
      - "Organizational Role"
    primary_key: "role_dept_id"
    columns:
      role_dept_id: "Unique identifier of the role/department mapping."
      role: "TMS role name."
      department: "Department associated with the role."
      sub_department: "Sub-department associated with the role."
      department_path: "Combined department and sub-department representation."
