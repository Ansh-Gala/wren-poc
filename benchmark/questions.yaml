# TMS Benchmark Questions with Ground-Truth SQL
#
# Written against DB: arvind_retail_chatbot_test_1 (Postgres)
# Views: tms_business_object_flat, tms_task_flat, tms_user_flat, tms_role_flat,
#        tms_business_object_attributes_flat, tms_user_department_flat
#
# The original CSV set used LIDL_PRE_BULK, TMS_REDO and quality Q1/Q2. None of
# those exist in this database, so each question is anchored to a real value
# that actually carries data:
#   LIDL_PRE_BULK       -> AR_YD_Suiting        (22 BOs, 208 tasks)
#   TMS_REDO            -> AR_NPD_Shirting      (10 BOs)
#   quality Q1/Q2       -> category / season    (quality is 100% NULL)
#
# Anchors chosen per question because attribute coverage is uneven:
#   season      only AR_NPD_YD_SALESPLAN carries it (10 BOs, all non-NULL);
#               it is NULL for all 22 AR_YD_Suiting rows.
#   category    AR_YD_Suiting is 100% 'Suiting', so "category = Shirting" was
#               self-contradictory; AR_NPD_YD_SHIRTING has 15 mixed categories.
#   PVH         exactly one BO (id 23), type AR_NPD_YD_SHIRTING, category
#               'Prints'. Every other row is business_unit 'unit1'.
#   MY_TASK     current user is assigned_user_id = 1 ('Admin'): 17 open,
#               266 closed, 27 delayed, 4 open in AR_YD_Suiting. User 123 does
#               not exist in this database.
#
# Categories:
#   - Basic List, Count, Limit, BO Filter, BO Aggregation
#   - Business Unit Filter/Aggregation, Dynamic JSON Filter/Sort/Aggregation
#   - Task List/Filter/Count/Aggregation, Combined Filter, Sort
#   - MY_TASK, Security, Prompt Injection, Sensitive Field
#   - Natural Language Variation, Golden Regression

