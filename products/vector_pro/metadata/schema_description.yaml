ambiguities:
- subject: dates are epoch seconds
  note: 'Almost every date column (*_date, *_on, *_etc) is a BIGINT holding Unix epoch seconds, not a
    TIMESTAMP. Show a date with timezone(''Asia/Kolkata'', to_timestamp(col))::date and compare with today
    using EXTRACT(EPOCH FROM date_trunc(''day'', now() AT TIME ZONE ''Asia/Kolkata'') AT TIME ZONE ''Asia/Kolkata'')::bigint.
    Exceptions that are real timestamps: vpp_users.date_joined and vpp_utility_fileupload.file_uploaded.'
- subject: soft delete
  note: Projects, tasks, subtasks, issues, actions and master data are soft-deleted. Always add the table's
    *_is_deleted = false (file_isdeleted for files) unless the question is about deleted records.
- subject: three task identifiers
  note: task_uid is the primary key and the join key for subtasks, participants and attachments. gantt_id
    (UUID) is used by links and the hierarchy. task_id is the WBS id text such as '1.2' and is unique
    only inside a project. A bare "task 123" means task_uid = 123.
- subject: task status codes
  note: task_status_id 1 NS, 2 RTS, 3 Started, 4 Completed. Open / pending tasks are task_status_id IN
    (1, 2, 3). "Ready" or "ready to start" means 2. In-progress means 3.
- subject: subtask status codes
  note: subtask_status_id 1 NS, 2 Active, 6 Completed; other codes are waiting / review / hold states.
    Join vpp_planning_subtaskstatus for names rather than guessing a code.
- subject: open issues
  note: An issue counts as open while issue_status IN (1, 2). Status 2 Resolved is still awaiting review
    and closure. Only 3 is closed.
- subject: yellow colour
  note: status_color stores yellow as '#FFCB00'. Use status_color = '#FFCB00', never 'yellow'.
- subject: leaf tasks and parents
  note: Only leaf tasks (workflow_id IS NOT NULL) have subtasks. Parent tasks roll up their children,
    so counting work items should normally count leaf tasks, or filter gant_task_type = 'task'.
- subject: critical and near-critical tasks
  note: Critical tasks have task_is_critical = true (floating_time_gap = 0). Near-critical tasks have
    a small positive floating_time_gap within the project's near_cc percentage.
- subject: delayed tasks
  note: task_isdelayed = true is the simple delayed flag. Details are in task_delay_indicator JSON (progress
    delay versus subtask roll-up delay).
- subject: user names
  note: User columns hold ids. Join vpp_users on id and show first_name || ' ' || last_name.
terminology:
  CCPM: Critical Chain Project Management, the planning method VectorPro implements.
  project: Also called a plan. Lives in vpp_planning_projects.
  task: A node of the project plan in vpp_planning_tasks, nested up to 5 levels.
  leaf task: The lowest task, carrying a workflow and the only kind that holds subtasks.
  subtask: A unit of work under a leaf task, progressed through workflow phases.
  milestone: A 0-day task (task_is_milestone = true) that follows its direct predecessors.
  NS: Not Started.
  RTS: Ready To Start. A task whose predecessors allow it to start, per project_task_rts_config.
  ETC: Expected Time of Completion, the forecast finish date recalculated daily by the buffer run.
  buffer: Time protection added at the end of the critical chain (project buffer) or feeding chains.
  buffer penetration: Share of the buffer consumed (project_penetration, percent).
  fever chart: Buffer penetration plotted against chain completion. It gives the status colour green,
    yellow or red, and black once the due date has passed.
  critical chain: The longest chain of dependent tasks considering resources; its tasks have zero floating
    time gap.
  rebaseline: Replanning a project. Type 1 keeps the due date, type 2 moves it by total duration and type
    3 moves it by remaining duration.
  stagnancy: Working days without progress since last_modified_on.
  elapsed days: Working days since actual start; stops when the item closes.
  FOL: Flow-of-load calculation during planning that adjusts link lags (introduced_lag) for resource load.
  heatmap: Resource-congestion view showing queued load per team against its flow rate.
  portfolio: A group of projects with one Portfolio Manager.
  common issue: An issue not attached to any project, task or subtask.
