    \  AND t.task_is_deleted = false\n  AND t.task_status_id IN (1, 2, 3)\n  AND t.workflow_id IS NOT\
    \ NULL\nGROUP BY ts.task_status_id, ts.task_status\nORDER BY ts.task_status_id\n"
- id: project_task_completion_share
  category: tasks
  question: What percentage of tasks in project 196 are completed?
  expected_sql: "SELECT COUNT(*) FILTER (WHERE t.task_status_id = 4) AS completed_tasks,\n       COUNT(*)\
    \ AS total_tasks,\n       ROUND(100.0 * COUNT(*) FILTER (WHERE t.task_status_id = 4) / NULLIF(COUNT(*),\
    \ 0), 1) AS completed_tasks_pct,\n       (SELECT ROUND(p.project_completion::numeric, 1) FROM vpp_planning_projects\
    \ p WHERE p.project_id = 196)\n         AS project_completion\nFROM vpp_planning_tasks t\nWHERE t.project_id_id\
    \ = 196\n  AND t.task_is_deleted = false\n  AND t.workflow_id IS NOT NULL\n"
- id: delayed_tasks_running_projects
  category: tasks
  question: Which tasks are delayed?
  expected_sql: "SELECT p.project_name, t.task_uid, t.task_id, t.task_name,\n       (t.task_delay_indicator->>'delay_on_task_progress')::numeric\
    \ AS delay_days,\n       ROUND(t.task_completion::numeric, 1) AS task_completion,\n       REPLACE(tm.username,\
    \ '_deleted_user_' || tm.id, '') AS task_manager_name\nFROM vpp_planning_tasks t\nJOIN vpp_planning_projects\
    \ p ON p.project_id = t.project_id_id\nLEFT JOIN vpp_users tm ON tm.id = t.task_manager_id\nWHERE\
    \ COALESCE((t.task_delay_indicator->>'task_is_delayed')::boolean, false) = true\n  AND t.task_status_id\
    \ IN (1, 2, 3)\n  AND t.task_is_deleted = false\n  AND p.project_status = 'in_execution'\n  AND p.project_is_deleted\
    \ = false\nORDER BY (t.task_delay_indicator->>'delay_on_task_progress')::numeric DESC NULLS LAST\n"
- id: tasks_with_most_delay_days
  category: tasks
  question: Which open tasks have the most days of delay?
  expected_sql: "SELECT p.project_name, t.task_uid, t.task_name,\n       (t.task_delay_indicator->>'delay_on_task_progress')::numeric\
    \ AS delay_days,\n       (t.task_delay_indicator->>'roll_up_delay_on_subtask_progress')::numeric AS\
    \ rollup_delay_days\nFROM vpp_planning_tasks t\nJOIN vpp_planning_projects p ON p.project_id = t.project_id_id\n\
    WHERE t.task_status_id IN (1, 2, 3)\n  AND t.task_is_deleted = false\n  AND p.project_status = 'in_execution'\n\
    \  AND p.project_is_deleted = false\n  AND COALESCE((t.task_delay_indicator->>'delay_on_task_progress')::numeric,\
    \ 0) > 0\nORDER BY delay_days DESC\nLIMIT 10\n"
- id: tasks_late_against_baseline
  category: tasks
  question: Which tasks are past their planned finish date and still not done?
  expected_sql: "SELECT p.project_name, t.task_uid, t.task_name,\n       timezone('Asia/Kolkata', to_timestamp(t.task_baseline_finish_date))::date\
    \ AS task_baseline_finish_date,\n       timezone('Asia/Kolkata', to_timestamp(t.task_expected_finish_date))::date\
    \ AS task_expected_finish_date,\n       (now() AT TIME ZONE 'Asia/Kolkata')::date - timezone('Asia/Kolkata',\
    \ to_timestamp(t.task_baseline_finish_date))::date AS calendar_days_past_plan\nFROM vpp_planning_tasks\
    \ t\nJOIN vpp_planning_projects p ON p.project_id = t.project_id_id\nWHERE t.task_actual_finish_date\
    \ IS NULL\n  AND t.task_is_deleted = false\n  AND t.workflow_id IS NOT NULL\n  AND t.task_baseline_finish_date\
    \ < EXTRACT(EPOCH FROM date_trunc('day', now() AT TIME ZONE 'Asia/Kolkata') AT TIME ZONE 'Asia/Kolkata')::bigint\n\
    \  AND p.project_status = 'in_execution'\n  AND p.project_is_deleted = false\nORDER BY t.task_baseline_finish_date\n"
- id: critical_open_tasks
  category: tasks
  question: What are the open critical tasks of project 196?
  expected_sql: "SELECT t.task_uid, t.task_id, t.task_name, ts.task_status AS task_status,\n       t.floating_time_gap,\
    \ timezone('Asia/Kolkata', to_timestamp(t.task_expected_finish_date))::date AS task_expected_finish_date\n\
    FROM vpp_planning_tasks t\nJOIN vpp_planning_taskstatus ts ON ts.task_status_id = t.task_status_id\n\
    WHERE t.project_id_id = 196\n  AND t.task_is_critical = true\n  AND t.task_status_id IN (1, 2, 3)\n\
    \  AND t.task_is_deleted = false\nORDER BY t.task_expected_start_date\n"
- id: near_critical_not_critical
  category: tasks
  question: Which tasks in project 196 are near-critical but not critical?
  expected_sql: "SELECT t.task_uid, t.task_name, t.floating_time_gap, t.task_rem_duration\nFROM vpp_planning_tasks\
    \ t\nWHERE t.project_id_id = 196\n  AND t.is_flowobstacle_task = true\n  AND t.task_is_critical =\
    \ false\n  AND t.workflow_id IS NOT NULL\n  AND t.task_actual_finish_date IS NULL\n  AND t.task_rem_duration\
    \ > 0\n  AND t.task_is_deleted = false\nORDER BY t.task_expected_start_date, t.floating_time_gap\n"
- id: stagnant_tasks
  category: tasks
  question: Which started tasks have had no progress for the longest time?
  expected_sql: "SELECT p.project_name, t.task_uid, t.task_name, t.task_stagnancy,\n       REPLACE(tm.username,\
