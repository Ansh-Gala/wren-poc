questions:
- id: project_by_id
  category: projects
  question: Show me project 196
  expected_sql: "SELECT p.project_id, p.project_code, p.project_name, p.project_status,\n       pf.portfolio_name,\n\
    \       REPLACE(pm.username, '_deleted_user_' || pm.id, '') AS project_manager_name,\n       timezone('Asia/Kolkata',\
    \ to_timestamp(p.project_actual_start_date))::date AS project_actual_start_date,\n       timezone('Asia/Kolkata',\
    \ to_timestamp(p.project_due_date))::date AS project_due_date,\n       timezone('Asia/Kolkata', to_timestamp(p.project_etc))::date\
    \ AS project_etc,\n       p.project_completion, p.status_color\nFROM vpp_planning_projects p\nJOIN\
    \ vpp_masterdata_portfolios pf ON pf.portfolio_id = p.portfolio_id\nJOIN vpp_users pm ON pm.id = p.project_manager_id\n\
    WHERE p.project_id = 196\n  AND p.project_is_deleted = false\n"
- id: count_running_projects
  category: projects
  question: How many projects are running?
  expected_sql: "SELECT COUNT(*) AS running_projects\nFROM vpp_planning_projects p\nWHERE p.project_status\
    \ = 'in_execution'\n  AND p.project_is_deleted = false\n"
- id: projects_by_status
  category: projects
  question: How many projects are there in each status?
  expected_sql: 'SELECT p.project_status, COUNT(*) AS projects

    FROM vpp_planning_projects p

    WHERE p.project_is_deleted = false

    GROUP BY p.project_status

    ORDER BY projects DESC

    '
- id: active_projects_ambiguous
  category: projects
  question: List the active projects
  expected_sql: "SELECT p.project_id, p.project_name, p.project_status\nFROM vpp_planning_projects p\n\
    WHERE p.project_status IN ('in_execution', 'in_planning', 'ready_to_schedule', 'scheduled')\n  AND\
    \ p.project_is_deleted = false\nORDER BY p.project_priority ASC\n"
- id: yellow_projects
  category: projects
  question: Which projects are in yellow?
  expected_sql: "SELECT p.project_id, p.project_name, p.project_completion, p.project_planned_completion,\n\
    \       timezone('Asia/Kolkata', to_timestamp(p.project_etc))::date AS project_etc, timezone('Asia/Kolkata',\
    \ to_timestamp(p.project_due_date))::date AS project_due_date\nFROM vpp_planning_projects p\nWHERE\
    \ p.status_color = '#FFCB00'\n  AND p.project_status = 'in_execution'\n  AND p.project_is_deleted\
    \ = false\nORDER BY p.project_priority ASC\n"
- id: projects_by_health_colour
  category: projects
  question: Give me the count of running projects by health colour
  expected_sql: "SELECT CASE p.status_color WHEN '#FFCB00' THEN 'yellow' ELSE p.status_color END AS status_color,\n\
    \       COUNT(*) AS projects\nFROM vpp_planning_projects p\nWHERE p.project_status = 'in_execution'\n\
    \  AND p.project_is_deleted = false\nGROUP BY 1\nORDER BY 1\n"
- id: overdue_projects
  category: projects
  question: Which projects are overdue?
  expected_sql: "SELECT p.project_id, p.project_name, p.project_status,\n       timezone('Asia/Kolkata',\
    \ to_timestamp(p.project_due_date))::date AS project_due_date,\n       (now() AT TIME ZONE 'Asia/Kolkata')::date\
    \ - timezone('Asia/Kolkata', to_timestamp(p.project_due_date))::date AS calendar_days_overdue\nFROM\
    \ vpp_planning_projects p\nWHERE p.project_status <> 'closed'\n  AND p.project_is_deleted = false\n\
    \  AND p.project_due_date < EXTRACT(EPOCH FROM date_trunc('day', now() AT TIME ZONE 'Asia/Kolkata')\
    \ AT TIME ZONE 'Asia/Kolkata')::bigint\nORDER BY p.project_due_date\n"
- id: forecast_late_projects
  category: projects
  question: Which running projects will finish late, and by how many days?
  expected_sql: "SELECT p.project_id, p.project_name,\n       timezone('Asia/Kolkata', to_timestamp(p.project_due_date))::date\
    \ AS project_due_date,\n       timezone('Asia/Kolkata', to_timestamp(p.project_etc))::date AS project_etc,\n\
    \       p.project_predicted_delay AS project_predicted_delay\nFROM vpp_planning_projects p\nWHERE\
    \ p.project_status = 'in_execution'\n  AND p.project_is_deleted = false\n  AND p.project_predicted_delay\
    \ > 0\nORDER BY p.project_predicted_delay DESC\n"
- id: projects_due_next_30_days
  category: projects
  question: Which projects are due in the next 30 days?
  expected_sql: "SELECT p.project_id, p.project_name, p.project_status, timezone('Asia/Kolkata', to_timestamp(p.project_due_date))::date\
    \ AS project_due_date\nFROM vpp_planning_projects p\nWHERE p.project_status = 'in_execution'\n  AND\
    \ p.project_is_deleted = false\n  AND p.project_due_date >= EXTRACT(EPOCH FROM date_trunc('day', now()\
    \ AT TIME ZONE 'Asia/Kolkata') AT TIME ZONE 'Asia/Kolkata')::bigint\n  AND p.project_due_date < EXTRACT(EPOCH\
    \ FROM date_trunc('day', now() AT TIME ZONE 'Asia/Kolkata') AT TIME ZONE 'Asia/Kolkata')::bigint +\
    \ 31 * 86400\nORDER BY p.project_due_date\n"
- id: top_priority_projects
  category: projects
  question: What are our top 5 priority projects?
  expected_sql: "SELECT p.project_id, p.project_name, p.project_priority, p.project_status\nFROM vpp_planning_projects\
    \ p\nWHERE p.project_status = 'in_execution'\n  AND p.project_is_deleted = false\nORDER BY p.project_priority\
    \ ASC\nLIMIT 5\n"
- id: closed_projects_late
  category: projects
  question: Which projects closed this year finished late, and by how many days?
  expected_sql: "WITH closure AS (\n  SELECT r.host_id AS project_id,\n         EXTRACT(EPOCH FROM date_trunc('day',\
    \ timezone('Asia/Kolkata', to_timestamp(MAX(r.remark_created_on))))\n                 AT TIME ZONE\
    \ 'Asia/Kolkata')::bigint AS closed_day\n  FROM vpp_planning_remark r\n  WHERE r.host_type = 'project'\n\
    \    AND r.host_status = 'closed'\n  GROUP BY r.host_id\n)\nSELECT p.project_id, p.project_name,\n\
    \       timezone('Asia/Kolkata', to_timestamp(p.project_due_date))::date AS project_due_date,\n  \
    \     timezone('Asia/Kolkata', to_timestamp(c.closed_day))::date AS project_closed_on,\n       (c.closed_day\
    \ - p.project_due_date) / 86400 AS calendar_days_late,\n       CASE WHEN c.closed_day > p.project_due_date\
    \ THEN 'Delayed'\n            WHEN c.closed_day < p.project_due_date THEN 'Before Time'\n        \
    \    ELSE 'On Time' END AS outcome\nFROM vpp_planning_projects p\nJOIN closure c ON c.project_id =\
    \ p.project_id\nWHERE p.project_status = 'closed'\n  AND p.project_is_deleted = false\n  AND c.closed_day\
    \ > p.project_due_date\n  AND timezone('Asia/Kolkata', to_timestamp(c.closed_day))::date >= date_trunc('year',\
    \ now() AT TIME ZONE 'Asia/Kolkata')::date\nORDER BY calendar_days_late DESC\n"
- id: project_progress_pace
  category: projects
  question: Which running projects are behind on recent progress?
  expected_sql: "SELECT p.project_id, p.project_name,\n       p.project_completed_progress AS project_completed_progress,\n\
    \       p.project_expected_progress AS project_expected_progress,\n       CASE WHEN p.project_completed_progress\
    \ = 0 THEN 'No progress'\n            WHEN p.project_completed_progress >= p.project_expected_progress\
    \ THEN 'On track'\n            ELSE 'Behind' END AS pace\nFROM vpp_planning_projects p\nWHERE p.project_status\
    \ = 'in_execution'\n  AND p.project_is_deleted = false\n  AND p.project_completed_progress < p.project_expected_progress\n\
    ORDER BY p.project_expected_progress - p.project_completed_progress DESC\n"
- id: plan_vs_actual_completion
  category: projects
  question: For each running project, compare planned and actual completion
  expected_sql: "SELECT p.project_id, p.project_name,\n       ROUND(p.project_completion::numeric, 1)\
    \ AS project_completion,\n       ROUND(p.project_planned_completion::numeric, 1) AS project_planned_completion,\n\
    \       ROUND((p.project_completion - p.project_planned_completion)::numeric, 1) AS gap_pct_points,\n\
    \       ROUND(p.project_penetration::numeric, 1) AS project_penetration\nFROM vpp_planning_projects\
    \ p\nWHERE p.project_status = 'in_execution'\n  AND p.project_is_deleted = false\nORDER BY gap_pct_points\n"
- id: buffer_overrun
  category: projects
  question: Which projects have consumed more than their whole buffer?
  expected_sql: "SELECT p.project_id, p.project_name, ROUND(p.project_penetration::numeric, 1) AS project_penetration\n\
    FROM vpp_planning_projects p\nWHERE p.project_status = 'in_execution'\n  AND p.project_is_deleted\
    \ = false\n  AND p.project_penetration > 100\nORDER BY p.project_penetration DESC\n"
- id: project_trend_last_days
  category: projects
  question: How has project 196's completion and colour changed over the last 7 days?
  expected_sql: "SELECT DISTINCT ON (history_created_on)\n       timezone('Asia/Kolkata', to_timestamp(h.history_created_on))::date\
    \ AS history_created_on,\n       h.project_completion,\n       CASE h.status_color WHEN '#FFCB00'\
    \ THEN 'yellow' ELSE h.status_color END AS status_color,\n       timezone('Asia/Kolkata', to_timestamp(h.project_etc))::date\
    \ AS project_etc\nFROM vpp_planning_projectshistory h\nWHERE h.project_id = 196\n  AND h.history_created_on\
    \ >= EXTRACT(EPOCH FROM date_trunc('day', now() AT TIME ZONE 'Asia/Kolkata') AT TIME ZONE 'Asia/Kolkata')::bigint\
    \ - 6 * 86400\nORDER BY history_created_on, h.history_created_on DESC\n"
- id: rebaseline_count
  category: projects
  question: How many times has project 196 been rebaselined and when was the last one?
  expected_sql: "SELECT (SELECT COUNT(DISTINCT l.version) FROM vpp_planning_rebaselinelog l\n        WHERE\
    \ l.project_id = p.project_id AND l.name LIKE 'Rebaseline %') AS logged_rebaselines,\n       timezone('Asia/Kolkata',\
    \ to_timestamp(p.project_last_rebaselined_on))::date AS project_last_rebaselined_on,\n       CASE\
    \ p.project_rebaseline_type WHEN 0 THEN 'Never rebaselined' WHEN 1 THEN 'Type 1: due date kept'\n\
    \            WHEN 2 THEN 'Type 2: due date from total duration' WHEN 3 THEN 'Type 3: due date from\
    \ remaining duration'\n       END AS rebaseline_type_label\nFROM vpp_planning_projects p\nWHERE p.project_id\
    \ = 196\n  AND p.project_is_deleted = false\n"
- id: project_team_members
  category: projects
  question: Who are the manager and coordinators of project 341?
  expected_sql: 'SELECT ''Project Manager'' AS role_in_project, REPLACE(u.username, ''_deleted_user_''
    || u.id, '''') AS user_name

    FROM vpp_planning_projects p

    JOIN vpp_users u ON u.id = p.project_manager_id

    WHERE p.project_id = 341 AND p.project_is_deleted = false

    UNION ALL

    SELECT ''Coordinator'', REPLACE(u.username, ''_deleted_user_'' || u.id, '''')

    FROM vpp_planning_projectcoordinatormapping c

    JOIN vpp_planning_projects p ON p.project_id = c.project_id_id AND p.project_is_deleted = false

    JOIN vpp_users u ON u.id = c.coordinator_id_id

    WHERE c.project_id_id = 341

    '
- id: overdue_project_actions
  category: projects
  question: Which project actions are overdue?
  expected_sql: "SELECT a.action_id, p.project_name, a.action_description, a.action_status,\n       REPLACE(u.username,\
    \ '_deleted_user_' || u.id, '') AS action_owner_name,\n       timezone('Asia/Kolkata', to_timestamp(a.action_planned_completion_date))::date\
    \ AS action_planned_completion_date\nFROM vpp_planning_projectactions a\nJOIN vpp_planning_projects\
    \ p ON p.project_id = a.project_id_id\nLEFT JOIN vpp_users u ON u.id = a.action_owner_id\nWHERE LOWER(a.action_status)\
    \ <> 'closed'\n  AND a.action_is_deleted = false\n  AND p.project_is_deleted = false\n  AND a.action_planned_completion_date\
    \ < EXTRACT(EPOCH FROM date_trunc('day', now() AT TIME ZONE 'Asia/Kolkata') AT TIME ZONE 'Asia/Kolkata')::bigint\n\
    ORDER BY a.action_planned_completion_date\n"
- id: task_by_uid
  category: tasks
  question: Show task 21245
  expected_sql: "SELECT t.task_uid, t.task_id, t.task_name, ts.task_status AS task_status,\n       p.project_id,\
    \ p.project_name,\n       REPLACE(tm.username, '_deleted_user_' || tm.id, '') AS task_manager_name,\n\
    \       ROUND(t.task_completion::numeric, 1) AS task_completion,\n       timezone('Asia/Kolkata',\
    \ to_timestamp(t.task_baseline_finish_date))::date AS task_baseline_finish_date,\n       timezone('Asia/Kolkata',\
    \ to_timestamp(t.task_expected_finish_date))::date AS task_expected_finish_date\nFROM vpp_planning_tasks\
    \ t\nJOIN vpp_planning_projects p ON p.project_id = t.project_id_id\nLEFT JOIN vpp_planning_taskstatus\
    \ ts ON ts.task_status_id = t.task_status_id\nLEFT JOIN vpp_users tm ON tm.id = t.task_manager_id\n\
