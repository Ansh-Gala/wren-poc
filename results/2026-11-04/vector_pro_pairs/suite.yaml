    \       CASE i.issue_status WHEN 1 THEN 'Open' WHEN 2 THEN 'Resolved, awaiting closure' END AS issue_status_label,\n\
    \       REPLACE(o.username, '_deleted_user_' || o.id, '') AS issue_owner_name,\n       timezone('Asia/Kolkata',\
