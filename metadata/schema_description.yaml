data_source: postgres
catalog: ""
schema: public

tables:
  tms_business_object_flat:
    description: >-
      Flat TMS Business Object table containing business-object identity, business unit,
      type, priority/color, due dates, buffers, workflow, process status, milestone and
      task summary information. Also known as Initiative, Order, or BO.
    primary_key: business_object_id
    columns:
      business_object_id:
        type: INTEGER
        description: Unique identifier of the Business Object / Initiative / Order / BO.
      business_object_ref_id:
        type: VARCHAR
        description: Human-readable reference identifier of the Business Object.
      business_unit:
        type: VARCHAR
        description: Business unit associated with the Business Object.
      business_object_type:
        type: VARCHAR
        description: Type of the Business Object (e.g. AR_YD_Suiting, AR_NPD_Shirting).
      business_object_color:
        type: VARCHAR
        description: Priority/color classification of the Business Object.
      business_object_status:
        type: VARCHAR
        description: Business Object process status, mapped as Active, Closed, or Short Closed.
      total_task_count:
        type: BIGINT
        description: Total number of tasks associated with the Business Object.

  tms_business_object_attributes_flat:
    description: >-
      Dynamic JSON attributes for the Business Object, such as season, category, quality, etc.
    primary_key: business_object_id
    columns:
      business_object_id:
        type: INTEGER
        description: Unique identifier of the Business Object.
      category:
        type: VARCHAR
        description: Category attribute for the Business Object.
      season:
        type: VARCHAR
        description: >-
          Season attribute for the Business Object. Sparsely populated: only 16 of
          307 rows have a value, and they all belong to the AR_NPD_YD_SALESPLAN,
          AR_SALESPLAN_Shirting and AR_SALESPLAN_Suiting types.
      quality:
        type: VARCHAR
        description: >-
          Quality attribute for the Business Object. Present in the view but NULL
          for every row in this database, so no filter on it can return results.

  tms_task_flat:
    description: >-
      Flat TMS task table containing task identity, assignment, status, dates, SLA/buffer,
      workflow/process context, Business Object context, and task-related business fields.
    primary_key: task_id
    columns:
      task_id:
        type: INTEGER
        description: Unique identifier of the task.
      task_display_name:
        type: VARCHAR
        description: User-facing display name of the task.
      task_status:
        type: VARCHAR
        description: >-
          Database status of the task, lowercase. Observed values: 'open', 'closed'.
          This is the canonical status column -- use it for all filtering, grouping
          and status breakdowns.
      task_display_status:
        type: VARCHAR
        description: >-
          Capitalised presentation form of task_status ('Open', 'Closed'), for UI
          display only. Do not filter or group by this column; use task_status.
      assigned_user_id:
        type: INTEGER
        description: Unique identifier of the user assigned to the task.
      assigned_user_name:
        type: VARCHAR
        description: Name of the user assigned to the task.
      business_object_type:
        type: VARCHAR
        description: Type of the associated Business Object.
      business_object_ref_id:
        type: VARCHAR
        description: Reference ID of the associated Business Object.
      bo_id:
        type: INTEGER
        description: Foreign key to tms_business_object_flat.business_object_id.
      display_flag:
        type: INTEGER
        description: Indicates whether the task is configured to be displayed.
      task_sla_status:
        type: VARCHAR
        description: SLA status of the task (e.g. Delayed, On Time).

  tms_user_flat:
    description: Flat TMS user table containing user identity, roles and organizational information.
    primary_key: user_id
    columns:
      user_id:
        type: INTEGER
        description: Unique identifier of the TMS user.
      user_name:
        type: VARCHAR
        description: Full name of the TMS user.

  tms_role_flat:
    description: Flat TMS organizational role mapping table.
    primary_key: role_dept_id
    columns:
      role_dept_id:
        type: INTEGER
        description: Unique identifier of the role/department mapping.
      role:
        type: VARCHAR
        description: TMS role name.
      department:
        type: VARCHAR
        description: Department associated with the role.

relationships:
  - name: task_business_object
    from: tms_task_flat.bo_id
    to: tms_business_object_flat.business_object_id
    join_type: MANY_TO_ONE
    description: >-
      A task belongs to a Business Object.

  - name: business_object_attributes
    from: tms_business_object_attributes_flat.business_object_id
    to: tms_business_object_flat.business_object_id
    join_type: ONE_TO_ONE
    description: >-
      Attributes for a business object.

terminology:
  business object: Also known as Initiative, Order, or BO. Represents a workflow process.
  delayed task: A task whose elapsed duration exceeds its SLA buffer.
  my tasks: Tasks assigned to the current user that are open and meant to be displayed.

ambiguities:
  - subject: business object synonyms
    note: Initiative, Order, BO, and Business Object all refer to tms_business_object_flat.
  - subject: task assignment
    note: Use assigned_user_id to check who is assigned to a task.
