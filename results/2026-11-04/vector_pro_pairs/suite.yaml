    \ target_value,\n       j.value->>'is_applicable' AS is_applicable\nFROM vpp_planning_subtasks s\n\
    JOIN vpp_planning_tasks t ON t.task_uid = s.task_id\nCROSS JOIN LATERAL jsonb_each(s.subtask_phase_json)\
    \ j\nJOIN vpp_masterdata_phases ph\n  ON ph.phase_code = j.key::uuid\n AND ph.workflow_id = t.workflow_id\n\
    \ AND ph.phase_is_deleted = false\nWHERE s.subtask_id = 1044\n  AND s.subtask_is_deleted = false\n\
    ORDER BY ph.phase_sequence_index\n"
- id: open_issues_of_project
  category: issues
