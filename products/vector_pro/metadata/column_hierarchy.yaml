    - Health, ETC, completion, penetration and delay are current only for in_execution projects; for other statuses
      show them only on request and say they are from the last calculation.
    - Show project_actual_start_date as the start date; project_start_date can be a virtual date after a Type 3
      rebaseline. For projects not yet started (in_planning, ready_to_schedule, scheduled) show project_start_date
      as the planned start instead.
    - expected_rebaseline_type is shown by the application only to VP_Admin, VP_MasterScheduler and VP_TopManagement;
      output it only to those roles.
    - Custom attributes (project_custom_attribute) are JSON keyed by attribute UUIDs whose names are stored in the
      database; never output them raw.
