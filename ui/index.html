<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQL chatbot — QA console</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="bar">
  <div class="bar-left">
    <strong>SQL chatbot</strong>
    <span class="muted">QA console</span>
  </div>
  <div class="bar-right">
    <label class="toggle" title="Off by default. The server omits SQL, metadata and diagnostics entirely rather than the page hiding them, so this applies from the next question onwards.">
      <input type="checkbox" id="debug-mode">
      debug mode
    </label>
    <button id="toggle-setup" type="button" class="btn" aria-controls="setup-rail">Hide setup</button>
    <button id="reset-context" type="button" class="btn">Reset context</button>
    <button id="clear-chat" type="button" class="btn">Clear chat</button>
  </div>
</header>

<main class="layout">

  <!-- ------------------------------------------------------- chat -->
  <section class="chat" aria-label="Conversation">
    <div id="messages" class="messages">
      <div class="empty" id="empty-hint">
        <h1 class="chat-hero">Ready when you are.</h1>
        <p>Ask anything. Every turn shows what the backend decided.</p>
      </div>
    </div>

    <div id="error-banner" class="error-banner" hidden></div>

    <form id="composer" class="composer">
      <textarea id="input" rows="1" placeholder="Ask a question…  (Enter to send, Shift+Enter for a newline)"
                autocomplete="off"></textarea>
      <button id="send" type="submit" class="btn btn-primary">Send</button>
    </form>
  </section>

  <!-- ------------------------------------------------ setup panel -->
  <!-- Which databases, modes and model answer. Filled from GET /info. -->
  <aside class="rail" id="setup-rail" aria-label="Setup">
    <h2>Setup</h2>
    <div id="setup" aria-live="polite"></div>
  </aside>

</main>

<script src="table-copy.js"></script>
<script src="sql-highlight.js"></script>
<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
