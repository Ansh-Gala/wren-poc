version: 1

pairs:
  - nl: Show me Initiative 123
    source: poc
    sql: |
      SELECT initiative_id, initiative_ref_id, business_unit, initiative_status
      FROM tms_initiative_flat
      WHERE initiative_id = 123

  - nl: How many open tasks are in BO 123?
    source: poc
    sql: |
      SELECT open_task_count
      FROM tms_initiative_flat
      WHERE initiative_id = 123

  - nl: What are my current tasks?  (with a SIGNED-IN USER block giving id 4213)
    source: poc
    sql: |
      SELECT task_id, task_display_name, initiative_ref_id
      FROM tms_task_flat
      WHERE assigned_user_id = 4213
        AND task_status = 'open'
        AND display_flag = 1

  - nl: Which initiatives are active?
    source: poc
    sql: |
      SELECT initiative_id, initiative_ref_id, initiative_type
      FROM tms_initiative_flat
      WHERE initiative_status = 'Active'

  - nl: What is Amit's full name?
    source: poc
    sql: |
      SELECT user_name
      FROM tms_user_flat
      WHERE user_name ILIKE '%Amit%'

  - nl: Show tasks that are not assigned to anyone
    source: poc
    sql: |
      SELECT task_id, task_display_name, initiative_ref_id
      FROM tms_task_flat
      WHERE assigned_user_name = 'NA'
        AND task_status = 'open'

  - nl: Which tasks are delayed?
    source: poc
    sql: |
      SELECT task_id, task_display_name, assigned_user_name
      FROM tms_task_flat
      WHERE task_sla_status = 'Delayed' AND task_status = 'open'

  - nl: Which roles belong to the Sales department?
    source: poc
    sql: |
      SELECT role, department
      FROM tms_role_flat
      WHERE department ILIKE '%Sales%'

  - nl: How have open and delayed tasks changed week by week?
    source: poc
    sql: |
      SELECT timezone('Asia/Kolkata', to_timestamp(dt))::date AS week_start,
             SUM(open_green + open_yellow + open_red + open_black) AS open_tasks,
             SUM(CASE WHEN TRIM(bucket) IN ('B1', 'B2', 'B3')
                      THEN open_green + open_yellow + open_red + open_black ELSE 0 END) AS delayed_tasks
      FROM vf_report_task_summary
      WHERE report_type IS NULL
      GROUP BY dt
      ORDER BY dt

  - nl: Open tasks by department and colour in the latest week
    source: poc
    sql: |
      SELECT COALESCE(r.department, 'No department') AS department,
             SUM(s.open_green) AS green, SUM(s.open_yellow) AS yellow,
             SUM(s.open_red) AS red, SUM(s.open_black) AS black
      FROM vf_report_task_summary s
      LEFT JOIN (SELECT role, MAX(department) AS department FROM tms_role_flat GROUP BY role) r
        ON r.role = s.assigned_role
      WHERE s.report_type IS NULL
        AND s.dt = (SELECT MAX(dt) FROM vf_report_task_summary)
      GROUP BY 1
      ORDER BY 1
