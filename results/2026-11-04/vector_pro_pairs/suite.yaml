- id: milestone_status
  category: tasks
  question: Show the milestones of project 196 with their target date and status
  expected_sql: "SELECT t.task_uid, t.task_name,\n       timezone('Asia/Kolkata', to_timestamp(COALESCE(t.milestone_baseline_etc,\
    \ t.task_baseline_start_date)))::date AS milestone_target_date,\n       timezone('Asia/Kolkata', to_timestamp(COALESCE(t.task_actual_finish_date,\
    \ t.task_expected_finish_date)))::date AS forecast_or_actual,\n       CASE\n         WHEN t.task_actual_finish_date\
    \ IS NOT NULL AND t.task_completion >= 100 THEN 'Completed'\n         WHEN t.task_actual_finish_date\
    \ IS NOT NULL THEN 'Completed below 100%'\n         WHEN t.task_expected_finish_date <= COALESCE(t.milestone_baseline_etc,\
    \ t.task_baseline_start_date) THEN 'On track'\n         ELSE 'At risk of missing target'\n       END\
    \ AS milestone_status\nFROM vpp_planning_tasks t\nWHERE t.project_id_id = 196\n  AND t.task_is_milestone\
    \ = true\n  AND t.task_is_deleted = false\nORDER BY milestone_target_date\n"
- id: missed_milestones
  category: tasks
  question: Which upcoming milestones across running projects are forecast to miss their target?
  expected_sql: "SELECT p.project_name, t.task_uid, t.task_name,\n       timezone('Asia/Kolkata', to_timestamp(COALESCE(t.milestone_baseline_etc,\
    \ t.task_baseline_start_date)))::date AS milestone_target_date,\n       timezone('Asia/Kolkata', to_timestamp(t.task_expected_finish_date))::date\
    \ AS task_expected_finish_date,\n       timezone('Asia/Kolkata', to_timestamp(t.task_expected_finish_date))::date\
    \ - timezone('Asia/Kolkata', to_timestamp(COALESCE(t.milestone_baseline_etc, t.task_baseline_start_date)))::date\
    \ AS calendar_days_gap\nFROM vpp_planning_tasks t\nJOIN vpp_planning_projects p ON p.project_id =\
    \ t.project_id_id\nWHERE t.task_is_milestone = true\n  AND t.task_is_deleted = false\n  AND t.task_actual_finish_date\
    \ IS NULL\n  AND t.task_expected_finish_date > COALESCE(t.milestone_baseline_etc, t.task_baseline_start_date)\n\
    \  AND p.project_status = 'in_execution'\n  AND p.project_is_deleted = false\nORDER BY calendar_days_gap\
    \ DESC\n"
- id: descendants_of_parent_task
  category: tasks
  question: 'List all tasks under ''Task #4'' in project 196, and how many open subtasks they have'
  expected_sql: "WITH parent AS (\n  SELECT t.gantt_id\n  FROM vpp_planning_tasks t\n  WHERE t.project_id_id\
    \ = 196 AND t.task_name = 'Task #4' AND t.task_is_deleted = false\n)\nSELECT c.task_uid, c.task_id,\
    \ c.task_name, h.depth,\n       COUNT(s.subtask_id) FILTER (WHERE s.subtask_status_id IS DISTINCT\
    \ FROM 6) AS open_subtasks\nFROM vpp_planning_taskshierarchy h\nJOIN parent ON h.gantt_parent_task_id\
    \ = parent.gantt_id\nJOIN vpp_planning_tasks c ON c.gantt_id = h.gantt_id\nLEFT JOIN vpp_planning_subtasks\
    \ s ON s.task_id = c.task_uid AND s.subtask_is_deleted = false\nWHERE h.depth > 0\n  AND c.task_is_deleted\
    \ = false\nGROUP BY c.task_uid, c.task_id, c.task_name, h.depth\nORDER BY c.task_id\n"
- id: task_predecessors
  category: tasks
  question: 'What are the predecessors of ''Task #3'' in project 196 and what type of dependency is each?'
  expected_sql: "SELECT pred.task_uid, pred.task_id, pred.task_name AS predecessor,\n       CASE l.link_type\
    \ WHEN '0' THEN 'Finish-to-Start' WHEN '1' THEN 'Start-to-Start'\n                        WHEN '2'\
    \ THEN 'Finish-to-Finish' WHEN '3' THEN 'Start-to-Finish' END AS dependency_type,\n       l.lag, l.new_lag\n\
    FROM vpp_planning_tasks succ\nJOIN vpp_planning_links l ON l.gantt_target_id = succ.gantt_id\nJOIN\
    \ vpp_planning_tasks pred ON pred.gantt_id = l.gantt_source_id\nWHERE succ.project_id_id = 196\n \
    \ AND succ.task_name = 'Task #3'\n  AND succ.task_is_deleted = false\n  AND pred.task_is_deleted =\
    \ false\n"
- id: count_dependencies
  category: tasks
  question: How many dependencies are there in project 196?
  expected_sql: 'SELECT COUNT(*) AS dependencies

    FROM vpp_planning_links l

    JOIN vpp_planning_tasks s ON s.gantt_id = l.gantt_source_id AND s.task_is_deleted = false

    JOIN vpp_planning_tasks t ON t.gantt_id = l.gantt_target_id AND t.task_is_deleted = false

    WHERE l.project_id = 196

    '
- id: delay_reasons_breakdown
  category: tasks
  question: What are the most common reasons recorded for task delays?
  expected_sql: 'SELECT mr.major_reason_name, mn.minor_reason_name, COUNT(DISTINCT d.task_uid) AS delayed_tasks

    FROM vpp_planning_taskdelaydetail d

    JOIN vpp_planning_tasks t ON t.task_uid = d.task_uid AND t.task_is_deleted = false

    LEFT JOIN vpp_masterdata_majorreasons mr ON mr.major_reason_id = d.major_reason_id

    LEFT JOIN vpp_masterdata_minorreasons mn ON mn.minor_reason_id = d.minor_reason_id

    GROUP BY mr.major_reason_name, mn.minor_reason_name

    ORDER BY delayed_tasks DESC

    '
- id: open_tasks_by_department
  category: tasks
  question: How many open tasks does each department have in running projects?
  expected_sql: "SELECT COALESCE(dep.department_name, 'No department') AS department_name, COUNT(*) AS\
    \ open_tasks\nFROM vpp_planning_tasks t\nJOIN vpp_planning_projects p ON p.project_id = t.project_id_id\n\
    LEFT JOIN vpp_masterdata_departments dep ON dep.department_id = t.department_id_id\nWHERE t.task_status_id\
    \ IN (1, 2, 3)\n  AND t.task_is_deleted = false\n  AND t.workflow_id IS NOT NULL\n  AND p.project_status\
    \ = 'in_execution'\n  AND p.project_is_deleted = false\nGROUP BY 1\nORDER BY open_tasks DESC\n"
- id: tasks_with_open_issues
  category: tasks
  question: Which open tasks have unresolved issues on them or on their subtasks?
  expected_sql: "SELECT p.project_name, t.task_uid, t.task_name,\n       COUNT(DISTINCT i.issue_id) AS\
    \ open_issues\nFROM vpp_planning_tasks t\nJOIN vpp_planning_projects p ON p.project_id = t.project_id_id\n\
    JOIN vpp_issue_issuehostmappings m\n  ON (m.issue_type = 'task' AND m.host_id = t.task_uid)\n  OR\
    \ (m.issue_type = 'subtask' AND m.host_id IN (SELECT s.subtask_id FROM vpp_planning_subtasks s\n \
    \                                                WHERE s.task_id = t.task_uid AND s.subtask_is_deleted\
    \ = false))\nJOIN vpp_issue_issues i ON i.issue_id = m.issue_id AND i.issue_status IN (1, 2) AND i.issue_is_deleted\
    \ = false\nWHERE t.task_status_id IN (1, 2, 3)\n  AND t.task_is_deleted = false\n  AND p.project_status\
    \ = 'in_execution'\n  AND p.project_is_deleted = false\nGROUP BY p.project_name, t.task_uid, t.task_name\n\
    ORDER BY open_issues DESC\n"
- id: open_subtasks_of_task
  category: subtasks
  question: Show the open subtasks of task 21245 with their status and manager
  expected_sql: "SELECT s.subtask_id, s.subtask_name, ss.subtask_status AS subtask_status,\n       REPLACE(sm.username,\
