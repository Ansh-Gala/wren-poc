version: 1

pairs:
  - nl: Show me Initiative 123
    source: poc
    sql: |
      SELECT initiative_id, initiative_ref_id, business_unit, initiative_status
      FROM tms_initiative_flat
      WHERE initiative_ref_id = '123'

  - nl: How many open tasks are in BO 123?
    source: poc
    sql: |
      SELECT COUNT(t.task_id) AS open_task_count
      FROM tms_task_flat t
      JOIN tms_initiative_flat b ON t.initiative_id = b.initiative_id
      WHERE t.task_status = 'open' AND b.initiative_ref_id = '123'

  - nl: What are my current tasks?
    source: poc
    sql: |
      SELECT task_id, task_display_name, initiative_ref_id
      FROM tms_task_flat
      WHERE assigned_user_id = 1
        AND task_status = 'open'
        AND display_flag = 1

  - nl: Which initiatives are active?
    source: poc
    sql: |
      SELECT initiative_id, initiative_ref_id, initiative_type
      FROM tms_initiative_flat
      WHERE initiative_status = 'Active'

  - nl: What is Amit's full name?
    source: poc
    sql: |
      SELECT user_name
      FROM tms_user_flat
      WHERE user_name ILIKE '%Amit%'

  - nl: Which tasks are delayed?
    source: poc
    sql: |
      SELECT task_id, task_display_name, assigned_user_name
      FROM tms_task_flat
      WHERE task_sla_status = 'Delayed'

  - nl: Which roles belong to the Sales department?
    source: poc
    sql: |
      SELECT role
      FROM tms_role_flat
      WHERE department = 'Sales'
