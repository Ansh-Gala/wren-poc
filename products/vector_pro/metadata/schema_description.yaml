# Generated by scripts/schema_description/build_schema_description.py from the live database.
# Column names and types come from the database catalog and must not be edited
# by hand. Descriptions ARE preserved across regeneration, so improving one
# here is safe (the business glossary still wins); run --check in CI to catch
# drift from the database. Contains schema metadata only, never table rows.
data_source: postgres
schema: public
tables:
  vpp_planning_projects:
    description: 'Projects planned and executed with Critical Chain Project Management (CCPM). One row
      per project. Lifecycle (project_status): in_planning -> ready_to_schedule -> scheduled -> in_execution,
      plus on_hold and closed. Every project has one mandatory Project Manager, optional Coordinators
      (vpp_planning_projectcoordinatormapping) and belongs to one Portfolio. Soft-deleted rows have project_is_deleted
      = true; always filter project_is_deleted = false. All *_date, *_on and *_etc columns are Unix epoch
      SECONDS, not timestamps.'
    primary_key: project_id
    columns:
      project_id:
        type: INTEGER
        description: Unique identifier of the project. A bare number after "project" means this column.
      project_name:
        type: VARCHAR
        description: Display name of the project.
      project_code:
        type: VARCHAR
        description: Business project code, unique when present; may be NULL. Use when a question quotes
          a project code rather than a number.
      project_status:
        type: VARCHAR
        description: 'Lifecycle status, lowercase text. Values: in_planning, ready_to_schedule, scheduled,
          in_execution, on_hold, closed. "Running", "active" or "live" projects means in_execution.'
      project_priority:
        type: DECIMAL
        description: Priority rank among open projects, 1 = highest. Recomputed by auto-reprioritisation.
      project_start_date:
        type: BIGINT
        description: Planned start date of the project (epoch seconds).
      project_due_date:
        type: BIGINT
        description: Committed due date of the project (epoch seconds). The deadline the buffer protects.
          A project whose due date is before today is overdue (status_color black).
      project_etc:
        type: BIGINT
        description: 'Expected Time of Completion (ETC): the date the project is currently forecast to
          finish, recalculated by the daily buffer run (epoch seconds). Compare with project_due_date
          to judge lateness.'
      project_completion:
        type: DOUBLE
        description: Critical-chain completion of the project in percent (0-100). X-axis of the fever
          chart.
      project_penetration:
        type: DOUBLE
        description: Buffer penetration (buffer consumed) in percent. Y-axis of the fever chart.
      project_duration:
        type: DOUBLE
        description: Total planned duration of the project in working days.
      project_is_slack_applicable:
        type: BOOLEAN
        description: True when slack (float) is applied in scheduling.
      project_is_feeder_buffer_applicable:
        type: BOOLEAN
        description: True when feeder buffers are used for this project.
      project_buffer_duration:
        type: DOUBLE
        description: Project buffer length in working days.
      project_slack:
        type: DOUBLE
        description: Slack available on the project in working days.
      scheduling_logic:
        type: VARCHAR
        description: 'Scheduling mode: ALAP (As Late As Possible), ASAP (As Soon As Possible) or MIX (Mixed:
          a path behaves ASAP once its first task starts).'
      project_buffer:
        type: DECIMAL
        description: Project buffer as a percentage of duration, 0 to 100.
      near_cc:
        type: INTEGER
        description: Near-critical-chain threshold in percent (0-100). Tasks whose floating time gap is
          within this share are near-critical.
      project_is_deleted:
        type: BOOLEAN
        description: Soft-delete flag. Exclude rows where this is true.
      portfolio_id:
        type: INTEGER
        description: Portfolio the project belongs to. Joins to vpp_masterdata_portfolios.portfolio_id.
      project_manager_id:
        type: INTEGER
        description: The project's (mandatory) Project Manager. Joins to vpp_users.id.
      project_custom_attribute:
        type: JSON
        description: Client-configured custom attributes of the project as JSON (keys vary by site).
      project_created_by_id:
        type: INTEGER
        description: User who created the project. Joins to vpp_users.id.
      project_created_on:
        type: BIGINT
        description: When the project record was created (epoch seconds).
      project_modified_by_id:
        type: INTEGER
        description: User who last modified the project. Joins to vpp_users.id.
      project_modified_on:
        type: BIGINT
        description: When the project record was last modified (epoch seconds).
      project_completed_progress:
        type: DOUBLE
        description: Completed progress of the project (percent) used for progress charts.
      project_expected_progress:
        type: DOUBLE
        description: Progress expected by today according to the plan (percent).
      project_planned_completion:
        type: DOUBLE
        description: Planned completion percentage as of today.
      project_predicted_delay:
        type: DOUBLE
        description: Predicted delay of the project in days (ETC beyond due date). 0 means on time.
      project_rem_duration:
        type: DOUBLE
        description: Remaining duration of the critical chain in working days.
      project_internal_due_date:
        type: BIGINT
        description: End of the critical chain without the project buffer (epoch seconds); earlier than
          project_due_date.
      project_task_rts_config:
        type: INTEGER
        description: 'Rule that makes a task Ready To Start (RTS): 1 = start of any predecessor, 2 = start
          of all predecessors, 3 = network dependency of any predecessor, 4 = network dependency of all
          predecessors.'
      project_overwrite_task_baseline_dates:
        type: BOOLEAN
        description: True when the last rebaseline also overwrote task baseline dates.
      project_rebaseline_type:
        type: INTEGER
        description: 'Last rebaseline type: 0 = never rebaselined, 1 = scope changed and due date kept,
          2 = due date moved by total duration, 3 = due date moved by remaining duration.'
      last_successful_buffer_run_on:
        type: BIGINT
        description: When the daily buffer calculation last completed for this project (epoch seconds).
      status_color:
        type: VARCHAR
        description: 'Buffer-status colour from the fever chart: ''green'', ''#FFCB00'' (YELLOW is stored
          as this hex code, not the word), ''red'', or ''black'' (due date already passed). For "yellow
          projects" filter status_color = ''#FFCB00''.'
      expected_rebaseline_type:
        type: INTEGER
        description: Rebaseline type requested for the pending replan (same codes as project_rebaseline_type).
      project_actual_start_date:
        type: BIGINT
        description: Date the project actually started (epoch seconds). NULL until execution starts.
      project_group_id_id:
        type: INTEGER
        description: Project group (category) of the project. Joins to vpp_masterdata_projectgroups.project_group_id.
      consume_when:
        type: INTEGER
        description: 'When planned cost is consumed (cost module): 1 = when a task starts, 2 = when it
          finishes, 3 = in line with actual completion.'
      cost_manager_id:
        type: INTEGER
        description: Cost Manager of the project (cost module only). Joins to vpp_users.id.
      project_last_rebaselined_on:
        type: BIGINT
        description: When the project was last rebaselined (epoch seconds). NULL if never.
      factored_project_etc:
        type: BIGINT
        description: ETC recalculated using resource-load (FOL) factored durations (epoch seconds).
      current_quarter_progress:
        type: VARCHAR
        description: Free-text progress note for the current quarter.
      next_quarter_target:
        type: VARCHAR
        description: Free-text target for the next quarter.
      issue_count:
        type: BIGINT
        description: Number of OPEN issues (status 1 Open or 2 Resolved) on the project and its tasks,
          pre-aggregated. Prefer it over counting vpp_issue_issues.
      project_attachment_count:
        type: BIGINT
        description: Number of files attached to the project, pre-aggregated.
      first_rfs_date:
        type: BIGINT
        description: Date the project first became ready_to_schedule (RFS = Ready For Scheduling), epoch
          seconds.
      original_etc:
        type: BIGINT
        description: ETC captured when the project was first scheduled (epoch seconds).
      project_planned_due_date:
        type: BIGINT
        description: Due date set when the plan was last scheduled (epoch seconds); project_due_date may
          change later.
  vpp_planning_projectcoordinatormapping:
    description: Optional Project Coordinators of a project, one row per coordinator.
    primary_key: projectcoordinatormapping_id
    columns:
      projectcoordinatormapping_id:
        type: INTEGER
        description: Unique identifier of the mapping row.
      coordinator_id_id:
        type: INTEGER
        description: The coordinator user. Joins to vpp_users.id.
      project_id_id:
        type: INTEGER
        description: The project. Joins to vpp_planning_projects.project_id.
  vpp_planning_projectactions:
    description: 'Project actions: follow-up action items raised on a project, each with an owner and
      a planned completion date. Filter action_is_deleted = false.'
    primary_key: action_id
    columns:
      action_id:
        type: BIGINT
        description: Unique identifier of the action.
      action_description:
        type: VARCHAR
        description: What has to be done.
      action_status:
        type: VARCHAR
        description: 'Status text. Compare case-insensitively: LOWER(action_status) = ''closed'' means
          closed; anything else is open.'
      action_planned_completion_date:
        type: BIGINT
        description: Date the action is planned to be completed (epoch seconds).
      action_published_date:
        type: BIGINT
        description: Date the action was published (epoch seconds).
      action_latest_remark:
        type: VARCHAR
        description: Most recent remark on the action.
      action_is_deleted:
        type: BOOLEAN
        description: Soft-delete flag. Exclude rows where this is true.
      project_action_created_on:
        type: BIGINT
        description: When the action was created (epoch seconds).
      project_action_modified_on:
        type: BIGINT
        description: When the action was last modified (epoch seconds).
      action_owner_id:
        type: INTEGER
        description: User responsible for the action. Joins to vpp_users.id.
      project_action_created_by_id:
        type: INTEGER
        description: User who created the action. Joins to vpp_users.id.
      project_action_modified_by_id:
        type: INTEGER
        description: User who last modified the action. Joins to vpp_users.id.
      project_id_id:
        type: INTEGER
        description: Project the action belongs to. Joins to vpp_planning_projects.project_id.
      action_elapsed_days:
        type: INTEGER
        description: Working days elapsed since the action was published.
      project_action_custom_attribute:
        type: JSON
        description: Client-configured custom attributes as JSON.
      action_request_closure_date:
        type: BIGINT
        description: Date closure of the action was requested (epoch seconds).
  vpp_planning_tasks:
    description: 'Tasks of a project plan (DHTMLX Gantt nodes). A project has many tasks connected by
      links (vpp_planning_links) and nested up to 5 levels through parent_task_id_id. The lowest-level
      task with a workflow is a LEAF task and is the only kind that has subtasks. Status via task_status_id:
      1 NS (Not Started), 2 RTS (Ready To Start), 3 Started, 4 Completed. Three identifiers exist: task_uid
      (primary key, use for joins), gantt_id (UUID unique across all projects, used by links and hierarchy)
      and task_id (WBS id, unique only within a project). Task names can repeat inside a project. Filter
      task_is_deleted = false. Dates are Unix epoch SECONDS.'
    primary_key: task_uid
    columns:
      task_uid:
        type: INTEGER
        description: Primary key of the task. Use this for joins and when a question gives a task number.
      task_name:
        type: VARCHAR
        description: Name of the task. Not unique within a project.
      task_duration:
        type: DOUBLE
        description: Planned duration in working days. Milestones have 0.
      task_rem_duration:
        type: DOUBLE
        description: Remaining duration in working days.
      task_custom_attribute:
        type: JSON
        description: Client-configured custom attributes of the task as JSON.
      task_is_deleted:
        type: BOOLEAN
        description: Soft-delete flag. Exclude rows where this is true.
      subtask_custom_attribute_group_id:
        type: INTEGER
        description: Custom-attribute group that defines extra fields of this task's subtasks.
      task_manager_id:
        type: INTEGER
        description: Optional Task Manager. Joins to vpp_users.id. Participants are in vpp_planning_taskparticipants.
      workflow_id:
        type: INTEGER
        description: Workflow attached to the task; set only on LEAF tasks. Joins to vpp_masterdata_workflows.workflow_id.
          "workflow_id IS NOT NULL" identifies leaf tasks.
      parent_task_id_id:
        type: INTEGER
        description: Direct parent task. Joins to vpp_planning_tasks.task_uid. NULL for top-level tasks.
      project_id_id:
        type: INTEGER
        description: Project the task belongs to. Joins to vpp_planning_projects.project_id.
      task_id:
        type: VARCHAR
        description: WBS id generated by the Gantt (e.g. '1.2.3'), as text. Unique only within one project,
          so always pair it with project_id_id.
      department_id_id:
        type: INTEGER
        description: Department responsible for the task. Joins to vpp_masterdata_departments.department_id.
      task_actual_finish_date:
        type: BIGINT
        description: Date the task was closed (epoch seconds). NULL while open; removed again if the task
          is reopened.
      task_actual_start_date:
        type: BIGINT
        description: Date the task actually started (epoch seconds). NULL if not started.
      task_baseline_alap_finish_date:
        type: BIGINT
        description: Baseline finish under ALAP (epoch seconds).
      task_baseline_alap_start_date:
        type: BIGINT
        description: Baseline start under ALAP (epoch seconds).
      task_baseline_asap_finish_date:
        type: BIGINT
        description: Baseline finish under ASAP (epoch seconds).
      task_baseline_asap_start_date:
        type: BIGINT
        description: Baseline start under ASAP (epoch seconds).
      task_baseline_finish_date:
        type: BIGINT
        description: Baseline (planned) finish date (epoch seconds). Changes only on rebaseline.
      task_baseline_start_date:
        type: BIGINT
        description: Baseline (planned) start date (epoch seconds). Changes only on rebaseline.
      task_completion:
        type: DOUBLE
        description: Actual completion of the task in percent (0-100).
      task_expected_alap_finish_date:
        type: BIGINT
        description: Expected finish under ALAP scheduling (epoch seconds).
      task_expected_alap_start_date:
        type: BIGINT
        description: Expected start under ALAP scheduling (epoch seconds).
      task_expected_asap_finish_date:
        type: BIGINT
        description: Expected finish under ASAP scheduling (epoch seconds).
      task_expected_asap_start_date:
        type: BIGINT
        description: Expected start under ASAP scheduling (epoch seconds).
      task_expected_finish_date:
        type: BIGINT
        description: Expected (forecast) finish date, recalculated daily from remaining duration (epoch
          seconds).
      task_expected_start_date:
        type: BIGINT
        description: Expected (forecast) start date, recalculated daily (epoch seconds).
      task_isdelayed:
        type: BOOLEAN
        description: True when the task is currently delayed.
      task_latest_remark:
        type: VARCHAR
        description: Most recent remark on the task.
      task_status_id:
        type: INTEGER
        description: 'Status: 1 NS (Not Started), 2 RTS (Ready To Start), 3 Started, 4 Completed. Joins
          to vpp_planning_taskstatus for the display name. "Open" tasks are task_status_id IN (1, 2, 3).'
      gantt_id:
        type: UUID
        description: Gantt UUID of the task, unique across projects. vpp_planning_links and vpp_planning_taskshierarchy
          refer to tasks by this value.
      gantt_parent_task_id:
        type: UUID
        description: Gantt UUID of the parent task; NULL for top-level tasks.
      floating_time_gap:
        type: DOUBLE
        description: Slack (float) of the task in days. 0 means the task is on the critical chain; small
          positive values within the project's near_cc share are near-critical.
      last_modified_on:
        type: BIGINT
        description: Last progress on the task or any of its subtasks (epoch seconds). Basis of stagnancy.
      gant_task_type:
        type: VARCHAR
        description: 'Gantt node type: ''project'' (summary/parent), ''task'', ''milestone'' or ''buffer''.'
      task_etc:
        type: BIGINT
        description: Expected Time of Completion of the task (epoch seconds).
      task_is_critical:
        type: BOOLEAN
        description: True when the task is on the critical chain.
      task_is_milestone:
        type: BOOLEAN
        description: True for a milestone (0-day task that follows its direct predecessors).
      task_roll_up_type:
        type: INTEGER
        description: 'How a leaf task''s subtasks run: 1 = series (one after another), 2 = parallel.'
      planned_task_completion:
        type: DOUBLE
        description: Completion the task should have reached by today according to the plan (percent).
      task_rts_start_date:
        type: BIGINT
        description: Date the task became Ready To Start (epoch seconds).
      task_completed_duration:
        type: DOUBLE
        description: Completed duration in working days.
      task_completed_weightage:
        type: DOUBLE
        description: Completed subtask weightage of the task.
      task_total_weightage:
        type: DOUBLE
        description: Total weightage of all subtasks of the task.
      milestone_actual_etc:
        type: BIGINT
        description: Actual/forecast ETC of a milestone (epoch seconds).
      milestone_baseline_etc:
        type: BIGINT
        description: Baseline ETC of a milestone; from the plan or entered manually (epoch seconds).
      critical_phase_summary:
        type: VARCHAR
        description: Text summary of the critical workflow phases of the task.
      last_x_days_completion:
        type: DOUBLE
        description: Completion achieved in the last configured X days (percent).
      is_flowobstacle_task:
        type: BOOLEAN
        description: True when the task is flagged as a flow obstacle (blocking flow in the resource queue).
      predecessor_status:
        type: VARCHAR
        description: 'Aggregate state of the task''s predecessors: started, finished, not_Started or none.'
      successor_status:
        type: VARCHAR
        description: 'Aggregate state of the task''s successors: started, finished, not_Started or none.'
      task_group_id_id:
        type: INTEGER
        description: Task group of the task. Joins to vpp_masterdata_taskgroups.task_group_id.
      task_delay_indicator:
        type: JSON
        description: Delay detail as JSON with keys task_is_delayed, delay_on_task_progress, roll_up_delay_on_subtask_progress,
          delay_perc_on_task_progress, roll_up_delay_perc_on_subtask_progress. Use task_isdelayed for
          a simple yes/no.
      task_elapsed:
        type: JSON
        description: Elapsed-days details of the task as JSON.
      task_elapsed_days:
        type: INTEGER
        description: Working days elapsed since the task actually started; stops when the task closes.
          If greater than task_completed_duration the task is delayed.
      task_max_weightage:
        type: DOUBLE
        description: Maximum subtask weightage of the task.
      task_stagnancy:
        type: INTEGER
        description: Working days since last_modified_on, i.e. days without progress. Stops when the task
          closes.
      factored_actual_etc:
        type: BIGINT
        description: ETC using the load-factored remaining duration (epoch seconds).
      factored_rem_duration:
        type: DOUBLE
        description: Remaining duration adjusted for resource load (FOL), in working days.
      task_fullkit_readiness_date:
        type: BIGINT
        description: Date the task's full kit (all inputs) was ready (epoch seconds).
      task_sequence:
        type: BIGINT
        description: Display order of the task within the plan.
      is_heatmap_queue_task:
        type: BOOLEAN
        description: True when the task is counted in the resource-congestion queue (heatmap).
      is_short_term_task:
        type: BOOLEAN
        description: True when the task is in the current short-term plan.
      short_term_target:
        type: DOUBLE
        description: Short-term completion target of the task (percent).
      task_created_by_id:
        type: INTEGER
        description: User who created the task. Joins to vpp_users.id.
      task_created_on:
        type: BIGINT
        description: When the task was created (epoch seconds).
      task_modified_by_id:
        type: INTEGER
        description: User who last modified the task. Joins to vpp_users.id.
      task_modified_on:
        type: BIGINT
        description: When the task record was last modified (epoch seconds).
      issue_count:
        type: JSON
        description: Issue counts as JSON. Use (issue_count->>'total_task_issue_count')::int for the number
          of open issues on the task and its subtasks.
      task_attachment_count:
        type: BIGINT
        description: Number of files attached to the task, pre-aggregated.
      task_horizon:
        type: BIGINT
        description: Internal planning-horizon value; not meaningful for business questions.
  vpp_planning_taskstatus:
    description: 'Lookup of task statuses: 1 NS (Not Started), 2 RTS (Ready To Start), 3 Started, 4 Completed.'
    primary_key: task_status_id
    columns:
      task_status_id:
        type: INTEGER
        description: Status code stored in vpp_planning_tasks.task_status_id.
      color:
        type: VARCHAR
        description: Display colour of the status.
      short_name:
        type: VARCHAR
        description: Short label, e.g. NS, RTS.
      task_status:
        type: VARCHAR
        description: Status name.
      display_text:
        type: VARCHAR
        description: Label shown in the UI.
  vpp_planning_taskshierarchy:
    description: 'Closure table of the task tree: one row per (task, ancestor) pair. depth 0 is the task
      itself, 1 its direct parent, 2 the grandparent, up to 5. Use it to find all descendants or ancestors
      of a task without recursion.'
    primary_key: id
    columns:
      id:
        type: BIGINT
        description: Unique identifier of the row.
      gantt_id:
        type: UUID
        description: Gantt UUID of the task. Joins to vpp_planning_tasks.gantt_id.
      gantt_task_uid:
        type: INTEGER
        description: task_uid of the same task. Joins to vpp_planning_tasks.task_uid.
      gantt_parent_task_id:
        type: UUID
        description: Gantt UUID of the ancestor at this depth. Joins to vpp_planning_tasks.gantt_id.
      depth:
        type: INTEGER
        description: 0 = self, 1 = direct parent, 2 = grandparent, ... up to 5.
      project_id:
        type: INTEGER
        description: The project. Joins to vpp_planning_projects.project_id.
  vpp_planning_links:
    description: Dependencies between tasks of a project. Source and target are tasks identified by their
      Gantt UUID (vpp_planning_tasks.gantt_id), not by task_uid.
    primary_key: link_id
    columns:
      link_id:
        type: INTEGER
        description: Unique identifier of the link.
      gantt_source_id:
        type: UUID
        description: Predecessor task. Joins to vpp_planning_tasks.gantt_id.
      gantt_target_id:
        type: UUID
        description: Successor task. Joins to vpp_planning_tasks.gantt_id.
      link_type:
        type: VARCHAR
        description: 'Dependency type as text: ''0'' Finish-to-Start, ''1'' Start-to-Start, ''2'' Finish-to-Finish.'
      lag:
        type: INTEGER
        description: Lag in working days defined by the planner; negative means lead.
      project_id:
        type: INTEGER
        description: The project. Joins to vpp_planning_projects.project_id.
      new_lag:
        type: INTEGER
        description: Lag after it collapsed during execution.
      introduced_lag:
        type: INTEGER
        description: Lag introduced by the FOL (resource-load) calculation during planning or replanning.
  vpp_planning_taskparticipants:
    description: Optional Task Participants of a task, one row per participant.
    primary_key: id
    columns:
      id:
        type: BIGINT
        description: Unique identifier of the row.
      task_id_id:
        type: INTEGER
        description: The task. Joins to vpp_planning_tasks.task_uid.
      task_participant_id:
        type: INTEGER
        description: The participant user. Joins to vpp_users.id.
  vpp_planning_taskdelaydetail:
    description: Reason recorded for a task's delay, classified by major and minor reason.
    primary_key: id
    columns:
      id:
        type: BIGINT
        description: Unique identifier of the row.
      task_uid:
        type: BIGINT
        description: The delayed task. Joins to vpp_planning_tasks.task_uid (no database foreign key).
      description:
        type: VARCHAR
        description: Free-text explanation of the delay.
      taskdelaydetail_updated_on:
        type: BIGINT
        description: When the reason was recorded (epoch seconds).
      major_reason_id:
        type: INTEGER
        description: Major delay reason. Joins to vpp_masterdata_majorreasons.major_reason_id.
      minor_reason_id:
        type: INTEGER
        description: Minor delay reason. Joins to vpp_masterdata_minorreasons.minor_reason_id.
      taskdelaydetail_updated_by_id:
        type: INTEGER
        description: User who recorded it. Joins to vpp_users.id.
  vpp_planning_rebaselinelog:
    description: History of task baselines before each rebaseline. One row per task per version, so earlier
      baseline dates can be compared with the current ones.
    primary_key: id
    columns:
      id:
        type: BIGINT
        description: Unique identifier of the row.
      name:
        type: VARCHAR
        description: Task name at the time of the rebaseline.
      version:
        type: INTEGER
        description: Baseline version number; higher is more recent.
      task_baseline_alap_start_date:
        type: BIGINT
        description: ALAP baseline start in that version (epoch seconds).
      task_baseline_alap_finish_date:
        type: BIGINT
        description: ALAP baseline finish in that version (epoch seconds).
      task_baseline_asap_start_date:
        type: BIGINT
        description: ASAP baseline start in that version (epoch seconds).
      task_baseline_asap_finish_date:
        type: BIGINT
        description: ASAP baseline finish in that version (epoch seconds).
      task_baseline_start_date:
        type: BIGINT
        description: Baseline start in that version (epoch seconds).
      task_baseline_finish_date:
        type: BIGINT
        description: Baseline finish in that version (epoch seconds).
      task_duration:
        type: DOUBLE
        description: Planned duration in that version, working days.
      created_on:
        type: BIGINT
        description: When this version was logged (epoch seconds).
      project_id:
        type: INTEGER
        description: The project. Joins to vpp_planning_projects.project_id.
      task_id:
        type: INTEGER
        description: The task. Joins to vpp_planning_tasks.task_uid.
      type:
        type: VARCHAR
        description: 'TODO: describe this column.'
  vpp_planning_subtasks:
    description: 'Subtasks: units of work under a LEAF task, progressed through the phases of the task''s
      workflow. Status via subtask_status_id (1 NS, 2 Active, 6 Completed; other codes are waiting / review
      / hold states - join vpp_planning_subtaskstatus for names). Filter subtask_is_deleted = false. Dates
      are Unix epoch SECONDS.'
    primary_key: subtask_id
    columns:
      subtask_id:
        type: INTEGER
        description: Unique identifier of the subtask.
      subtask_name:
        type: VARCHAR
        description: Name of the subtask.
      subtask_custom_attribute:
        type: JSON
        description: Client-configured custom attributes of the subtask as JSON.
      subtask_is_deleted:
        type: BOOLEAN
        description: Soft-delete flag. Exclude rows where this is true.
      subtask_manager_id:
        type: INTEGER
        description: Optional Subtask Manager. Joins to vpp_users.id.
      last_modified_on:
        type: BIGINT
        description: Last progress update on the subtask (epoch seconds). Basis of stagnancy.
      subtask_actual_finish_date:
        type: BIGINT
        description: Date the subtask was closed (epoch seconds). NULL while open.
      subtask_actual_start_date:
        type: BIGINT
        description: Date the subtask actually started (epoch seconds).
      subtask_isdelayed:
        type: BOOLEAN
        description: True when the subtask is delayed (elapsed days exceed completed duration).
      subtask_phase_json:
        type: JSON
        description: Progress per workflow phase as JSON, keyed by phase.
      subtask_status_id:
        type: INTEGER
        description: 'Status code: 1 NS, 2 Active, 6 Completed; other codes are W/R/H (waiting, review,
          hold). Join vpp_planning_subtaskstatus for names. Open subtasks are subtask_status_id <> 6.'
      gantt_id:
        type: UUID
        description: Gantt UUID of the same leaf task. Joins to vpp_planning_tasks.gantt_id.
      task_id:
        type: INTEGER
        description: Leaf task the subtask belongs to. Joins to vpp_planning_tasks.task_uid.
      subtask_priority:
        type: INTEGER
        description: Priority of the subtask within its task; lower is higher priority.
      subtask_rem_weightage:
        type: DECIMAL
        description: Remaining weightage.
      subtask_total_weightage:
        type: DECIMAL
        description: Total weightage (effort) of the subtask.
      completed_phase_count:
        type: DOUBLE
        description: Number of phases completed.
      phase_unit:
        type: VARCHAR
        description: Unit of measure of the phase progress.
      total_phase_count:
        type: DOUBLE
        description: Number of phases in the subtask's workflow.
      stage_under_progress:
        type: VARCHAR
        description: Name of the phase currently in progress.
      subtask_actual_completion_weightage:
        type: DECIMAL
        description: Weightage actually completed.
      subtask_planned_completion_weightage:
        type: DECIMAL
        description: Weightage that should be complete by today according to plan.
      last_x_days_completion:
        type: DOUBLE
        description: Completion achieved in the last configured X days (percent).
      subtask_latest_remark:
        type: VARCHAR
        description: Most recent remark on the subtask.
      subtask_relationship:
        type: VARCHAR
        description: Relationship marker set on import, e.g. 'D' / 'Duplicate', 'E'.
      subtask_computed_duration:
        type: DECIMAL
        description: Duration of the subtask scaled from the task's maximum weightage.
      subtask_delay_indicator:
        type: JSON
        description: Delay detail as JSON with keys subtask_is_delayed, delay_on_subtask_progress, delay_perc_on_subtask_progress.
      subtask_elapsed_days:
        type: INTEGER
        description: Working days elapsed since the subtask started; stops when it closes.
      subtask_stagnancy:
        type: INTEGER
        description: Working days since last_modified_on (days without progress).
      subtask_created_by_id:
        type: INTEGER
        description: User who created the subtask. Joins to vpp_users.id.
      subtask_created_on:
        type: BIGINT
        description: When the subtask was created (epoch seconds).
      subtask_modified_by_id:
        type: INTEGER
        description: User who last modified the subtask. Joins to vpp_users.id.
      subtask_modified_on:
        type: BIGINT
        description: When the subtask record was last modified (epoch seconds).
      issue_count:
        type: BIGINT
        description: Number of open issues on the subtask, pre-aggregated.
      subtask_attachment_count:
        type: BIGINT
        description: Number of files attached to the subtask, pre-aggregated.
  vpp_planning_subtaskstatus:
    description: Lookup of subtask statuses (NS, Active, W, R, H, Completed). Completed is id 6.
    primary_key: subtask_status_id
    columns:
      subtask_status_id:
        type: INTEGER
        description: Status code stored in vpp_planning_subtasks.subtask_status_id.
      color:
        type: VARCHAR
        description: Display colour of the status.
      subtask_status:
        type: VARCHAR
        description: Status name.
      short_name:
        type: VARCHAR
        description: Short label.
  vpp_planning_subtaskparticipants:
    description: Optional Subtask Participants of a subtask, one row per participant.
    primary_key: id
    columns:
      id:
        type: BIGINT
        description: Unique identifier of the row.
      subtask_id_id:
        type: INTEGER
        description: The subtask. Joins to vpp_planning_subtasks.subtask_id.
      subtask_participants_id:
        type: INTEGER
        description: The participant user. Joins to vpp_users.id.
  vpp_planning_remark:
    description: Remarks (comments) on a project, task or subtask. host_type says which; host_id is that
      entity's id.
    primary_key: remark_id
    columns:
      remark_id:
        type: INTEGER
        description: Unique identifier of the remark.
      host_id:
        type: INTEGER
        description: 'Id of the entity commented on: project_id when host_type = ''project'', task_uid
          when ''task'', subtask_id when ''subtask''.'
      host_type:
        type: VARCHAR
        description: 'Kind of entity commented on: ''project'', ''task'' or ''subtask''.'
      host_status:
        type: VARCHAR
        description: Status of the host entity when the remark was written.
      remark:
        type: VARCHAR
        description: Remark text.
      remark_created_by_id:
        type: INTEGER
        description: Author. Joins to vpp_users.id.
      remark_created_on:
        type: BIGINT
        description: When the remark was written (epoch seconds).
  vpp_planning_projectattachmentsmappings:
    description: Files attached to a project.
    primary_key: id
    columns:
      id:
        type: BIGINT
        description: Unique identifier of the attachment row.
      url:
        type: VARCHAR
        description: Link attachment (when a URL is attached instead of a file).
      added_on:
        type: BIGINT
        description: When it was attached (epoch seconds).
      added_by_id:
        type: INTEGER
        description: User who attached it. Joins to vpp_users.id.
      file_id:
        type: INTEGER
        description: The stored file. Joins to vpp_utility_fileupload.file_id.
      project_id:
        type: INTEGER
        description: The project. Joins to vpp_planning_projects.project_id.
  vpp_planning_taskattachmentsmappings:
    description: Files attached to a task.
    primary_key: id
    columns:
      id:
        type: BIGINT
        description: Unique identifier of the attachment row.
      url:
        type: VARCHAR
        description: Link attachment (when a URL is attached instead of a file).
      added_on:
        type: BIGINT
        description: When it was attached (epoch seconds).
      added_by_id:
        type: INTEGER
        description: User who attached it. Joins to vpp_users.id.
      file_id:
        type: INTEGER
        description: The stored file. Joins to vpp_utility_fileupload.file_id.
      task_id:
        type: INTEGER
        description: The task. Joins to vpp_planning_tasks.task_uid.
  vpp_planning_subtaskattachmentsmappings:
    description: Files attached to a subtask.
    primary_key: id
    columns:
      id:
        type: BIGINT
        description: Unique identifier of the attachment row.
      url:
        type: VARCHAR
        description: Link attachment (when a URL is attached instead of a file).
      added_on:
        type: BIGINT
        description: When it was attached (epoch seconds).
      added_by_id:
        type: INTEGER
        description: User who attached it. Joins to vpp_users.id.
      file_id:
        type: INTEGER
        description: The stored file. Joins to vpp_utility_fileupload.file_id.
      subtask_id:
        type: INTEGER
        description: The subtask. Joins to vpp_planning_subtasks.subtask_id.
  vpp_utility_fileupload:
    description: Uploaded file records referenced by the attachment tables. Filter file_isdeleted = false.
    primary_key: file_id
    columns:
      file_id:
        type: INTEGER
        description: Unique identifier of the file.
      file_name:
        type: VARCHAR
        description: Original file name including its extension.
      file_size:
        type: VARCHAR
        description: File size as text.
      file_isdeleted:
        type: BOOLEAN
        description: Soft-delete flag. Exclude rows where this is true.
      file_uploaded:
        type: TIMESTAMP
        description: When the file was uploaded (a real TIMESTAMP, unlike most VectorPro dates).
      file_uploaded_by_id:
        type: INTEGER
        description: User who uploaded it. Joins to vpp_users.id.
  vpp_issue_issues:
    description: 'Issues (impediments) raised against a project, task or subtask, or as a common issue
      with no host. The host is in vpp_issue_issuehostmappings. issue_status: 1 Open, 2 Resolved, 3 Review
      and Closed. "Open issues" in VectorPro means status 1 or 2 (not yet closed). An open issue blocks
      closing its task or subtask. Filter issue_is_deleted = false.'
    primary_key: issue_id
    columns:
      issue_id:
        type: INTEGER
        description: Unique identifier of the issue.
      issue_description:
        type: VARCHAR
        description: Description of the issue.
      issue_status:
        type: INTEGER
        description: 1 = Open, 2 = Resolved (awaiting review), 3 = Review and Closed.
      issue_is_deleted:
        type: BOOLEAN
        description: Soft-delete flag. Exclude rows where this is true.
      issue_owner_id:
        type: INTEGER
        description: User currently responsible for resolving the issue. Joins to vpp_users.id.
      major_reason_id:
        type: INTEGER
        description: Major reason / category. Joins to vpp_masterdata_majorreasons.major_reason_id.
      minor_reason_id:
        type: INTEGER
        description: Minor reason / sub-category. Joins to vpp_masterdata_minorreasons.minor_reason_id.
      issue_modified_on:
        type: BIGINT
        description: When the issue was last modified (epoch seconds).
      issue_raised_by_id:
        type: INTEGER
        description: User who raised the issue. Joins to vpp_users.id.
      issue_raised_on:
        type: BIGINT
        description: When the issue was raised (epoch seconds).
      issue_closed_by_id:
        type: INTEGER
        description: User who closed the issue. Joins to vpp_users.id. NULL while not closed.
      issue_closed_on:
        type: BIGINT
        description: When the issue was closed (epoch seconds). NULL while not closed.
      issue_modified_by_id:
        type: INTEGER
        description: User who last modified the issue. Joins to vpp_users.id.
      issue_escalated_level:
        type: INTEGER
        description: Current escalation level; 0 means not escalated.
      issue_escalated_users:
        type: VARCHAR
        description: Users the issue has been escalated to, as text.
      issue_elapsed_days:
        type: INTEGER
        description: Working days the issue has been open.
      current_issue_owner_modified_on:
        type: BIGINT
        description: When the issue owner last changed (epoch seconds).
  vpp_issue_issuehostmappings:
    description: Which project, task or subtask an issue is raised on. Common issues have issue_type 'common'.
    primary_key: id
    columns:
      id:
        type: BIGINT
        description: Unique identifier of the row.
      host_id:
        type: INTEGER
        description: 'Id of the host: task_uid when issue_type = ''task'', subtask_id when ''subtask'',
          project_id for project issues.'
      issue_type:
        type: VARCHAR
        description: 'Host kind: ''task'' (Task Issue), ''subtask'' (Subtask Issue), ''common'' (Common
          Issue), or project-level.'
      issue_id:
        type: INTEGER
        description: The issue. Joins to vpp_issue_issues.issue_id.
  vpp_issue_issueremarksmappings:
    description: Remarks (comments) added to an issue.
    primary_key: id
    columns:
      id:
        type: BIGINT
        description: Unique identifier of the row.
      remark:
        type: VARCHAR
        description: Remark text.
      issue_id:
        type: INTEGER
        description: The issue. Joins to vpp_issue_issues.issue_id.
      added_by_id:
        type: INTEGER
        description: Author. Joins to vpp_users.id.
      added_on:
        type: BIGINT
        description: When it was added (epoch seconds).
  vpp_issue_issueresolutionmappings:
    description: Resolutions proposed for an issue, and rejections of proposed resolutions.
    primary_key: id
    columns:
      id:
        type: BIGINT
        description: Unique identifier of the row.
      resolution:
        type: VARCHAR
        description: Resolution text.
      issue_id:
        type: INTEGER
        description: The issue. Joins to vpp_issue_issues.issue_id.
      added_by_id:
        type: INTEGER
        description: Author. Joins to vpp_users.id.
      added_on:
        type: BIGINT
        description: When it was added (epoch seconds).
      resolution_type:
        type: VARCHAR
        description: '''resolution'' (a proposed resolution) or ''resolution_rejection'' (the resolution
          was rejected).'
  vpp_masterdata_heatmapteams:
    description: Resource teams used for resource-congestion analysis (the heatmap / resource queue).
      Each team has a flow rate (capacity) and colour thresholds for its load.
    primary_key: team_id
    columns:
      team_id:
        type: INTEGER
        description: Unique identifier of the heatmap team.
      team_name:
        type: VARCHAR
        description: Name of the team.
      team_type:
        type: VARCHAR
        description: Kind of team (how its members are resolved).
      current_flow_rate:
        type: DOUBLE
        description: Current flow rate (work the team completes per day) used in the calculation.
      manual_flow_rate:
        type: DOUBLE
        description: Flow rate entered manually; overrides the historical one when set.
      historical_flow_rate:
        type: DOUBLE
        description: Flow rate measured from history.
      threshold_green_end:
        type: DOUBLE
        description: Load (queue days) up to which the team is green.
      threshold_yellow_end:
        type: DOUBLE
        description: Load up to which the team is yellow; above it the team is red.
      heatmap_enabled:
        type: BOOLEAN
        description: True when the team appears on the heatmap.
      applicable_for_etc:
        type: BOOLEAN
        description: True when this team's load affects ETC calculation.
      heatmap_created_on:
        type: BIGINT
        description: When the team record was created (epoch seconds).
      heatmap_created_by:
        type: VARCHAR
        description: Who created it (text).
      heatmap_modified_on:
        type: BIGINT
        description: When it was last modified (epoch seconds).
      heatmap_modified_by:
        type: VARCHAR
        description: Who last modified it (text).
      team_json:
        type: JSON
        description: Team configuration as JSON.
      is_default_config:
        type: BOOLEAN
        description: True for the default team configuration.
      severity_seqnence_index:
        type: INTEGER
        description: Display order by severity.
      source_id:
        type: INTEGER
        description: Id of the source entity the team is built from (e.g. department or resource group).
      team_load:
        type: DOUBLE
        description: Current queue load of the team in days.
      user_sequence_index:
        type: INTEGER
        description: Display order chosen by users.
      enable_heatmap_calculation:
        type: BOOLEAN
        description: True when the nightly heatmap calculation runs for this team.
      team_load_30_days:
        type: DOUBLE
        description: Load arising within the next 30 days.
      team_load_60_days:
        type: DOUBLE
        description: Load arising within the next 60 days.
      team_load_90_days:
        type: DOUBLE
        description: Load arising within the next 90 days.
      team_load_all:
        type: DOUBLE
        description: Total load across all horizons.
      team_load_json:
        type: JSON
        description: Load breakdown as JSON.
  vpp_planning_projectwisequeuedetails:
    description: Per project and team, how much queued work the project puts on a heatmap team (resource
      congestion). cum_* columns are cumulative across projects in priority order.
    primary_key: queue_details_id
    columns:
      queue_details_id:
        type: BIGINT
        description: Unique identifier of the row.
      project_id:
        type: INTEGER
        description: The project. Joins to vpp_planning_projects.project_id (no database foreign key).
      cum_queue_duration:
        type: DOUBLE
        description: Cumulative queue duration in days up to and including this project.
      cum_queue_total_subtasks:
        type: INTEGER
        description: Cumulative number of queued subtasks.
      queue_duration:
        type: DOUBLE
        description: Queue duration in days contributed by this project.
      queue_total_subtasks:
        type: INTEGER
        description: Number of queued subtasks of this project.
      heat_color:
        type: VARCHAR
        description: Congestion colour for this project on this team (green / yellow / red).
      active_subtask_count:
        type: INTEGER
        description: Active subtasks of this project for the team.
      cum_active_subtask_count:
        type: INTEGER
        description: Cumulative active subtasks.
      future_subtask_duration:
        type: DOUBLE
        description: Duration of future (not yet started) subtasks, days.
      cum_future_subtask_duration:
        type: DOUBLE
        description: Cumulative future subtask duration, days.
      future_queue_time:
        type: DOUBLE
        description: Future queue time in days.
      cum_future_queue_time:
        type: DOUBLE
        description: Cumulative future queue time in days.
      scope_in_project:
        type: INTEGER
        description: Number of subtasks of the project in scope for the team.
      closure_rate:
        type: DOUBLE
        description: Rate at which the team closes this project's work.
      entry_date:
        type: BIGINT
        description: Date the snapshot was calculated (epoch seconds).
      team_id_id:
        type: INTEGER
        description: The heatmap team. Joins to vpp_masterdata_heatmapteams.team_id.
      all_fol_duration:
        type: DOUBLE
        description: FOL duration of this project.
      cum_all_fol:
        type: DOUBLE
        description: Cumulative full FOL (flow-of-load) duration.
  vpp_masterdata_portfolios:
    description: Portfolios that group projects. Each portfolio has one Portfolio Manager. Filter portfolio_is_deleted
      = false.
    primary_key: portfolio_id
    columns:
      portfolio_id:
        type: INTEGER
        description: Unique identifier of the portfolio.
      portfolio_name:
        type: VARCHAR
        description: Name of the portfolio.
      portfolio_description:
        type: VARCHAR
        description: Description.
      portfolio_is_deleted:
        type: BOOLEAN
        description: Soft-delete flag. Exclude rows where this is true.
      portfolio_created_by:
        type: VARCHAR
        description: Who created it (text).
      portfolio_created_on:
        type: BIGINT
        description: When created (epoch seconds).
      portfolio_modified_by:
        type: VARCHAR
        description: Who last modified it (text).
      portfolio_modified_on:
        type: BIGINT
        description: When last modified (epoch seconds).
  vpp_masterdata_departments:
    description: Departments that own tasks and contain users. Filter department_is_deleted = false.
    primary_key: department_id
    columns:
      department_id:
        type: INTEGER
        description: Unique identifier of the department.
      department_name:
        type: VARCHAR
        description: Name of the department.
      department_description:
        type: VARCHAR
        description: Description.
      department_is_deleted:
        type: BOOLEAN
        description: Soft-delete flag. Exclude rows where this is true.
      department_created_by:
        type: VARCHAR
        description: Who created it (text).
      department_created_on:
        type: BIGINT
        description: When created (epoch seconds).
      department_modified_by:
        type: VARCHAR
        description: Who last modified it (text).
      department_modified_on:
        type: BIGINT
        description: When last modified (epoch seconds).
  vpp_masterdata_workflows:
    description: Workflows attached to leaf tasks. A workflow is an ordered set of phases (vpp_masterdata_phases)
      that every subtask of the task goes through. Filter workflow_is_deleted = false.
    primary_key: workflow_id
    columns:
      workflow_id:
        type: INTEGER
        description: Unique identifier of the workflow.
      workflow_name:
        type: VARCHAR
        description: Name of the workflow.
      workflow_is_critical:
        type: BOOLEAN
        description: True when all phases are critical, which makes the workflow critical.
      workflow_is_applicable_for_etc:
        type: BOOLEAN
        description: True when progress in this workflow drives ETC calculation.
      workflow_is_system_defined:
        type: BOOLEAN
        description: True for workflows shipped with the system.
      workflow_is_deleted:
        type: BOOLEAN
        description: Soft-delete flag. Exclude rows where this is true.
      workflow_created_by:
        type: VARCHAR
        description: Who created it (text).
      workflow_created_on:
        type: BIGINT
        description: When created (epoch seconds).
      workflow_modified_by:
        type: VARCHAR
        description: Who last modified it (text).
      workflow_modified_on:
        type: BIGINT
        description: When last modified (epoch seconds).
      workflow_is_hidden:
        type: BOOLEAN
        description: True when hidden from selection lists.
  vpp_masterdata_phases:
    description: Phases (steps) of a workflow. Filter phase_is_deleted = false.
    primary_key: phase_id
    columns:
      phase_id:
        type: INTEGER
        description: Unique identifier of the phase.
      phase_name:
        type: VARCHAR
        description: Name of the phase.
      phase_type:
        type: VARCHAR
        description: 'How progress is captured: BINARY (done / not done), PERCENTAGE (0-100), QUANTITY
          (any number) or a date.'
      phase_weightage:
        type: INTEGER
        description: Weightage of the phase within the workflow.
      phase_unit:
        type: VARCHAR
        description: Unit of measure for quantitative phases.
      phase_target_value:
        type: INTEGER
        description: Target value for quantitative phases.
      phase_is_critical:
        type: BOOLEAN
        description: True when the phase is critical.
      phase_is_deleted:
        type: BOOLEAN
        description: Soft-delete flag. Exclude rows where this is true.
      workflow_id:
        type: INTEGER
        description: Workflow the phase belongs to. Joins to vpp_masterdata_workflows.workflow_id.
      phase_code:
        type: UUID
        description: Stable UUID of the phase; keys of vpp_planning_subtasks.subtask_phase_json refer
          to phases.
      phase_sequence_index:
        type: INTEGER
        description: Order of the phase within the workflow.
      phase_created_by:
        type: VARCHAR
        description: Who created it (text).
      phase_created_on:
        type: BIGINT
        description: When created (epoch seconds).
      phase_modified_by:
        type: VARCHAR
        description: Who last modified it (text).
      phase_modified_on:
        type: BIGINT
        description: When last modified (epoch seconds).
  vpp_masterdata_holidays:
    description: Holidays and non-working weekdays used for working-day calculations. Filter holiday_is_deleted
      = false.
    primary_key: holiday_id
    columns:
      holiday_id:
        type: INTEGER
        description: Unique identifier of the holiday.
      holiday_description:
        type: VARCHAR
        description: Name of the holiday.
      day_of_week:
        type: INTEGER
        description: Weekday number for a recurring weekly off day.
      holiday_recurring:
        type: VARCHAR
        description: Recurrence setting as text; blank for a one-off holiday date.
      holiday_date:
        type: BIGINT
        description: Date of the holiday (epoch seconds).
      holiday_is_deleted:
        type: BOOLEAN
        description: Soft-delete flag. Exclude rows where this is true.
  vpp_masterdata_projectgroups:
    description: Project groups (categories) used to classify projects.
    primary_key: project_group_id
    columns:
      project_group_id:
        type: INTEGER
        description: Unique identifier of the project group.
      project_group_name:
        type: VARCHAR
        description: Name of the project group.
  vpp_masterdata_taskgroups:
    description: Task groups used to classify tasks.
    primary_key: task_group_id
    columns:
      task_group_id:
        type: INTEGER
        description: Unique identifier of the task group.
      task_group_name:
        type: VARCHAR
        description: Name of the task group.
  vpp_masterdata_majorreasons:
    description: Major reasons, the top-level categories for issues and task delays. Filter major_reason_is_deleted
      = false.
    primary_key: major_reason_id
    columns:
      major_reason_id:
        type: INTEGER
        description: Unique identifier of the major reason.
      major_reason_name:
        type: VARCHAR
        description: Name, e.g. a category such as material or design.
      major_reason_is_deleted:
        type: BOOLEAN
        description: Soft-delete flag. Exclude rows where this is true.
      major_reason_created_by:
        type: VARCHAR
        description: Who created it (text).
      major_reason_created_on:
        type: BIGINT
        description: When created (epoch seconds).
      major_reason_modified_by:
        type: VARCHAR
        description: Who last modified it (text).
      major_reason_modified_on:
        type: BIGINT
        description: When last modified (epoch seconds).
  vpp_masterdata_minorreasons:
    description: Minor reasons, sub-categories of a major reason. Filter minor_reason_is_deleted = false.
    primary_key: minor_reason_id
    columns:
      minor_reason_id:
        type: INTEGER
        description: Unique identifier of the minor reason.
      minor_reason_name:
        type: VARCHAR
        description: Name of the minor reason.
      minor_reason_is_deleted:
        type: BOOLEAN
        description: Soft-delete flag. Exclude rows where this is true.
      major_reason_id:
        type: INTEGER
        description: Parent major reason. Joins to vpp_masterdata_majorreasons.major_reason_id.
      minor_reason_created_by:
        type: VARCHAR
        description: Who created it (text).
      minor_reason_created_on:
        type: BIGINT
        description: When created (epoch seconds).
      minor_reason_modified_by:
        type: VARCHAR
        description: Who last modified it (text).
      minor_reason_modified_on:
        type: BIGINT
        description: When last modified (epoch seconds).
  vpp_masterdata_tags:
    description: Tags (labels) that can be put on projects, tasks and subtasks.
    primary_key: tag_id
    columns:
      tag_id:
        type: INTEGER
        description: Unique identifier of the tag.
      tag_name:
        type: VARCHAR
        description: Name of the tag.
      color:
        type: VARCHAR
        description: Display colour of the tag.
  vpp_masterdata_tagmapping:
    description: Which tag is put on which project, task or subtask.
    primary_key: mapping_id
    columns:
      mapping_id:
        type: INTEGER
        description: Unique identifier of the row.
      entity_type:
        type: VARCHAR
        description: '''project'', ''task'' or ''subtask''.'
      entity_id:
        type: INTEGER
        description: 'Id of the tagged entity: project_id, task_uid or subtask_id according to entity_type.'
      tag_id:
        type: INTEGER
        description: The tag. Joins to vpp_masterdata_tags.tag_id.
  vpp_users:
    description: VectorPro users. Show a person as first_name || ' ' || last_name. Credentials and identity-provider
      fields are not exported.
    primary_key: id
    columns:
      first_name:
        type: VARCHAR
        description: First name.
      last_name:
        type: VARCHAR
        description: Last name.
      is_active:
        type: BOOLEAN
        description: Django flag, true when the account can log in.
      date_joined:
        type: TIMESTAMP
        description: When the account was created (a real TIMESTAMP).
      id:
        type: INTEGER
        description: Unique identifier of the user; every *_by_id, *_manager_id and *_owner_id column
          points here.
      username:
        type: VARCHAR
        description: Login name.
      email:
        type: VARCHAR
        description: E-mail address.
      status:
        type: INTEGER
        description: 1 = active, 2 = inactive, 3 = terminated.
  vpp_groups:
    description: Roles. Names include VP_Admin, VP_MasterScheduler, VP_TopManagement, VP_PortfolioManager,
      VP_ResourceManager, VP_TaskManager, VP_TaskParticipant, VP_SubtaskManager, VP_SubtaskParticipant,
      VP_CostManager, VP_HFM.
    primary_key: group_id
    columns:
      group_id:
        type: INTEGER
        description: Unique identifier of the role.
      group_name:
        type: VARCHAR
        description: Role name, e.g. VP_TaskManager.
  vpp_user_groups:
    description: Roles held by each user; a user can hold several.
    primary_key: user_group_id
    columns:
      user_group_id:
        type: INTEGER
        description: Unique identifier of the row.
      group_id:
        type: INTEGER
        description: The role. Joins to vpp_groups.group_id.
      user_id:
        type: INTEGER
        description: The user. Joins to vpp_users.id.
