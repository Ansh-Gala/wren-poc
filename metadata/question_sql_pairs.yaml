version: 1

pairs:
  - nl: Show me Initiative 123
    source: poc
    sql: |
      SELECT business_object_id, business_object_ref_id, business_unit, business_object_status
      FROM tms_business_object_flat
      WHERE business_object_ref_id = '123'

  - nl: How many open tasks are in BO 123?
    source: poc
    sql: |
      SELECT COUNT(t.task_id) AS open_task_count
      FROM tms_task_flat t
      JOIN tms_business_object_flat b ON t.bo_id = b.business_object_id
      WHERE t.task_status = 'open' AND b.business_object_ref_id = '123'

  - nl: What are my current tasks?
    source: poc
    sql: |
      SELECT task_id, task_display_name, business_object_ref_id
      FROM tms_task_flat
      WHERE assigned_user_id = 1
        AND task_status = 'open'
        AND display_flag = 1

  - nl: Which initiatives are active?
    source: poc
    sql: |
      SELECT business_object_id, business_object_ref_id, business_object_type
      FROM tms_business_object_flat
      WHERE business_object_status = 'Active'

  - nl: What is Amit's full name?
    source: poc
    sql: |
      SELECT user_name
      FROM tms_user_flat
      WHERE user_name ILIKE '%Amit%'

  - nl: Which tasks are delayed?
    source: poc
    sql: |
      SELECT task_id, task_display_name, assigned_user_name
      FROM tms_task_flat
      WHERE task_sla_status = 'Delayed'

  - nl: Which roles belong to the Sales department?
    source: poc
    sql: |
      SELECT role
      FROM tms_role_flat
      WHERE department = 'Sales'
