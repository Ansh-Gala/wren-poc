# Generated by scripts/build_schema_description.py from the live database.
# Column names and types come from information_schema and must not be edited
# by hand. Descriptions ARE preserved across regeneration, so improving one
# here is safe; run --check in CI to catch drift from the database.
data_source: postgres
catalog: ''
schema: public
tables:
  tms_initiative_flat:
    description: Flat TMS Initiative table containing initiative identity, business unit, type, priority/color,
      due dates, buffers, workflow, process status, milestone and task summary information. Also known
      as Business Object, Order, or BO.
    primary_key: initiative_id
    columns:
      initiative_id:
        type: INTEGER
        description: Unique identifier of the Initiative / Business Object / Order / BO.
      initiative_ref_id:
        type: VARCHAR
        description: Human-readable reference identifier of the Initiative.
      business_unit:
        type: VARCHAR
        description: Business unit associated with the Initiative.
        values:
        - PVH
        - unit1
      initiative_type:
        type: VARCHAR
        description: 'Type of the Initiative, e.g. AR_YD_Suiting, AR_NPD_Shirting. This is the canonical
          column for the kind of item a question names: when a user says "AR_YD_Suiting items" or "TESTING_MG
          items", filter on this column. Values are case-sensitive and include near-duplicates that are
          genuinely distinct types (AR_YD_Shirting and AR_YD_SHIRTING). Do not substitute workflow_code
          or workflow_name for it.'
        values:
        - AR_NPD_Shirting
        - AR_NPD_Suiting
        - AR_NPD_YD_SALESPLAN
        - AR_NPD_YD_SHIRTING
        - AR_PD_Shirting
        - AR_PD_Suiting
        - AR_PRINT_Shirting
        - AR_PRINT_Suiting
        - AR_Print_Shirting
        - AR_Printing_Shirting
        - AR_SALESPLAN_Shirting
        - AR_SALESPLAN_Suiting
        - AR_YD_SHIRTING
        - AR_YD_Shirting
        - AR_YD_Suiting
        - TESTING_MG
        - test
      initiative_color:
        type: VARCHAR
        description: Priority/color classification of the Initiative.
        values:
        - Black
        - Green
        - Red
        - White
      initiative_note:
        type: VARCHAR
        description: Business note or remark associated with the Initiative.
      initiative_created_at:
        type: TIMESTAMP
        description: Timestamp when the Initiative was created.
      initiative_updated_at:
        type: TIMESTAMP
        description: Timestamp when the Initiative was last updated.
      initiative_client_due_at:
        type: TIMESTAMP
        description: Client/customer-required due date. Not the system/buffered due date.
      common_buffer:
        type: INTEGER
        description: Common buffer associated with the Initiative.
      buff_penetration_prcnt:
        type: REAL
        description: Percentage of buffer penetration.
      buff_penetration_days:
        type: INTEGER
        description: Buffer penetration expressed in days.
      total_remaining_duration:
        type: INTEGER
        description: Total remaining duration for the Initiative.
      days_to_due_date:
        type: INTEGER
        description: Days remaining until the due date; negative means the due date has passed.
      hold_days:
        type: INTEGER
        description: Number of days the Initiative has been on hold.
      workflow_id:
        type: INTEGER
        description: Identifier of the workflow associated with the Initiative.
      workflow_code:
        type: VARCHAR
        description: 'Code of the workflow attached to the Initiative. NOT a substitute for initiative_type:
          it is NULL for 72 of 307 rows and differs from the type on 75, so filtering on it silently drops
          rows. Use it only when the question is explicitly about the workflow rather than the item type.'
        values:
        - AR_NPD_Shirting
        - AR_NPD_Suiting
        - AR_PD_Shirting
        - AR_PD_Suiting
        - AR_PRINT_Shirting
        - AR_SALESPLAN_Shirting
        - AR_SALESPLAN_Suiting
        - AR_YD_Shirting
        - AR_YD_Suiting
        - TESTING_MG
        - test
      workflow_name:
        type: VARCHAR
        description: Name of the workflow attached to the Initiative. NULL for 72 of 307 rows. Like workflow_code,
          not a substitute for initiative_type.
        values:
        - AR_NPD_Shirting
        - AR_NPD_Suiting
        - AR_PD_Shirting
        - AR_PD_Suiting
        - AR_PRINT_Shirting
        - AR_SALESPLAN_Shirting
        - AR_SALESPLAN_Suiting
        - AR_YD_Shirting
        - AR_YD_Suiting
        - TESTING_MG
        - test
      initiative_status:
        type: VARCHAR
        description: Initiative process status, mapped as Active, Closed, or Short Closed.
        values:
        - Active
        - Closed
        - Short Closed
      initiative_start_date:
        type: TIMESTAMP
        description: Start timestamp of the Initiative process.
      initiative_end_date:
        type: TIMESTAMP
        description: End timestamp of the Initiative process.
      elapsed_days:
        type: DOUBLE
        description: Elapsed duration of the process in days.
      initiative_expected_completion_date:
        type: TIMESTAMP
        description: Expected completion date based on remaining duration.
      short_closed_by:
        type: VARCHAR
        description: User who short-closed the Initiative.
        values:
        - WCMS Admin
      short_closed_on:
        type: TIMESTAMP
        description: Timestamp when the Initiative was short-closed.
      current_active_milestone:
        type: VARCHAR
        description: 'Current active milestone. Empty in this database: NULL in every row, so a filter
          on it returns nothing and an aggregate over it returns NULL. Do not use it to answer a question;
          say the data is not held instead.'
      current_milestone_delay_days:
        type: INTEGER
        description: 'Days the current active milestone is delayed. Empty in this database: NULL in every
          row, so a filter on it returns nothing and an aggregate over it returns NULL. Do not use it
          to answer a question; say the data is not held instead.'
      current_milestone_expected_completion:
        type: VARCHAR
        description: 'Expected completion of the current active milestone. Empty in this database: NULL
          in every row, so a filter on it returns nothing and an aggregate over it returns NULL. Do not
          use it to answer a question; say the data is not held instead.'
      total_task_count:
        type: BIGINT
        description: 'Total number of tasks on this Initiative, pre-aggregated. Prefer it over counting
          rows in tms_task_flat: same answer, one table.'
      open_task_count:
        type: BIGINT
        description: Number of open tasks on this Initiative, pre-aggregated. Prefer it over counting
          tms_task_flat rows with task_status = 'open'.
      closed_task_count:
        type: BIGINT
        description: Number of closed tasks on this Initiative, pre-aggregated. Prefer it over counting
          tms_task_flat rows with task_status = 'closed'.
      delayed_task_count:
        type: BIGINT
        description: 'Number of currently delayed OPEN tasks on this Initiative. It does NOT include closed
          tasks that breached SLA: across the database it sums to 481 while 635 tasks have task_sla_status
          = ''Delayed'', the difference being 154 delayed closed tasks. Use this column for "has delayed
          work outstanding"; join to tms_task_flat on task_sla_status = ''Delayed'' if closed breaches
          should count too.'
      open_tasks_list:
        type: VARCHAR
        description: List of open task names associated with the Initiative.
