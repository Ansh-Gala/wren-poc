# Generated by scripts/build_schema_description.py from the live database.
# Column names and types come from information_schema and must not be edited
# by hand. Descriptions ARE preserved across regeneration, so improving one
# here is safe; run --check in CI to catch drift from the database.
data_source: postgres
catalog: ''
schema: public
tables:
  tms_business_object_flat:
    description: Flat TMS Business Object table containing business-object identity, business unit, type,
      priority/color, due dates, buffers, workflow, process status, milestone and task summary information.
      Also known as Initiative, Order, or BO.
    primary_key: business_object_id
    columns:
      business_object_id:
        type: INTEGER
        description: Unique identifier of the Business Object / Initiative / Order / BO.
      business_object_ref_id:
        type: VARCHAR
        description: Human-readable reference identifier of the Business Object.
      business_unit:
        type: VARCHAR
        description: Business unit associated with the Business Object.
        values:
        - PVH
        - unit1
      business_object_type:
        type: VARCHAR
        description: 'Type of the Business Object, e.g. AR_YD_Suiting, AR_NPD_Shirting. This is the canonical
          column for the kind of item a question names: when a user says "AR_YD_Suiting items" or "TESTING_MG
          items", filter on this column. Values are case-sensitive and include near-duplicates that are
          genuinely distinct types (AR_YD_Shirting and AR_YD_SHIRTING). Do not substitute workflow_code
          or workflow_name for it.'
      business_object_color:
        type: VARCHAR
        description: Priority/color classification of the Business Object.
        values:
        - Black
        - Green
        - Red
        - White
      business_object_note:
        type: VARCHAR
        description: Business note or remark associated with the Business Object.
      business_object_created_at:
        type: TIMESTAMP
        description: Timestamp when the Business Object was created.
      business_object_updated_at:
        type: TIMESTAMP
        description: Timestamp when the Business Object was last updated.
      business_object_client_due_at:
        type: TIMESTAMP
        description: Client/customer-required due date. Not the system/buffered due date.
      common_buffer:
        type: INTEGER
        description: Common buffer associated with the Business Object.
      buff_penetration_prcnt:
        type: REAL
        description: Percentage of buffer penetration.
      buff_penetration_days:
        type: INTEGER
        description: Buffer penetration expressed in days.
      total_remaining_duration:
        type: INTEGER
        description: Total remaining duration for the Business Object.
      days_to_due_date:
        type: INTEGER
        description: Days remaining until the due date; negative means the due date has passed.
      hold_days:
        type: INTEGER
        description: Number of days the Business Object has been on hold.
      workflow_id:
        type: INTEGER
        description: Identifier of the workflow associated with the Business Object.
      workflow_code:
        type: VARCHAR
        description: 'Code of the workflow attached to the Business Object. NOT a substitute for business_object_type:
          it is NULL for 72 of 307 rows and differs from the type on 75, so filtering on it silently drops
          rows. Use it only when the question is explicitly about the workflow rather than the item type.'
        values:
        - AR_NPD_Shirting
        - AR_NPD_Suiting
        - AR_PD_Shirting
        - AR_PD_Suiting
        - AR_PRINT_Shirting
        - AR_SALESPLAN_Shirting
        - AR_SALESPLAN_Suiting
        - AR_YD_Shirting
        - AR_YD_Suiting
        - TESTING_MG
        - test
      workflow_name:
        type: VARCHAR
        description: Name of the workflow attached to the Business Object. NULL for 72 of 307 rows. Like
          workflow_code, not a substitute for business_object_type.
        values:
        - AR_NPD_Shirting
        - AR_NPD_Suiting
        - AR_PD_Shirting
        - AR_PD_Suiting
        - AR_PRINT_Shirting
        - AR_SALESPLAN_Shirting
        - AR_SALESPLAN_Suiting
        - AR_YD_Shirting
        - AR_YD_Suiting
        - TESTING_MG
        - test
      business_object_status:
        type: VARCHAR
        description: Business Object process status, mapped as Active, Closed, or Short Closed.
        values:
        - Active
        - Closed
        - Short Closed
      business_object_start_date:
        type: TIMESTAMP
        description: Start timestamp of the Business Object process.
      business_object_end_date:
        type: TIMESTAMP
        description: End timestamp of the Business Object process.
      elapsed_days:
        type: DOUBLE
        description: Elapsed duration of the process in days.
      business_object_expected_completion_date:
        type: TIMESTAMP
        description: Expected completion date based on remaining duration.
      short_closed_by:
        type: VARCHAR
        description: User who short-closed the Business Object.
        values:
        - WCMS Admin
      short_closed_on:
        type: TIMESTAMP
        description: Timestamp when the Business Object was short-closed.
      current_active_milestone:
        type: VARCHAR
        description: Current active milestone.
      current_milestone_delay_days:
        type: INTEGER
        description: Days the current active milestone is delayed.
      current_milestone_expected_completion:
        type: VARCHAR
        description: Expected completion of the current active milestone.
      total_task_count:
        type: BIGINT
        description: Total number of tasks associated with the Business Object.
      open_task_count:
        type: BIGINT
        description: Number of open tasks associated with the Business Object.
      closed_task_count:
        type: BIGINT
        description: Number of closed tasks associated with the Business Object.
      delayed_task_count:
        type: BIGINT
        description: Number of delayed tasks associated with the Business Object.
      open_tasks_list:
        type: VARCHAR
        description: List of open task names associated with the Business Object.
  tms_business_object_attributes_flat:
    description: Dynamic JSON attributes for the Business Object, such as season, category, quality, etc.
    primary_key: business_object_id
    columns:
      business_object_id:
        type: INTEGER
        description: Unique identifier of the Business Object.
      category:
        type: VARCHAR
        description: Category attribute for the Business Object.
      initiative_type:
        type: VARCHAR
        description: Initiative type attribute.
      end_date:
        type: VARCHAR
        description: End date attribute, stored as text.
      season:
        type: VARCHAR
        description: 'Season attribute for the Business Object. Sparsely populated: only 16 of 307 rows
          have a value, and they all belong to the AR_NPD_YD_SALESPLAN, AR_SALESPLAN_Shirting and AR_SALESPLAN_Suiting
          types.'
        values:
        - Autumn
        - Dummy01
        - S6002
        - S6010
        - Summer
        - Winter
      program:
        type: VARCHAR
        description: Program attribute.
      request_receipt_date:
        type: VARCHAR
        description: Request receipt date attribute, stored as text.
      pi_date:
        type: VARCHAR
        description: PI date attribute, stored as text.
      stage:
        type: VARCHAR
        description: Stage attribute.
      data_color:
        type: VARCHAR
        description: Colour attribute recorded on the Business Object data.
      brandix_t_a:
        type: VARCHAR
        description: Brandix T&A attribute.
      csbd_date:
        type: VARCHAR
        description: CSBD date attribute, stored as text.
      batch_no:
        type: VARCHAR
        description: Batch number attribute.
      item_code:
        type: VARCHAR
        description: Item code attribute.
      volume:
        type: VARCHAR
        description: Volume attribute.
        values:
        - '1'
        - '100'
        - '12'
        - '132'
        - '15'
        - '2'
        - V1086
        - Vol001
      event:
        type: VARCHAR
        description: Event attribute.
      channel:
        type: VARCHAR
        description: Channel attribute.
        values:
        - '101'
        - '12'
        - DTR
        - TAS
        - WS
      vendor:
        type: VARCHAR
        description: Vendor attribute.
      total_qty:
        type: VARCHAR
        description: Total quantity attribute.
      moq:
        type: VARCHAR
        description: Minimum order quantity attribute.
      number_of_options:
        type: VARCHAR
        description: Number of options attribute.
      count:
        type: VARCHAR
        description: Count attribute. Quote this identifier in SQL; it collides with the COUNT function.
      merchant_name:
        type: VARCHAR
        description: Merchant name attribute.
      person:
        type: VARCHAR
        description: Person attribute.
      assign_date:
        type: VARCHAR
        description: Assign date attribute, stored as text.
      quality:
        type: VARCHAR
        description: Quality attribute for the Business Object. Present in the view but NULL for every
          row in this database, so no filter on it can return results.
      buyer:
        type: VARCHAR
        description: Buyer attribute.
      mcode_won_number:
        type: VARCHAR
        description: MCode/WON number attribute.
      ex_mill_date:
        type: VARCHAR
        description: Ex-mill date attribute, stored as text.
      garment_desc:
        type: VARCHAR
        description: Garment description attribute.
      matching_instruction:
        type: VARCHAR
        description: Matching instruction attribute.
      fabric_description:
        type: VARCHAR
        description: Fabric description attribute.
      dye_part:
        type: VARCHAR
        description: Dye part attribute.
      shade:
        type: VARCHAR
        description: Shade attribute.
      internal_or_confirmed:
        type: VARCHAR
        description: Internal-or-confirmed attribute.
      division:
        type: VARCHAR
        description: Division attribute.
      style_or_garment_code:
        type: VARCHAR
        description: Style or garment code attribute.
  tms_task_flat:
    description: Flat TMS task table containing task identity, assignment, status, dates, SLA/buffer,
      workflow/process context, Business Object context, and task-related business fields.
    primary_key: task_id
    columns:
      task_id:
        type: INTEGER
        description: Unique identifier of the task.
      task_code:
        type: VARCHAR
        description: Human-readable ticket/task code.
      task_machine_code:
        type: VARCHAR
        description: Machine-readable task code.
      task_display_name:
        type: VARCHAR
        description: User-facing display name of the task.
      task_status:
        type: VARCHAR
        description: 'Database status of the task, lowercase. Observed values: ''open'', ''closed''. This
          is the canonical status column -- use it for all filtering, grouping and status breakdowns.'
        values:
        - closed
        - open
      task_display_status:
        type: VARCHAR
        description: Capitalised presentation form of task_status ('Open', 'Closed'), for UI display only.
          Do not filter or group by this column; use task_status.
        values:
        - Closed
        - Open
      is_open_task:
        type: BOOLEAN
        description: Boolean flag, true when the task is open.
      is_closed_task:
        type: BOOLEAN
        description: Boolean flag, true when the task is closed.
      is_not_started_task:
        type: BOOLEAN
        description: Boolean flag, true when the task has not started.
      display_flag:
        type: INTEGER
        description: Indicates whether the task is configured to be displayed.
      instant_closer:
        type: INTEGER
        description: Indicates whether instant closure is configured for the task.
      reopen_count:
        type: INTEGER
        description: Number of times the task has been reopened.
      assigned_user_id:
        type: INTEGER
        description: Unique identifier of the user assigned to the task.
      assigned_user_name:
        type: VARCHAR
        description: Name of the user assigned to the task.
      assigned_role:
        type: VARCHAR
        description: Role to which the task is assigned.
        values:
        - Master Scheduler
        - admin
        - central_sales_team
        - channel_planning_team
        - design_team
        - design_team_and_sales_team
        - developer
        - planner
        - sales_team
        - sourcing_team
        - testertestertestertestertestertestertestertesterte
        - wh_team
      task_sub_department:
        type: VARCHAR
        description: Sub-department associated with the task.
      task_department:
        type: VARCHAR
        description: Department associated with the task.
        values:
        - Central Sales Team block
        - Channel Planning team block
        - Design Team block
        - Design team and Sales team block
        - Developer
        - Master Scheduler
        - Sales team block
        - Sourcing Team block
        - WH team block
        - planner
      created_at:
        type: TIMESTAMP
        description: Timestamp when the task was created.
      task_start_at:
        type: TIMESTAMP
        description: Timestamp when the task was scheduled to start.
      task_assigned_at:
        type: TIMESTAMP
        description: Timestamp when the task was assigned.
      task_closed_at:
        type: TIMESTAMP
        description: Timestamp when the task was closed.
      task_reopen_at:
        type: TIMESTAMP
        description: Timestamp when the task was reopened.
      next_followup_at:
        type: TIMESTAMP
        description: Timestamp of the next follow-up.
      is_followup:
        type: BOOLEAN
        description: Boolean flag, true when the task is a follow-up ticket.
      task_sla_hours:
        type: DOUBLE
        description: Allowed task duration / SLA buffer, in hours.
      task_elapsed_hours:
        type: DECIMAL
        description: Elapsed task duration in hours, already calculated by the view.
      task_elapsed_days:
        type: DOUBLE
        description: Elapsed task duration in days, already calculated by the view.
      is_delayed_open_task:
        type: VARCHAR
        description: '''Yes'' when an open task has breached SLA, else ''Not Applicable''.'
        values:
        - Not Applicable
        - 'Yes'
      is_delayed_closed_task:
        type: VARCHAR
        description: '''Yes'' when a closed task breached SLA, else ''Not Applicable''.'
        values:
        - Not Applicable
        - 'Yes'
      task_sla_status:
        type: VARCHAR
        description: SLA status of the task (e.g. Delayed, On Time).
        values:
        - Delayed
        - On Time
      bo_id:
        type: INTEGER
        description: Foreign key to tms_business_object_flat.business_object_id.
      business_object_ref_id:
        type: VARCHAR
        description: Reference ID of the associated Business Object.
      business_unit:
        type: VARCHAR
        description: Business unit of the parent Business Object.
        values:
        - PVH
        - unit1
      business_object_status:
        type: VARCHAR
        description: Status of the parent Business Object, as text.
        values:
        - Active
        - Closed
        - Short Closed
      business_object_type:
        type: VARCHAR
        description: Type of the associated Business Object.
      business_object_color:
        type: VARCHAR
        description: Priority/colour of the parent Business Object.
        values:
        - a_bl
        - b_re
        - d_gr
        - e_wh
      is_business_object_delayed:
        type: VARCHAR
        description: Indicates whether the parent Business Object is delayed.
        values:
        - 'No'
        - 'Yes'
  tms_user_flat:
    description: Flat TMS user table containing user identity, roles and organizational information.
    primary_key: user_id
    columns:
      user_id:
        type: BIGINT
        description: Unique identifier of the TMS user.
      user_name:
        type: VARCHAR
        description: Full name of the TMS user.
      role_count:
        type: BIGINT
        description: Number of roles mapped to the user.
      department_count:
        type: BIGINT
        description: Number of departments mapped to the user.
  tms_user_department_flat:
    description: 'Flat mapping of users to departments and sub-departments. Use this, not tms_user_flat,
      when a question needs a user''s department. Absent from v2.0.

      '
    columns:
      user_id:
        type: BIGINT
        description: Identifier of the TMS user.
      user_name:
        type: VARCHAR
        description: Full name of the TMS user.
      department:
        type: VARCHAR
        description: Department associated with the user.
      sub_department:
        type: VARCHAR
        description: Sub-department associated with the user.
  tms_role_flat:
    description: Flat TMS organizational role mapping table.
    primary_key: role_dept_id
    columns:
      role_dept_id:
        type: INTEGER
        description: Unique identifier of the role/department mapping.
      role:
        type: VARCHAR
        description: TMS role name.
      department:
        type: VARCHAR
        description: Department associated with the role.
      sub_department:
        type: VARCHAR
        description: Sub-department associated with the role.
      department_path:
        type: VARCHAR
        description: Full department/sub-department path for the role.
relationships:
- name: task_business_object
  from: tms_task_flat.bo_id
  to: tms_business_object_flat.business_object_id
  join_type: MANY_TO_ONE
  description: A task belongs to a Business Object.
- name: business_object_attributes
  from: tms_business_object_attributes_flat.business_object_id
  to: tms_business_object_flat.business_object_id
  join_type: ONE_TO_ONE
  description: Attributes for a business object.
terminology:
  business object: Also known as Initiative, Order, or BO. Represents a workflow process.
  delayed task: A task whose elapsed duration exceeds its SLA buffer.
  my tasks: Tasks assigned to the current user that are open and meant to be displayed.
ambiguities:
- subject: business object synonyms
  note: Initiative, Order, BO, and Business Object all refer to tms_business_object_flat.
- subject: task assignment
  note: Use assigned_user_id to check who is assigned to a task.
