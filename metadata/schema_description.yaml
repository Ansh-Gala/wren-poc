  tms_task_flat:
    description: Flat TMS task table containing task identity, assignment, status, dates, SLA/buffer,
      workflow/process context, Initiative context, and task-related business fields.
    primary_key: task_id
    columns:
      task_id:
        type: INTEGER
        description: Unique identifier of the task.
      task_code:
        type: VARCHAR
        description: Human-readable ticket/task code.
      task_machine_code:
        type: VARCHAR
        description: Machine-readable task code.
      task_display_name:
        type: VARCHAR
        description: User-facing display name of the task.
      task_status:
        type: VARCHAR
        description: 'Database status of the task, lowercase. Observed values: ''open'', ''closed''. This
          is the canonical status column -- use it for all filtering, grouping and status breakdowns.'
        values:
        - closed
        - open
      task_display_status:
        type: VARCHAR
        description: Capitalised presentation form of task_status ('Open', 'Closed'), for UI display only.
          Do not filter or group by this column; use task_status.
        values:
        - Closed
        - Open
      is_open_task:
        type: BOOLEAN
        description: Boolean flag, true when the task is open.
      is_closed_task:
        type: BOOLEAN
        description: Boolean flag, true when the task is closed.
      is_not_started_task:
        type: BOOLEAN
        description: Boolean flag, true when the task has not started.
      display_flag:
        type: INTEGER
        description: Indicates whether the task is configured to be displayed.
      instant_closer:
        type: INTEGER
        description: Indicates whether instant closure is configured for the task.
      reopen_count:
        type: INTEGER
        description: Number of times the task has been reopened.
      assigned_user_id:
        type: INTEGER
        description: Unique identifier of the user assigned to the task.
      assigned_user_name:
        type: VARCHAR
        description: Name of the user assigned to the task.
      assigned_role:
        type: VARCHAR
        description: Role to which the task is assigned.
        values:
        - Master Scheduler
        - admin
        - central_sales_team
        - channel_planning_team
        - design_team
        - design_team_and_sales_team
        - developer
        - planner
        - sales_team
        - sourcing_team
        - testertestertestertestertestertestertestertesterte
        - wh_team
      task_sub_department:
        type: VARCHAR
        description: Sub-department associated with the task.
      task_department:
        type: VARCHAR
        description: Department associated with the task.
        values:
        - Central Sales Team block
        - Channel Planning team block
        - Design Team block
        - Design team and Sales team block
        - Developer
        - Master Scheduler
        - Sales team block
        - Sourcing Team block
        - WH team block
        - planner
      created_at:
        type: TIMESTAMP
        description: Timestamp when the task was created.
      task_start_at:
        type: TIMESTAMP
        description: Timestamp when the task was scheduled to start.
      task_assigned_at:
        type: TIMESTAMP
        description: Timestamp when the task was assigned.
      task_closed_at:
        type: TIMESTAMP
        description: Timestamp when the task was closed.
      task_reopen_at:
        type: TIMESTAMP
        description: Timestamp when the task was reopened.
      next_followup_at:
        type: TIMESTAMP
        description: Timestamp of the next follow-up.
      is_followup:
        type: BOOLEAN
        description: Boolean flag, true when the task is a follow-up ticket.
      task_sla_hours:
        type: DOUBLE
        description: Allowed task duration / SLA buffer, in hours.
      task_elapsed_hours:
        type: DECIMAL
        description: Elapsed task duration in hours, already calculated by the view.
      task_elapsed_days:
        type: DOUBLE
        description: Elapsed task duration in days, already calculated by the view.
      is_delayed_open_task:
        type: VARCHAR
        description: '''Yes'' when an open task has breached SLA, else ''Not Applicable''.'
        values:
        - Not Applicable
        - 'Yes'
      is_delayed_closed_task:
        type: VARCHAR
        description: '''Yes'' when a closed task breached SLA, else ''Not Applicable''.'
        values:
        - Not Applicable
        - 'Yes'
      task_sla_status:
        type: VARCHAR
        description: SLA status of the task (e.g. Delayed, On Time).
        values:
        - Delayed
        - On Time
      business_unit:
        type: VARCHAR
        description: Business unit of the parent Initiative.
        values:
        - PVH
        - unit1
      initiative_id:
        type: INTEGER
        description: Foreign key to tms_initiative_flat.initiative_id.
      initiative_ref_id:
        type: VARCHAR
        description: Reference ID of the associated Initiative.
      initiative_status:
        type: VARCHAR
        description: Status of the parent Initiative, as text.
        values:
        - Active
        - Closed
        - Short Closed
      initiative_type:
        type: VARCHAR
        description: Type of the associated Initiative.
        values:
        - AR_NPD_Shirting
        - AR_NPD_Suiting
        - AR_NPD_YD_SALESPLAN
        - AR_NPD_YD_SHIRTING
        - AR_PD_Shirting
        - AR_PD_Suiting
        - AR_PRINT_Shirting
        - AR_SALESPLAN_Shirting
        - AR_SALESPLAN_Suiting
        - AR_YD_SHIRTING
        - AR_YD_Shirting
        - AR_YD_Suiting
        - TESTING_MG
        - test
      initiative_color:
        type: VARCHAR
        description: Priority/colour of the parent Initiative.
        values:
        - a_bl
        - b_re
        - d_gr
        - e_wh
      is_initiative_delayed:
        type: VARCHAR
        description: Indicates whether the parent Initiative is delayed.
        values:
        - 'No'
        - 'Yes'
