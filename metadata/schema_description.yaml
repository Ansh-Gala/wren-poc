# Generated by scripts/build_schema_description.py from the live database.
# Column names and types come from information_schema and must not be edited
# by hand. Descriptions ARE preserved across regeneration, so improving one
# here is safe; run --check in CI to catch drift from the database.
data_source: postgres
catalog: ''
schema: public
tables:
  tms_initiative_flat:
    description: Flat TMS Initiative table containing initiative identity, business unit, type, priority/color,
      due dates, buffers, workflow, process status, milestone and task summary information. Also known
      as Business Object, Order, or BO.
    primary_key: initiative_id
    columns:
      initiative_id:
        type: INTEGER
        description: 'Unique identifier of the Initiative / Business Object / Order / BO. A bare number
          after Initiative, Order, BO or Business Object means this column: "initiative 202" is initiative_id
          = 202. INTEGER, so write the number unquoted.'
      initiative_ref_id:
        type: VARCHAR
        description: 'Human-readable reference identifier of the Initiative. Use this only when the question
          asks for a reference, a ref id or a reference number. A bare "initiative 202" is initiative_id,
          not this. VARCHAR, so a value here is quoted.'
      business_unit:
        type: VARCHAR
        description: Business unit associated with the Initiative.
        values:
        - PVH
        - unit1
      initiative_type:
        type: VARCHAR
        description: 'Type of the Initiative, e.g. AR_YD_Suiting, AR_NPD_Shirting. This is the canonical
          column for the kind of item a question names: when a user says "AR_YD_Suiting items" or "TESTING_MG
          items", filter on this column. Values are case-sensitive and include near-duplicates that are
          genuinely distinct types (AR_YD_Shirting and AR_YD_SHIRTING). Do not substitute workflow_code
          or workflow_name for it.'
        values:
        - AR_NPD_Shirting
        - AR_NPD_Suiting
        - AR_NPD_YD_SALESPLAN
        - AR_NPD_YD_SHIRTING
        - AR_PD_Shirting
        - AR_PD_Suiting
        - AR_PRINT_Shirting
        - AR_PRINT_Suiting
        - AR_Print_Shirting
        - AR_Printing_Shirting
        - AR_SALESPLAN_Shirting
        - AR_SALESPLAN_Suiting
        - AR_YD_SHIRTING
        - AR_YD_Shirting
        - AR_YD_Suiting
        - TESTING_MG
        - test
      initiative_color:
        type: VARCHAR
        description: Priority/color classification of the Initiative.
        values:
        - Black
        - Green
        - Red
        - White
      initiative_note:
        type: VARCHAR
        description: Business note or remark associated with the Initiative.
      initiative_created_at:
        type: TIMESTAMP
        description: Timestamp when the Initiative was created.
      initiative_updated_at:
        type: TIMESTAMP
        description: Timestamp when the Initiative was last updated.
      initiative_client_due_at:
        type: TIMESTAMP
        description: Client/customer-required due date. Not the system/buffered due date.
      common_buffer:
        type: INTEGER
        description: Common buffer associated with the Initiative.
      buff_penetration_prcnt:
        type: REAL
        description: Percentage of buffer penetration.
      buff_penetration_days:
        type: INTEGER
        description: Buffer penetration expressed in days.
      total_remaining_duration:
        type: INTEGER
        description: Total remaining duration for the Initiative.
      days_to_due_date:
        type: INTEGER
        description: Days remaining until the due date; negative means the due date has passed.
      hold_days:
        type: INTEGER
        description: Number of days the Initiative has been on hold.
      workflow_id:
        type: INTEGER
        description: Identifier of the workflow associated with the Initiative.
      workflow_code:
        type: VARCHAR
        description: 'Code of the workflow attached to the Initiative. NOT a substitute for initiative_type:
          it is NULL for 72 of 307 rows and differs from the type on 75, so filtering on it silently drops
          rows. Use it only when the question is explicitly about the workflow rather than the item type.'
        values:
        - AR_NPD_Shirting
        - AR_NPD_Suiting
        - AR_PD_Shirting
        - AR_PD_Suiting
        - AR_PRINT_Shirting
        - AR_SALESPLAN_Shirting
        - AR_SALESPLAN_Suiting
        - AR_YD_Shirting
        - AR_YD_Suiting
        - TESTING_MG
        - test
      workflow_name:
        type: VARCHAR
        description: Name of the workflow attached to the Initiative. NULL for 72 of 307 rows, and like
          workflow_code not a substitute for initiative_type.
        values:
        - AR_NPD_Shirting
        - AR_NPD_Suiting
        - AR_PD_Shirting
        - AR_PD_Suiting
        - AR_PRINT_Shirting
        - AR_SALESPLAN_Shirting
        - AR_SALESPLAN_Suiting
        - AR_YD_Shirting
        - AR_YD_Suiting
        - TESTING_MG
        - test
      initiative_status:
        type: VARCHAR
        description: Initiative process status, mapped as Active, Closed, or Short Closed.
        values:
        - Active
        - Closed
        - Short Closed
      initiative_start_date:
        type: TIMESTAMP
        description: Start timestamp of the Initiative process.
      initiative_end_date:
        type: TIMESTAMP
        description: End timestamp of the Initiative process.
      elapsed_days:
        type: DOUBLE
        description: Elapsed duration of the process in days.
      initiative_expected_completion_date:
        type: TIMESTAMP
        description: Expected completion date based on remaining duration.
      short_closed_by:
        type: VARCHAR
        description: User who short-closed the Initiative.
        values:
        - WCMS Admin
      short_closed_on:
        type: TIMESTAMP
        description: Timestamp when the Initiative was short-closed.
      current_active_milestone:
        type: VARCHAR
        description: 'Current active milestone. Empty in this database: NULL in every row, so it cannot
          answer a question.'
      current_milestone_delay_days:
        type: INTEGER
        description: 'Days the current active milestone is delayed. Empty in this database: NULL in every
          row, so it cannot answer a question.'
      current_milestone_expected_completion:
        type: VARCHAR
        description: 'Expected completion of the current active milestone. Empty in this database: NULL
          in every row, so it cannot answer a question.'
      total_task_count:
        type: BIGINT
        description: Total number of tasks on this Initiative, pre-aggregated. Prefer it over counting
          tms_task_flat rows.
      open_task_count:
        type: BIGINT
        description: Number of open tasks on this Initiative, pre-aggregated. Prefer it over counting
          tms_task_flat rows.
      closed_task_count:
        type: BIGINT
        description: Number of closed tasks on this Initiative, pre-aggregated. Prefer it over counting
          tms_task_flat rows.
      delayed_task_count:
        type: BIGINT
        description: Number of currently delayed OPEN tasks on this Initiative. It does NOT include closed
          tasks that breached SLA. Use this column for "has delayed work outstanding"; join to tms_task_flat
          on task_sla_status = 'Delayed' if closed breaches should count too.
      open_tasks_list:
        type: VARCHAR
        description: List of open task names associated with the Initiative.
  tms_task_flat:
    description: Flat TMS task table containing task identity, assignment, status, dates, SLA/buffer,
      workflow/process context, Initiative context, and task-related business fields.
    primary_key: task_id
    columns:
      task_id:
        type: INTEGER
        description: Unique identifier of the task.
      task_code:
        type: VARCHAR
        description: Human-readable ticket/task code.
      task_machine_code:
        type: VARCHAR
        description: Machine-readable task code.
      task_display_name:
        type: VARCHAR
        description: User-facing display name of the task.
      task_status:
        type: VARCHAR
        description: 'Database status of the task, lowercase. Observed values: ''open'', ''closed''. This
          is the canonical status column -- use it for all filtering, grouping and status breakdowns.'
        values:
        - closed
        - open
      task_display_status:
        type: VARCHAR
        description: Capitalised presentation form of task_status ('Open', 'Closed'), for UI display only.
          Do not filter or group by this column; use task_status.
        values:
        - Closed
        - Open
      is_open_task:
        type: BOOLEAN
        description: Boolean flag, true when the task is open.
      is_closed_task:
        type: BOOLEAN
        description: Boolean flag, true when the task is closed.
      is_not_started_task:
        type: BOOLEAN
        description: Boolean flag, true when the task has not started.
      display_flag:
        type: INTEGER
        description: Indicates whether the task is configured to be displayed.
      instant_closer:
        type: INTEGER
        description: Indicates whether instant closure is configured for the task.
      reopen_count:
        type: INTEGER
        description: Number of times the task has been reopened.
      assigned_user_id:
        type: INTEGER
        description: Unique identifier of the user assigned to the task.
      assigned_user_name:
        type: VARCHAR
        description: 'Name of the user assigned to the task. The literal text ''NA'' is a stored value
          meaning nobody is assigned to the task -- it is not a null and not missing data. This column
          is never null, so IS NULL matches nothing; test assigned_user_name = ''NA'' instead.'
      assigned_role:
        type: VARCHAR
        description: Role to which the task is assigned.
        values:
        - Master Scheduler
        - admin
        - central_sales_team
        - channel_planning_team
        - design_team
        - design_team_and_sales_team
        - developer
        - planner
        - sales_team
        - sourcing_team
        - testertestertestertestertestertestertestertesterte
        - wh_team
      task_sub_department:
        type: VARCHAR
        description: Sub-department associated with the task.
      task_department:
        type: VARCHAR
        description: Department associated with the task.
        values:
        - Central Sales Team block
        - Channel Planning team block
        - Design Team block
        - Design team and Sales team block
        - Developer
        - Master Scheduler
        - Sales team block
        - Sourcing Team block
        - WH team block
        - planner
      created_at:
        type: TIMESTAMP
        description: Timestamp when the task was created.
      task_start_at:
        type: TIMESTAMP
        description: Timestamp when the task was scheduled to start.
      task_assigned_at:
        type: TIMESTAMP
        description: Timestamp when the task was assigned.
      task_closed_at:
        type: TIMESTAMP
        description: Timestamp when the task was closed. Kept when a task is reopened, so a few open tasks
          still have one; a count of closed tasks needs task_status = 'closed' as well.
      task_reopen_at:
        type: TIMESTAMP
        description: Timestamp when the task was reopened.
      next_followup_at:
        type: TIMESTAMP
        description: Timestamp of the next follow-up.
      is_followup:
        type: BOOLEAN
        description: Boolean flag, true when the task is a follow-up ticket.
      task_sla_hours:
        type: DOUBLE
        description: Allowed task duration / SLA buffer, in hours.
      task_elapsed_days:
        type: DECIMAL
        description: Elapsed task duration in days, rounded to 2 decimal places (e.g. 186.86), already
          calculated by the view.
      is_delayed_open_task:
        type: VARCHAR
        description: '''Yes'' when an open task has breached SLA, else ''Not Applicable''.'
        values:
        - Not Applicable
        - 'Yes'
      is_delayed_closed_task:
        type: VARCHAR
        description: '''Yes'' when a closed task breached SLA, else ''Not Applicable''.'
        values:
        - Not Applicable
        - 'Yes'
      task_sla_status:
        type: VARCHAR
        description: SLA status of the task (e.g. Delayed, On Time).
        values:
        - Delayed
        - On Time
      business_unit:
        type: VARCHAR
        description: Business unit of the parent Initiative.
        values:
        - PVH
        - unit1
      initiative_id:
        type: INTEGER
        description: Foreign key to tms_initiative_flat.initiative_id.
      initiative_ref_id:
        type: VARCHAR
        description: Reference ID of the associated Initiative.
      initiative_status:
        type: VARCHAR
        description: Status of the parent Initiative, as text.
        values:
        - Active
        - Closed
        - Short Closed
      initiative_type:
        type: VARCHAR
        description: Type of the associated Initiative, copied onto the task row so TASKS can be filtered
          by the type of the Initiative they belong to. A question about the items or Initiatives themselves
          -- how many there are, their status -- is about tms_initiative_flat, not this table.
        values:
        - AR_NPD_Shirting
        - AR_NPD_Suiting
        - AR_NPD_YD_SALESPLAN
        - AR_NPD_YD_SHIRTING
        - AR_PD_Shirting
        - AR_PD_Suiting
        - AR_PRINT_Shirting
        - AR_SALESPLAN_Shirting
        - AR_SALESPLAN_Suiting
        - AR_YD_SHIRTING
        - AR_YD_Shirting
        - AR_YD_Suiting
        - TESTING_MG
        - test
      initiative_color:
        type: VARCHAR
        description: Priority/colour of the parent Initiative.
        values:
        - a_bl
        - b_re
        - d_gr
        - e_wh
      is_initiative_delayed:
        type: VARCHAR
        description: Indicates whether the parent Initiative is delayed.
        values:
        - 'No'
        - 'Yes'
  tms_user_flat:
    description: Flat TMS user table containing user identity, roles and organizational information.
    primary_key: user_id
    columns:
      user_id:
        type: BIGINT
        description: Unique identifier of the TMS user.
      user_name:
        type: VARCHAR
        description: Full name of the TMS user.
      role_count:
        type: BIGINT
        description: Number of roles mapped to the user.
      department_count:
        type: BIGINT
        description: Number of departments mapped to the user.
  tms_user_department_flat:
    description: Flat mapping of users to departments and sub-departments. Use this, not tms_user_flat,
      when a question needs a user's department.
    columns:
      user_id:
        type: BIGINT
        description: Identifier of the TMS user.
      user_name:
        type: VARCHAR
        description: Full name of the TMS user.
      department:
        type: VARCHAR
        description: Department associated with the user.
      sub_department:
        type: VARCHAR
        description: Sub-department associated with the user.
  tms_role_flat:
    description: Flat TMS organizational role mapping table.
    primary_key: role_dept_id
    columns:
      role_dept_id:
        type: INTEGER
        description: Unique identifier of the role/department mapping.
      role:
        type: VARCHAR
        description: TMS role name.
      department:
        type: VARCHAR
        description: Department associated with the role.
      sub_department:
        type: VARCHAR
        description: Sub-department associated with the role.
      department_path:
        type: VARCHAR
        description: Full department/sub-department path for the role.
  tms_attachment_flat:
    description: Files attached to an Initiative or one of its tasks, joined to the tag that classifies
      them and to the stored file record. One row per attachment, 111 attachments across 48 Initiatives.
      Only active attachments are present, so this table cannot answer questions about deleted or inactive
      ones.
    primary_key: task_id
    columns:
      initiative_id:
        type: INTEGER
        description: The Initiative this attachment belongs to. Joins to tms_initiative_flat.initiative_id.
      task_id:
        type: INTEGER
        description: The task this attachment belongs to. Joins to tms_task_flat.task_id. Unique in this
          view, one row per task.
      tag_name:
        type: VARCHAR
        description: What the attachment is for, from the tagging configuration, for example 'Costing
          details and mail copy'. This is the column to filter on when a question names a kind of document.
        values:
        - Attach email from sales team
        - Blend and Merchants final selection
        - Costing details and mail copied to Sales
        - Costing files from each vendor
        - Data base and CAD number
        - EPI PPI Sheet
        - Final Excel with EPI PPI
        - Final sourcing plan
        - Generated PO
        - Generated PR
        - Mail containing updates
        - Mail to vendors
        - Mail with Merchants and MOQs
        - Mail with- Region, Blends, Variety , Shade
        - Mail/Suggestion sheet
        - 'Penelope copy of Color pallet '
        - Priority list
        - SO number, tech sheet and CAD number
        - SO number, tech sheet and CAD numbers
        - Tech sheet
        - Vendor to merchant list
        - test attachment 3
      tag_desc:
        type: VARCHAR
        description: Description of the tag. Empty in this database, '' in every row, so a filter on it
          returns nothing. Do not use it to answer a question; say the data is not held instead.
      folder_path:
        type: VARCHAR
        description: Storage folder the file was filed under.
        values:
        - ArvindRetail/Sales
        - ArvindRetail/Shirting
        - ArvindRetail/Suiting
        - bo_files
      task_names:
        type: VARCHAR
        description: Comma-separated task names the tag applies to. Configuration of the tag, not of this
          attachment.
      extensions:
        type: VARCHAR
        description: Comma-separated file extensions the tag permits. Configuration of the tag, not of
          this attachment, so it does not say what this file's extension is. For that, read file_name.
        values:
        - msg
        - pptx,docx,csv,xlsx,jpeg,png,pdf
        - pptx,docx,csv,xlsx,jpeg,png,pdf,msg,oft,eml,zip
      max_file_size:
        type: VARCHAR
        description: Maximum upload size the tag permits, in bytes, held as text. Configuration of the
          tag. It is not this file's size, which is file_size, and file_size is in KB, so multiply
          file_size by 1024 before comparing the two.
        values:
        - '2097152'
        - '20971520'
      initiative_name:
        type: VARCHAR
        description: Despite its name this holds Initiative TYPE values such as AR_YD_Shirting and AR_NPD_Shirting,
          the same vocabulary as tms_initiative_flat.initiative_type. It is the Initiative type the tag
          applies to, configuration of the tag rather than a name of any one Initiative. To filter attachments
          by the type of their Initiative, join tms_initiative_flat on initiative_id instead.
        values:
        - AR_NPD_Shirting
        - AR_PD_Shirting
        - AR_PD_Suiting
        - AR_SALESPLAN_Shirting
        - AR_SALESPLAN_Suiting
        - AR_YD_Shirting
        - AR_YD_Suiting
        - TESTING_MG
      sequence:
        type: INTEGER
        description: Ordering position of the tag. Empty in this database, 0 in every row, so ordering
          by it does nothing. Do not use it to answer a question; say the data is not held instead.
      file_name:
        type: VARCHAR
        description: Name of the uploaded file, including its extension.
      file_uri:
        type: VARCHAR
        description: Storage URI of the uploaded file.
      file_size:
        type: DECIMAL
        description: Size of this uploaded file in KB (1 KB = 1024 bytes), rounded to 2 decimal places
          (e.g. 17.95), already calculated by the view. This is the real size of the file; max_file_size
          is the tag's limit, in bytes.
      entity_type:
        type: VARCHAR
        description: Empty in this database, '' in every row, because the view selects only rows where
          it is null or empty. Do not use it to answer a question; say the data is not held instead.
      entity_id:
        type: VARCHAR
        description: Empty in this database, '' in every row. Do not use it to answer a question; say
          the data is not held instead.
      status:
        type: VARCHAR
        description: Constant in this database, 'active' in every row, because the view selects only active
          attachments. A count of active attachments is therefore just a count of rows, and there are
          no inactive ones to find.
        values:
        - active
      attachment_created_at:
        type: TIMESTAMP
        description: When the attachment was uploaded.
      attachment_created_by_user_id:
        type: INTEGER
        description: User who uploaded the attachment. Joins to tms_user_flat.user_id.
  tms_task_issue_flat:
    description: Issues raised against a task, with a count of their comments and the most recent one.
      25 issues across 8 tasks. It has no Initiative column, so to reach the Initiative join tms_task_flat
      on task_id.
    primary_key: issue_id
    columns:
      issue_id:
        type: INTEGER
        description: The issue's own identifier, and the only thing that reliably tells one issue from
          another here, because titles repeat. Project it whenever a person is being shown individual
          issues rather than a count.
      task_id:
        type: INTEGER
        description: The task the issue was raised against. Joins to tms_task_flat.task_id. The 25 issues
          fall on only 8 distinct tasks, so counting issues and counting tasks with issues give very different
          answers.
      issue_title:
        type: VARCHAR
        description: Short title of the issue.
      issue_description:
        type: VARCHAR
        description: Free-text description of the issue.
        values:
        - TEST
        - abc
        - issue test
        - issue_desc
      issue_sub_department:
        type: VARCHAR
        description: Sub-department the issue was raised against, resolved from the issue's department
          role.
        values:
        - Arvind Retail QA Team
        - Central Sales Team
        - Design Team
        - QA and Design Team
        - Sales team
        - Sourcing Team
        - User Management
      issue_category_name:
        type: VARCHAR
        description: The issue category as a name, for example 'Delay from Vendor'. This is the column
          to filter on when a question names a reason or a category.
        values:
        - Delay due to internal training
        - Delay from Vendor
        - Delay in Manufacturing
        - Incorrect format used
        - Mail not received
        - Other Issues
        - Stock Mismatch
      issue_status:
        type: VARCHAR
        description: Issue status. The vocabulary differs from tasks, an issue may be 'resolved' as well
          as 'open' or 'closed', and tms_task_flat.task_status has no such value. A question about resolved
          work means issues, not tasks.
        values:
        - closed
        - open
        - resolved
      issue_hold_days:
        type: INTEGER
        description: Days the issue was on hold. Empty in this database, 0 in every row, so a filter on
          it returns nothing. Do not use it to answer a question; say the data is not held instead.
      issue_assigned_user_id:
        type: INTEGER
        description: User the issue is assigned to. Joins to tms_user_flat.user_id.
      issue_resolved_by_user_id:
        type: BIGINT
        description: User who resolved the issue. Joins to tms_user_flat.user_id. NULL while the issue
          is unresolved.
      issue_closed_by_user_id:
        type: BIGINT
        description: User who closed the issue. Joins to tms_user_flat.user_id. NULL while the issue is
          unclosed.
      issue_created_by_user_id:
        type: BIGINT
        description: User who raised the issue. Joins to tms_user_flat.user_id.
      issue_updated_by_user_id:
        type: BIGINT
        description: User who last updated the issue. Joins to tms_user_flat.user_id.
      issue_created_at:
        type: TIMESTAMP
        description: When the issue was raised.
      issue_updated_at:
        type: TIMESTAMP
        description: When the issue was last updated.
      issue_resolved_at:
        type: TIMESTAMP
        description: When the issue was resolved. NULL unless it was resolved, so an average over it covers
          only the resolved ones.
      issue_closed_at:
        type: TIMESTAMP
        description: When the issue was closed. NULL while the issue is still open.
      comment_count:
        type: BIGINT
        description: 'Number of comments on this one issue, pre-aggregated. To total the comments across
          issues use SUM(comment_count): COUNT(*) counts issues, not comments, and the two differ sharply
          here because only 7 of the 25 issues have any comment at all -- 25 against 12. For the same
          reason an average across all issues is mostly zeroes.'
      last_comment:
        type: VARCHAR
        description: Text of the most recent comment, or NULL where there are none.
        values:
        - Attaching the details of products
        - Attaching the product details
        - Fixed the incorrect formatting
        - cde
        - resolved
        - test comment
      last_comment_at:
        type: TIMESTAMP
        description: When the most recent comment was posted. NULL for issues with no comments.
  vf_report_task_summary:
    description: 'Weekly history of open and closed work, one snapshot per week. The only table that
      can answer how counts changed over time -- week by week, last week, a past month -- so use it for
      trends and past weeks, and tms_task_flat for the current state. The current week''s snapshot is
      rebuilt a few times a day. It holds two kinds of row that must never be added together: report_type
      IS NULL rows count tasks, report_type = ''initiative'' rows count distinct Initiatives. Every query
      filters one kind. The open_* columns are counts at the moment of the snapshot, so never SUM them
      across weeks: take one week, or one row per week. The close_* columns count what closed during
      that week, so they can be summed over a range. Weeks are not continuous here: there is no snapshot
      between 13 April and 27 July 2026, and the latest is 24 August 2026, so the latest week is MAX(dt),
      not the current date, and a range such as "the last 4 weeks" can return nothing.'
    columns:
      dt:
        type: INTEGER
        description: 'The week, as the Unix epoch of Monday 00:00 India time. Order and compare weeks by
          this column. To show the week as a date use timezone(''Asia/Kolkata'', to_timestamp(dt))::date,
          which gives the Monday of that week. The latest week is the row with MAX(dt); last week is the
          next lower dt.'
      assigned_uid:
        type: INTEGER
        description: User the counted tasks are assigned to. Joins to tms_user_flat.user_id, which holds
          the full name to show. 2 is NA, meaning unassigned. 0 on Initiative rows, which have no user.
      name:
        type: VARCHAR
        description: Login name of the assigned user, not the full name. Show tms_user_flat.user_name
          instead. Empty on Initiative rows.
      assigned_role:
        type: VARCHAR
        description: Role the counted tasks are assigned to. Matches tms_role_flat.role, which gives the
          department. Empty on Initiative rows.
      task_display_name:
        type: VARCHAR
        description: Name of the task step being counted. Empty on Initiative rows.
      unit:
        type: VARCHAR
        description: Business unit of the Initiative. Empty on Initiative rows.
        values:
        - PVH
        - unit1
      open_green:
        type: INTEGER
        description: Open at the snapshot with colour green. On task rows it counts tasks, on Initiative
          rows distinct Initiatives. Never sum across weeks.
      open_yellow:
        type: INTEGER
        description: Open at the snapshot with colour yellow. Same rules as open_green.
      open_red:
        type: INTEGER
        description: Open at the snapshot with colour red. Same rules as open_green.
      open_black:
        type: INTEGER
        description: Open at the snapshot with colour black. Same rules as open_green.
      close_green:
        type: INTEGER
        description: Tasks closed during that week with colour green. Can be summed across weeks. Use it
          on task rows only; on Initiative rows it is not a reliable count.
      close_yellow:
        type: INTEGER
        description: Tasks closed during that week with colour yellow. Same rules as close_green.
      close_red:
        type: INTEGER
        description: Tasks closed during that week with colour red. Same rules as close_green.
      close_black:
        type: INTEGER
        description: Tasks closed during that week with colour black. Same rules as close_green.
      bo_type:
        type: VARCHAR
        description: Initiative type, the same vocabulary as tms_initiative_flat.initiative_type.
      report_type:
        type: VARCHAR
        description: Which kind of row this is. NULL for task rows, 'initiative' for Initiative rows.
          Every query filters on it.
        values:
        - initiative
      field_1:
        type: VARCHAR
        description: Category of the Initiative.
        values:
        - Apparel
        - Apparel2
        - Apparel6
        - Clothing
        - event01
        - Heather
        - Pants
        - Prints
        - Shirting
        - Suiting
      field_2:
        type: VARCHAR
        description: Empty in this database, '' in every row. Do not use it.
      field_3:
        type: VARCHAR
        description: Empty in this database, '' in every row. Do not use it.
      field_4:
        type: VARCHAR
        description: Empty in this database, '' in every row. Do not use it.
      field_5:
        type: VARCHAR
        description: Empty in this database, '' in every row. Do not use it.
      field_6:
        type: VARCHAR
        description: Empty in this database, '' in every row. Do not use it.
      field_7:
        type: VARCHAR
        description: Empty in this database, '' in every row. Do not use it.
      field_8:
        type: VARCHAR
        description: Empty in this database, '' in every row. Do not use it.
      week:
        type: VARCHAR
        description: Week of the month as a label, W1 to W5. Not unique across months; use dt.
      week_of_month:
        type: VARCHAR
        description: Week label such as 'W5 - Aug 26'. It sorts wrongly as text, so never ORDER BY it
          and never use it as a chart's time axis; use dt.
      last_week_dt:
        type: INTEGER
        description: Empty in this database, NULL in every row. Do not use it.
      month:
        type: VARCHAR
        description: Month of the week as a three-letter name, such as 'Aug'. Use it with year.
      year:
        type: INTEGER
        description: Year of the week.
      bucket:
        type: VARCHAR
        description: 'How late the counted open tasks are, on task rows only. B1 is up to 7 days past
          the SLA, B2 is 7 to 15 days, B3 is more than 15 days. NULL or a blank means not late. Delayed
          work is TRIM(bucket) IN (''B1'', ''B2'', ''B3''). Lateness comes from this column only, never
          from the colour columns.'
        values:
        - B1
        - B2
        - B3
      open_white:
        type: INTEGER
        description: Empty in this database, 0 in every row. Do not use it.
      close_white:
        type: INTEGER
        description: Empty in this database, 0 in every row. Do not use it.
relationships:
- name: task_initiative
  from: tms_task_flat.initiative_id
  to: tms_initiative_flat.initiative_id
  join_type: MANY_TO_ONE
  description: A task belongs to an Initiative.
- name: attachment_initiative
  from: tms_attachment_flat.initiative_id
  to: tms_initiative_flat.initiative_id
  join_type: MANY_TO_ONE
  description: An attachment belongs to an Initiative.
- name: attachment_task
  from: tms_attachment_flat.task_id
  to: tms_task_flat.task_id
  join_type: ONE_TO_ONE
  description: An attachment belongs to a task. One attachment per task in this data.
- name: task_issue_task
  from: tms_task_issue_flat.task_id
  to: tms_task_flat.task_id
  join_type: MANY_TO_ONE
  description: An issue is raised against a task. Join through here to reach the Initiative, which the
    issue view does not carry.
- name: weekly_history_user
  from: vf_report_task_summary.assigned_uid
  to: tms_user_flat.user_id
  join_type: MANY_TO_ONE
  description: The user a weekly task count belongs to. Task rows only; Initiative rows have 0 here.
ambiguities:
- subject: initiative synonyms
  note: Initiative, Order, BO, and Business Object all refer to tms_initiative_flat.
- subject: task assignment
  note: Use assigned_user_id to check who is assigned to a task.
terminology:
  initiative: Also known as Business Object, Order, or BO. Represents a workflow process.
  delayed task: A task whose elapsed duration exceeds its SLA buffer.
  my tasks: Tasks assigned to the current user that are open and meant to be displayed.
  attachment: A file uploaded against an Initiative or one of its tasks. Only active attachments are held.
  issue: A problem raised against a task. Issues have their own status vocabulary and may be 'resolved',
    which tasks never are.
