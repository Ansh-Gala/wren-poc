    - task_status
    value_columns:
    - column: task_rem_duration
      aggFunc: sum
    - column: task_completion
      aggFunc: avg
    notes:
    - Always output the project with a task (task names repeat). Output the WBS task_id next to the name; keep task_uid
      as the reference id, shown last.
    - 'task_status_id is never shown: output the status name (derived task_status).'
    - gant_task_type is used to tell leaf / parent / milestone apart in filters; describe the kind in words if the
      user needs it, not with the raw value 'project' (which would read as a project).
    - 'Stagnancy and elapsed days are meaningful only for Started tasks (task_status_id = 3); the task screens blank
      them otherwise: CASE WHEN t.task_status_id = 3 THEN t.task_stagnancy END.'
    - is_flowobstacle_task is also true for critical tasks; add task_is_critical = false to match the Flow Obstacle
      screen.
    - last_x_days_completion covers a configurable window (7 days by default); a task with no history in the window
      shows its full completion.
    - task_latest_remark is free text; show it only when the question is about remarks.
